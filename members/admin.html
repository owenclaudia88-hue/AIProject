<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — AI Founder University</title>
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--bg-2:#111113;--bg-3:#161619;--bg-4:#1c1c20;
  --line:#242429;--line-2:#33333a;--txt:#f4f4f5;--txt-2:#a1a1aa;--txt-3:#71717a;
  --accent:#ff7a1a;--accent-2:#ffb020;--green:#34d399;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

#gate{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#gate p{color:var(--txt-2);max-width:460px;line-height:1.6}
#gate a{color:var(--accent-2);text-decoration:underline}

#app{display:none;max-width:1100px;margin:0 auto;padding:clamp(20px,3vw,40px)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:900;font-size:.78rem;flex:none}
h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;letter-spacing:-.03em;margin:0}
.who{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--txt-3)}
.sub{color:var(--txt-2);font-family:var(--mono);font-size:.88rem;margin:0 0 26px}

.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab{background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);border-radius:999px;padding:9px 18px;font-size:.9rem;cursor:pointer}
.tab.on{background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.34);color:#ffd9b3;font-weight:600}
.tab .n{font-family:var(--mono);font-size:.74rem;color:var(--txt-3);margin-left:7px}
.tab.on .n{color:var(--accent-2)}

.card{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card .hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card .hd b{font-size:1rem}
.card .meta{font-family:var(--mono);font-size:.74rem;color:var(--txt-3)}
.card p{margin:9px 0 0;color:var(--txt-2);font-size:.92rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.card .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.card .acts button{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.74rem;cursor:pointer}
.card .acts button:hover{border-color:var(--accent);color:var(--accent-2)}
.card .acts button.on{background:rgba(255,122,26,.14);border-color:rgba(255,122,26,.4);color:#ffd9b3}
.card .acts button.danger:hover{border-color:#f87171;color:#fca5a5}

.st{flex:none;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--txt-2);background:var(--bg-3)}
.st.new{color:var(--accent-2);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.12)}
.st.planned{color:#93c5fd;border-color:rgba(147,197,253,.4);background:rgba(147,197,253,.12)}
.st.done{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12)}
.st.declined{color:var(--txt-3)}
.badge{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,122,26,.16);color:var(--accent-2);border:1px solid rgba(255,122,26,.3)}
.reply{margin-left:16px;border-left:2px solid var(--line-2);padding-left:14px}
.removed{opacity:.55;font-style:italic}
.empty{color:var(--txt-3);font-family:var(--mono);font-size:.88rem;padding:40px 0;text-align:center}
.back{display:inline-block;margin-top:30px;color:var(--txt-2);font-family:var(--mono);font-size:.85rem}
.back:hover{color:var(--accent-2)}

/* the brand lockup — one image, so it cannot drift between pages */
/* Sized by width, not height. A fixed height plus the global img{max-width:100%}
   let a narrow header clamp the width while the height stayed put, which
   stretched the lockup out of shape at 320px. */
.brand-logo{width:176px;max-width:44vw;height:auto;display:block;flex:none}
@media(max-width:600px){.brand-logo{width:150px}}

/* ---------- members view ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;flex-direction:column;gap:3px}
.stat .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.stat .l{font-family:var(--mono);font-size:.74rem;color:var(--txt-3)}
.stat .s{font-family:var(--mono);font-size:.7rem;color:var(--txt-3);opacity:.75}
.warn{font-family:var(--mono);font-size:.8rem;color:var(--accent-2);margin:0 0 14px}
.alert{background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.32);border-radius:14px;
  padding:14px 18px;margin-bottom:12px}
.alert b{color:var(--accent-2)}
.alert p{margin:6px 0 0;color:var(--txt-2);font-size:.88rem;line-height:1.55}
.sech{font-size:1rem;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sech .meta{font-family:var(--mono);font-size:.74rem;color:var(--txt-3);font-weight:400}
.dl{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin:4px 0 2px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl a{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;
  padding:6px 14px}
.dl a:hover{border-color:var(--accent);color:var(--accent-2)}
.dl .bulk{background:rgba(255,122,26,.14);border:1px solid rgba(255,122,26,.4);color:#ffd9b3;
  border-radius:999px;padding:7px 15px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.dl .bulk:hover{border-color:var(--accent)}
.dl .bulk:disabled{opacity:.6;cursor:default}
.sched{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg-2);
  border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;
  font-family:var(--mono);font-size:.8rem;color:var(--txt-2)}
.sched .tog{display:flex;align-items:center;gap:8px;cursor:pointer}
.sched .tog input{width:16px;height:16px;accent-color:var(--accent)}
.sched .sep{color:var(--txt-3)}
.sched input[type=number]{width:74px;background:var(--bg-3);border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:.8rem}
.sched input[type=number]:focus{outline:none;border-color:var(--accent)}
.sched .bulk{background:rgba(255,122,26,.14);border:1px solid rgba(255,122,26,.4);color:#ffd9b3;
  border-radius:999px;padding:7px 15px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.sched .hint{flex:1 1 100%;color:var(--txt-3);font-size:.74rem}

/* ---------- staff sign-in ---------- */
#staff-signin{width:min(380px,90vw);text-align:left}
#staff-signin h2{color:var(--txt)}
#staff-signin input{width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:13px 14px;font-size:.95rem;font-family:inherit}
#staff-signin input:focus{outline:none;border-color:var(--accent)}
#staff-signin button{width:100%;margin-top:10px;background:linear-gradient(180deg,var(--accent-2),var(--accent));
  color:#1a0d00;border:0;border-radius:10px;padding:13px 16px;font-size:.95rem;font-weight:800;
  font-family:inherit;cursor:pointer}
#staff-signin button:disabled{opacity:.6;cursor:default}
#staff-signin .note{margin-top:14px;font-size:.85rem;color:var(--txt-2);line-height:1.5}
</style>
</head>
<body>

  <div id="gate"><div>
    <p id="gate-msg">Checking your access&hellip;</p>
    <!-- Staff sign in here rather than through the member login: an admin
         account is not a customer account and has nothing to buy. -->
    <form id="staff-signin" hidden autocomplete="on">
      <img class="brand-logo" src="../assets/logo.webp" alt="AI Founder University" width="720" height="139" style="margin:0 auto 22px">
      <h2 style="margin:0 0 6px;font-size:1.2rem">Staff sign-in</h2>
      <p style="margin:0 0 18px">Enter your staff address and we'll email you a sign-in link.</p>
      <input type="email" id="staff-email" name="email" required placeholder="you@aifounderuniversity.com"
             autocomplete="username" spellcheck="false">
      <button type="submit" id="staff-go">Email me a link</button>
      <p class="note" id="staff-note" hidden></p>
    </form>
  </div></div>

  <div id="app">
    <div class="top">
      <img class="brand-logo" src="../assets/logo.webp" alt="AI Founder University" width="720" height="139">
      <h1>Admin</h1>
      <span class="who" id="who"></span>
    </div>
    <p class="sub">Members, content requests, and every comment left on a course.</p>

    <div class="tabs">
      <button class="tab on" data-tab="requests">Content requests<span class="n" id="n-req">0</span></button>
      <button class="tab" data-tab="comments">Course comments<span class="n" id="n-com">0</span></button>
      <button class="tab" data-tab="members">Members<span class="n" id="n-mem">0</span></button>
    </div>

    <div id="panel"></div>
    <a class="back" href="index.html">&larr; Back to the member area</a>
  </div>

<script>
(function () {
  var STATUSES = ['new', 'planned', 'done', 'declined'];
  var data = { requests: [], comments: [] };
  var members = null;          // loaded the first time the tab is opened
  var membersError = '';
  var tab = 'requests';

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function when(iso){
    var t = new Date(iso).getTime(); if (!t) return '';
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }

  fetch('/api/admin/overview', { credentials: 'same-origin' })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (res) {
      if (res.status === 200) {
        data = res.d;
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        counts(); paint(); wire();
      } else if (res.status === 403) {
        document.getElementById('gate-msg').innerHTML =
          'That account is not a staff account. <a href="index.html">Back to the member area</a>';
      } else {
        // Not signed in. Offer the staff sign-in rather than sending them to
        // the member login, which would turn them away for not having bought.
        document.getElementById('gate-msg').hidden = true;
        document.getElementById('staff-signin').hidden = false;
        document.getElementById('staff-email').focus();
      }
    })
    .catch(function () {
      document.getElementById('gate-msg').textContent = 'Could not load the admin view. Please refresh.';
    });

  /* ---------------- staff sign-in ---------------- */
  document.getElementById('staff-signin').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('staff-go');
    var note = document.getElementById('staff-note');
    var email = document.getElementById('staff-email').value.trim();
    if (!email) return;

    btn.disabled = true; btn.textContent = 'Sending…';
    fetch('/api/auth/request-link', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        // The reply is the same whether or not the address is known, so that
        // this cannot be used to find out who has an account.
        note.textContent = d.message || 'If that address has access, a sign-in link is on its way.';
        note.hidden = false;
        btn.textContent = 'Email me a link';
        btn.disabled = false;
      })
      .catch(function () {
        note.textContent = 'Could not send the link. Please try again.';
        note.hidden = false;
        btn.textContent = 'Email me a link';
        btn.disabled = false;
      });
  });

  /* ---------------- members ---------------- */

  function money(cents, cur) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: (cur || 'usd').toUpperCase() }).format((cents || 0) / 100); }
    catch (e) { return ((cents || 0) / 100).toFixed(2) + ' ' + String(cur || '').toUpperCase(); }
  }
  function day(iso) { var t = new Date(iso).getTime(); return t ? new Date(t).toLocaleDateString() : ''; }

  function paintMembers(p) {
    if (membersError) { p.innerHTML = '<p class="empty">' + esc(membersError) + '</p>'; return; }
    if (!members) {
      p.innerHTML = '<p class="empty">Loading members&hellip;</p>';
      fetch('/api/admin/members', { credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (res) {
          if (res.status !== 200) { membersError = res.d.error || 'Could not load members.'; }
          else { members = res.d; document.getElementById('n-mem').textContent = res.d.counts.active + ' active'; }
          if (tab === 'members') paintMembers(document.getElementById('panel'));
        })
        .catch(function () {
          membersError = 'Could not load members.';
          if (tab === 'members') paintMembers(document.getElementById('panel'));
        });
      return;
    }

    var f = members.funnel;
    var h = '';

    /* the numbers */
    h += '<div class="stats">' +
      stat(members.counts.active, 'Active members') +
      stat(members.counts.revoked, 'Revoked') +
      (f ? stat(f.people, 'Reached checkout') : '') +
      (f ? stat(f.conversionRate + '%', 'Converted to paid', f.converted + ' of ' + f.people) : '') +
      '</div>';
    if (members.funnelError) h += '<p class="warn">' + esc(members.funnelError) + '</p>';

    /* paid but no access — the thing that needs acting on */
    if (f && f.paidWithoutAccess && f.paidWithoutAccess.length) {
      h += '<div class="alert"><b>' + f.paidWithoutAccess.length + ' paid but have no access.</b>' +
        '<p>A payment went through and the account was never created — usually a webhook that did not arrive. Granting access here also sends them the welcome email with their sign-in link.</p></div>';
      f.paidWithoutAccess.forEach(function (x) {
        h += '<div class="card"><div class="hd"><b>' + esc(x.name || x.email) + '</b>' +
          '<span class="st new">paid, no access</span>' +
          '<span class="meta" style="margin-left:auto">' + esc(x.email) + ' · ' + money(x.amount, x.currency) + ' · ' + esc(day(x.createdAt)) + '</span></div>' +
          '<div class="acts"><button data-act="grant" data-email="' + esc(x.email) + '" data-pi="' + esc(x.paymentIntent) + '" data-name="' + esc(x.name || '') + '">Give access &amp; email them</button></div></div>';
      });
    }

    /* downloads */
    h += '<div class="dl">Download: ' +
      '<a href="/api/admin/export?set=members">members</a>' +
      '<a href="/api/admin/export?set=leads">non-buyers</a>' +
      '<a href="/api/admin/export?set=all">everyone</a></div>';

    /* the members themselves */
    h += '<h3 class="sech">Members</h3>';
    if (!members.members.length) h += '<p class="empty">No members yet.</p>';
    members.members.forEach(function (m) {
      var active = m.status === 'active';
      h += '<div class="card"><div class="hd"><b>' + esc(m.name) + '</b>' +
        '<span class="st ' + (active ? 'done' : 'declined') + '">' + esc(m.status) + '</span>' +
        '<span class="meta" style="margin-left:auto">' + esc(m.email) + ' · joined ' + esc(day(m.joinedAt)) + '</span></div>' +
        '<div class="acts">' +
          (active
            ? '<button class="danger" data-act="revoke" data-email="' + esc(m.email) + '">Cancel access</button>'
            : '<button data-act="restore" data-email="' + esc(m.email) + '">Restore access</button>') +
          (m.paymentIntent ? '<button class="danger" data-act="refund" data-email="' + esc(m.email) + '">Refund&hellip;</button>' : '') +
        '</div></div>';
    });

    /* everyone who started and did not finish */
    if (f && f.didNotConvert && f.didNotConvert.length) {
      // who could still be written to: not unsubscribed, not already reminded
      var canRemind = f.didNotConvert.filter(function (x) { return !x.unsubscribed && !x.remindedAt; });
      h += '<h3 class="sech">Started checkout, did not buy <span class="meta">' + f.didNotConvert.length + '</span></h3>';

      // the automatic schedule, and the switch for it
      var rs = members.reminders || { enabled: true, delayHours: 2 };
      h += '<div class="sched">' +
        '<label class="tog"><input type="checkbox" id="rem-on"' + (rs.enabled ? ' checked' : '') + '>' +
          '<span>Email them automatically</span></label>' +
        '<span class="sep">after</span>' +
        '<input type="number" id="rem-hours" min="0.25" max="168" step="0.25" value="' + esc(rs.delayHours) + '">' +
        '<span class="sep">hours</span>' +
        '<button class="bulk" id="rem-save">Save</button>' +
        '<span class="hint" id="rem-hint">Checked every 15 minutes. Anyone already reminded or unsubscribed is skipped.</span>' +
        '</div>';

      if (canRemind.length) {
        h += '<div class="dl" style="margin-bottom:12px">' +
          '<button class="bulk" id="remind-all">Send to all ' + canRemind.length + ' now</button>' +
          '<span>Don\'t wait for the schedule.</span></div>';
      }
      f.didNotConvert.forEach(function (x) {
        var note = x.unsubscribed ? '<span class="st declined">unsubscribed</span>'
          : x.remindedAt ? '<span class="st planned">reminded ' + esc(day(x.remindedAt)) + '</span>' : '';
        h += '<div class="card"><div class="hd"><b>' + esc(x.name || x.email) + '</b>' + note +
          '<span class="meta" style="margin-left:auto">' + esc(x.email) + ' · ' + esc(day(x.createdAt)) + '</span></div>' +
          (x.unsubscribed ? '' :
            '<div class="acts"><button data-remind="' + esc(x.email) + '">' +
            (x.remindedAt ? 'Send another reminder' : 'Send reminder') + '</button></div>') +
          '</div>';
      });
    }

    p.innerHTML = h;
    wireMemberActions(p);
  }

  function stat(value, label, sub) {
    return '<div class="stat"><span class="v">' + esc(value) + '</span>' +
      '<span class="l">' + esc(label) + '</span>' +
      (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</div>';
  }

  function sendReminders(emails, btn) {
    if (!emails.length) return;
    var many = emails.length > 1;
    if (!window.confirm(many
      ? 'Email a checkout reminder to ' + emails.length + ' people?'
      : 'Email a checkout reminder to ' + emails[0] + '?')) return;

    var was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch('/api/admin/send-reminder', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emails: emails })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status !== 200) { window.alert(res.d.error || 'That did not work.'); btn.disabled = false; btn.textContent = was; return; }
        var msg = res.d.sent.length + ' reminder' + (res.d.sent.length === 1 ? '' : 's') + ' sent.';
        // Say which ones did not go and why, rather than quietly sending fewer.
        if (res.d.skipped.length) {
          msg += '\n\nNot sent:\n' + res.d.skipped.map(function (s) { return '  ' + s.email + ' — ' + s.why; }).join('\n');
        }
        window.alert(msg);
        members = null;
        paintMembers(document.getElementById('panel'));
      })
      .catch(function () { window.alert('That did not work.'); btn.disabled = false; btn.textContent = was; });
  }

  function wireMemberActions(scope) {
    [].forEach.call(scope.querySelectorAll('[data-remind]'), function (b) {
      b.addEventListener('click', function () { sendReminders([b.getAttribute('data-remind')], b); });
    });
    var save = scope.querySelector('#rem-save');
    if (save) save.addEventListener('click', function () {
      var on = scope.querySelector('#rem-on').checked;
      var hours = scope.querySelector('#rem-hours').value;
      var hint = scope.querySelector('#rem-hint');
      save.disabled = true; save.textContent = 'Saving…';
      fetch('/api/admin/settings', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: on, delayHours: hours })
      })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (res) {
          save.disabled = false; save.textContent = 'Save';
          if (res.status !== 200) { hint.textContent = res.d.error || 'That did not save.'; return; }
          hint.textContent = res.d.enabled
            ? 'Saved — reminders go out ' + res.d.delayHours + ' hours after an abandoned checkout.'
            : 'Saved — automatic reminders are off. You can still send them by hand.';
          if (members) members.reminders = res.d;
        })
        .catch(function () { save.disabled = false; save.textContent = 'Save'; hint.textContent = 'That did not save.'; });
    });

    var all = scope.querySelector('#remind-all');
    if (all) all.addEventListener('click', function () {
      var f = members && members.funnel;
      var list = ((f && f.didNotConvert) || [])
        .filter(function (x) { return !x.unsubscribed && !x.remindedAt; })
        .map(function (x) { return x.email; });
      sendReminders(list, all);
    });

    [].forEach.call(scope.querySelectorAll('[data-act]'), function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-act');
        var email = b.getAttribute('data-email');
        var payload = { email: email, action: act };

        if (act === 'refund') {
          // Stripe cannot reverse a refund, so make it deliberate: the address
          // has to be typed, not just clicked past.
          var typed = window.prompt(
            'Refund ' + email + ' in full and cancel their access?\n\n' +
            'This cannot be undone. Type their email address to confirm:');
          if (!typed) return;
          payload.confirm = typed;
        } else if (act === 'revoke') {
          if (!window.confirm('Cancel access for ' + email + '?\n\nThey keep their account and you can restore it here.')) return;
        } else if (act === 'grant') {
          payload.paymentIntent = b.getAttribute('data-pi') || undefined;
          payload.name = b.getAttribute('data-name') || undefined;
        }

        b.disabled = true; var was = b.textContent; b.textContent = 'Working…';
        fetch('/api/admin/member-action', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (res) {
            if (res.status !== 200) {
              window.alert(res.d.error || 'That did not work.');
              b.disabled = false; b.textContent = was;
              return;
            }
            // Say plainly whether the welcome actually went out. Access
            // without the email is a member who still cannot find the door.
            if (act === 'grant') {
              window.alert(res.d.emailed
                ? 'Access granted, and the welcome email with their sign-in link is on its way.'
                : 'Access granted, but the welcome email did not send' +
                  (res.d.emailError ? ' (' + res.d.emailError + ')' : '') +
                  '.\n\nThey can still sign in from the login page using this address.');
            }
            members = null;                 // refetch so the figures move too
            paintMembers(document.getElementById('panel'));
          })
          .catch(function () {
            window.alert('That did not work.');
            b.disabled = false; b.textContent = was;
          });
      });
    });
  }

  function counts() {
    var open = data.requests.filter(function (r) { return r.status === 'new'; }).length;
    document.getElementById('n-req').textContent = open ? open + ' new' : data.requests.length;
    document.getElementById('n-com').textContent = data.comments.filter(function (c) { return !c.removed; }).length;
  }

  function wire() {
    [].forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () {
        tab = t.getAttribute('data-tab');
        [].forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.toggle('on', x === t); });
        paint();
      });
    });
  }

  function paint() {
    var p = document.getElementById('panel');
    if (tab === 'members') { paintMembers(p); return; }
    p.innerHTML = tab === 'requests' ? requestsHTML() : commentsHTML();
    if (tab === 'requests') {
      [].forEach.call(p.querySelectorAll('[data-set]'), function (b) {
        b.addEventListener('click', function () {
          var id = Number(b.getAttribute('data-id')), st = b.getAttribute('data-set');
          fetch('/api/admin/request-status', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, status: st })
          }).then(function (r) {
            if (!r.ok) return;
            data.requests.forEach(function (x) { if (x.id === id) x.status = st; });
            counts(); paint();
          });
        });
      });
    } else {
      [].forEach.call(p.querySelectorAll('[data-del]'), function (b) {
        b.addEventListener('click', function () {
          if (!window.confirm('Delete this comment? The member will see it as removed.')) return;
          var id = Number(b.getAttribute('data-del'));
          fetch('/api/comments/delete', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
          }).then(function (r) {
            if (!r.ok) return;
            data.comments.forEach(function (c) { if (c.id === id) { c.removed = true; c.body = ''; } });
            counts(); paint();
          });
        });
      });
    }
  }

  function requestsHTML() {
    if (!data.requests.length) return '<p class="empty">No content requests yet.</p>';
    return data.requests.map(function (r) {
      return '<div class="card"><div class="hd">' +
        '<b>' + esc(r.title) + '</b>' +
        '<span class="st ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<span class="meta" style="margin-left:auto">' + esc(r.from) + ' · ' + esc(r.email) + ' · ' + esc(when(r.createdAt)) + '</span>' +
        '</div>' +
        (r.body ? '<p>' + esc(r.body) + '</p>' : '') +
        '<div class="acts">' + STATUSES.map(function (s) {
          return '<button data-id="' + r.id + '" data-set="' + s + '"' + (r.status === s ? ' class="on"' : '') + '>' + s + '</button>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function commentsHTML() {
    if (!data.comments.length) return '<p class="empty">No comments yet.</p>';
    return data.comments.map(function (c) {
      if (c.removed) {
        return '<div class="card removed"><div class="hd"><b>Removed</b>' +
          '<span class="meta" style="margin-left:auto">' + esc(c.course || '') + ' · ' + esc(when(c.createdAt)) + '</span></div></div>';
      }
      return '<div class="card' + (c.isReply ? ' reply' : '') + '"><div class="hd">' +
        '<b>' + esc(c.author) + '</b>' +
        (c.isAdmin ? '<span class="badge">Admin</span>' : '') +
        '<span class="meta" style="margin-left:auto">' + esc(c.email) + ' · ' + esc(when(c.createdAt)) + '</span>' +
        '</div>' +
        '<span class="meta">' + (c.isReply ? 'reply · ' : '') + esc(c.course || '') +
          (c.lesson ? ' · ' + esc(c.lesson) : '') + '</span>' +
        '<p>' + esc(c.body) + '</p>' +
        '<div class="acts"><button class="danger" data-del="' + c.id + '">Delete</button></div></div>';
    }).join('');
  }
})();
</script>
</body>
</html>
