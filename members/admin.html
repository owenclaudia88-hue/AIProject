      cmLoad(p).then(function () { if (tab === 'community') paintCommunity(document.getElementById('panel')); })
        .catch(function () { p.innerHTML = '<p class="empty">Could not load the community.</p>'; });
      return;
    }

    var needs = cm.threads.filter(cmNeeds);
    var counts = { need: needs.length, all: cm.threads.length };
    ['help', 'intros', 'wins', 'announcements'].forEach(function (k) {
      counts[k] = cm.threads.filter(function (t) { return t.space === k; }).length;
    });

    var st = cm.stats || { unanswered: 0, this_week: 0, threads: 0 };
    var html =
      '<div class="stats">' +
        '<div class="stat"><span class="v">' + st.unanswered + '</span><span class="l">Questions to answer</span>' +
          '<span class="s">nobody from the team has replied</span></div>' +
        '<div class="stat"><span class="v">' + st.this_week + '</span><span class="l">Posted this week</span></div>' +
        '<div class="stat"><span class="v">' + st.threads + '</span><span class="l">Threads in total</span></div>' +
      '</div>' +

      '<button class="bulk" id="cm-announce" style="margin:0 0 16px">\u2709 New announcement</button>' +
      '<div class="cm-new" id="cm-new" hidden>' +
        '<input type="text" id="cm-title" maxlength="140" placeholder="Announcement title">' +
        '<div id="cm-rt"></div>' +
        '<div class="acts" style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="bulk" id="cm-post">Post announcement</button>' +
          '<button id="cm-cancel">Cancel</button></div>' +
        '<p class="us-msg" id="cm-msg"></p>' +
      '</div>' +

      '<div class="cm-filters">' +
        filterBtn('need', 'Needs an answer', counts.need) +
        filterBtn('all', 'Everything', counts.all) +
        filterBtn('help', 'Ask for help', counts.help) +
        filterBtn('intros', 'Introductions', counts.intros) +
        filterBtn('wins', 'Wins', counts.wins) +
        filterBtn('announcements', 'Announcements', counts.announcements) +
      '</div>';

    var shown = cm.filter === 'need' ? needs
      : cm.filter === 'all' ? cm.threads
      : cm.threads.filter(function (t) { return t.space === cm.filter; });

    html += shown.length
      ? shown.map(cmCard).join('')
      : '<p class="empty">' + (cm.filter === 'need'
          ? 'Nothing waiting \u2014 every question has an answer.'
          : 'Nothing here yet.') + '</p>';

    p.innerHTML = html;
    wireCommunity(p);
  }

  function filterBtn(key, label, n) {
    return '<button data-f="' + key + '" class="' + (cm.filter === key ? 'on' : '') + '">' +
      esc(label) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }

  function cmCard(t) {
    var sp = (cm.spaces.find(function (x) { return x.key === t.space; }) || {});
    return '<div class="cm-t' + (cm.open === t.id ? ' open' : '') + '" data-id="' + t.id + '">' +
      '<div class="h"><b>' + esc(t.title || cmText(t.body).slice(0, 70)) + '</b>' +
        '<span class="cm-sp">' + esc(sp.label || t.space) + '</span>' +
        (cmNeeds(t) ? '<span class="cm-sp cm-need">Needs an answer</span>' : '') +
        (t.resolved ? '<span class="cm-sp cm-done">Answered</span>' : '') +
        (t.pinned ? '<span class="cm-sp">Pinned</span>' : '') +
      '</div>' +
      '<p class="ex">' + esc(cmText(t.body)) + '</p>' +
      '<div class="m"><span>' + esc(t.author) + '</span><span>\u00b7</span><span>' + esc(cmAgo(t.lastAt)) + '</span>' +
        '<span>\u00b7</span><span>' + t.replies + (t.replies === 1 ? ' reply' : ' replies') + '</span>' +
        (t.likes ? '<span>\u00b7</span><span>\u2665 ' + t.likes + '</span>' : '') +
        (t.lesson ? '<span>\u00b7</span><span>on ' + esc(t.lesson) + '</span>' : '') +
      '</div></div>' +
      (cm.open === t.id ? '<div class="cm-open" id="cm-open-' + t.id + '"><p class="empty">Loading\u2026</p></div>' : '');
  }

  function cmAct(body) {
    return fetch('/api/community/act', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) { return r.ok ? r.json() : null; });
  }

  function wireCommunity(p) {
    [].forEach.call(p.querySelectorAll('.cm-filters button'), function (b) {
      b.addEventListener('click', function () {
        cm.filter = b.getAttribute('data-f');
        cm.open = null;
        paintCommunity(document.getElementById('panel'));
      });
    });

    [].forEach.call(p.querySelectorAll('.cm-t'), function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.closest('.cm-open')) return;
        var id = Number(card.getAttribute('data-id'));
        cm.open = cm.open === id ? null : id;
        paintCommunity(document.getElementById('panel'));
        if (cm.open) openThread(cm.open);
      });
    });

    var announce = p.querySelector('#cm-announce');
    if (announce) {
      var box = p.querySelector('#cm-new');
      announce.addEventListener('click', function () {
        box.hidden = !box.hidden;
        if (!box.hidden && !box.dataset.mounted) {
          box.dataset.mounted = '1';
          var rt = window.rtMount(p.querySelector('#cm-rt'), { placeholder: 'What is new\u2026' });
          p.querySelector('#cm-cancel').addEventListener('click', function () { box.hidden = true; });
          p.querySelector('#cm-post').addEventListener('click', function () {
            var btn = this, msg = p.querySelector('#cm-msg');
            var title = p.querySelector('#cm-title').value.trim();
            if (!title) { msg.textContent = 'Give it a title.'; return; }
            if (rt.isEmpty()) { msg.textContent = 'Write something first.'; return; }
            btn.disabled = true; msg.textContent = 'Posting\u2026';
            fetch('/api/community/post', {
              method: 'POST', credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ space: 'announcements', title: title, body: rt.html() })
            })
              .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
              .then(function (out) {
                btn.disabled = false;
                if (!out.ok) { msg.textContent = out.j.error || 'Could not post that.'; return; }
                cm.loaded = false; cm.filter = 'announcements';
                paintCommunity(document.getElementById('panel'));
              })
              .catch(function () { btn.disabled = false; msg.textContent = 'Network error.'; });
          });
        }
      });
    }
  }

  function openThread(id) {
    var host = document.getElementById('cm-open-' + id);
    if (!host) return;
    fetch('/api/community/thread?id=' + id, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { host.innerHTML = '<p class="empty">Could not load that.</p>'; return; }
        var t = d.thread;
        host.innerHTML =
          '<h3>' + esc(t.title || 'Post') + '</h3>' +
          '<p class="who">' + esc(t.author) + ' \u00b7 ' + esc(cmAgo(t.createdAt)) +
            (t.lesson ? ' \u00b7 on ' + esc(t.lesson) : '') + '</p>' +
          '<div class="cm-body">' + window.rtSanitize(t.body) + '</div>' +
          d.replies.map(function (r) {
            return '<div class="cm-rp"><span class="av">' +
              esc(String(r.author || 'M').charAt(0).toUpperCase()) + '</span><div class="w">' +
              '<span class="n">' + esc(r.author || 'Removed') + '</span>' +
              (r.isAdmin ? '<span class="badge">Team</span>' : '') +
              '<span class="t">' + esc(cmAgo(r.createdAt)) + '</span>' +
              '<div class="cm-body" style="margin-top:6px">' +
                (r.removed ? '<p class="removed">This reply was removed.</p>' : window.rtSanitize(r.body)) +
              '</div>' +
              (r.canDelete ? '<div class="acts"><button data-del="' + r.id + '" class="danger">Delete</button></div>' : '') +
            '</div></div>';
          }).join('') +
          '<div class="cm-reply"><div id="cm-rt-' + id + '"></div>' +
            '<div class="acts" style="margin-top:10px">' +
              '<button class="bulk" data-send="' + id + '">Reply as the team</button>' +
              '<button data-like="' + id + '" class="' + (t.liked ? 'on' : '') + '">' +
                (t.liked ? '\u2665' : '\u2661') + ' ' + (t.likes || 0) + '</button>' +
              '<button data-pin="' + id + '">' + (t.pinned ? 'Unpin' : 'Pin to top') + '</button>' +
              (t.resolvable ? '<button data-res="' + id + '" class="' + (t.resolved ? 'on' : '') + '">' +
                (t.resolved ? '\u2713 Answered' : 'Mark answered') + '</button>' : '') +
              '<button data-rm="' + id + '" class="danger">Delete thread</button>' +
            '</div><p class="us-msg" id="cm-m-' + id + '"></p></div>';

        var rt = window.rtMount(host.querySelector('#cm-rt-' + id), { placeholder: 'Reply as the team\u2026' });
        var msg = host.querySelector('#cm-m-' + id);

        host.addEventListener('click', function (e) {
          var b = e.target.closest('button');
          if (!b) return;
          e.stopPropagation();

          if (b.hasAttribute('data-send')) {
            if (rt.isEmpty()) return;
            b.disabled = true; msg.textContent = 'Posting\u2026';
            fetch('/api/community/post', {
              method: 'POST', credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ parentId: id, body: rt.html() })
            }).then(function (r) { return r.ok ? r.json() : null; })
              .then(function (j) {
                b.disabled = false;
                if (!j) { msg.textContent = 'Could not post that.'; return; }
                msg.textContent = '';
                // The whole view, not just this thread: answering a question
                // takes it out of "Needs an answer", and leaving it sitting in
                // the queue it has just left is how an admin answers something
                // twice.
                cm.loaded = false;
                cmLoad().then(function () {
                  paintCommunity(document.getElementById('panel'));
                  // Still on screen under the current filter? Then keep it open.
                  if (document.getElementById('cm-open-' + id)) openThread(id);
                  refreshBadge();
                });
              });
            return;
          }
          if (b.hasAttribute('data-like')) {
            cmAct({ id: id, like: true }).then(function (r) {
              if (r) b.textContent = (r.liked ? '\u2665' : '\u2661') + ' ' + r.likes;
            });
            return;
          }
          if (b.hasAttribute('data-pin')) {
            cmAct({ id: id, pinned: b.textContent.indexOf('Unpin') < 0 }).then(function () {
              cm.loaded = false; paintCommunity(document.getElementById('panel'));
            });
            return;
          }
          if (b.hasAttribute('data-res')) {
            cmAct({ id: id, resolved: b.textContent.indexOf('\u2713') < 0 }).then(function () {
              cm.loaded = false; paintCommunity(document.getElementById('panel'));
            });
            return;
          }
          if (b.hasAttribute('data-rm')) {
            if (!window.confirm('Delete this thread? Its replies go too.')) return;
            cmAct({ id: id, remove: true }).then(function () {
              cm.open = null; cm.loaded = false; paintCommunity(document.getElementById('panel'));
            });
            return;
          }
          if (b.hasAttribute('data-del')) {
            if (!window.confirm('Delete this reply?')) return;
            cmAct({ id: Number(b.getAttribute('data-del')), remove: true }).then(function () {
              openThread(id);
            });
          }
        });
      });
  }

  /* The tab says how many questions are waiting, without opening it. */
  function refreshBadge() {
    fetch('/api/community/list', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.stats) return;
        cm.stats = d.stats;
        var badge = document.getElementById('n-cm');
        if (badge) badge.textContent = d.stats.unanswered ? d.stats.unanswered + ' to answer' : '';
      })
      .catch(function () {});
  }



  /* ---------------- roadmaps ---------------- */

  var rmq = { list: null, open: null, canGenerate: false, model: '', err: '' };

  function rmBadge() {
    var n = (rmq.list || []).filter(function (r) { return r.status === 'new' || r.status === 'draft'; }).length;
    var el = document.getElementById('n-rm');
    if (el) el.textContent = n ? n + ' waiting' : '';
  }

  function loadRoadmaps() {
    return fetch('/api/admin/roadmaps', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return null;
        rmq.list = d.roadmaps || [];
        rmq.canGenerate = !!d.canGenerate;
        rmq.model = d.model || '';
        rmBadge();
        return d;
      });
  }

  function paintRoadmaps(p) {
    if (!rmq.list) {
      p.innerHTML = '<p class="empty">Loading roadmaps&hellip;</p>';
      loadRoadmaps()
        .then(function () { if (tab === 'roadmaps') paintRoadmaps(document.getElementById('panel')); })
        .catch(function () { p.innerHTML = '<p class="empty">Could not load roadmaps.</p>'; });
      return;
    }

    var waiting = rmq.list.filter(function (r) { return r.status === 'new'; }).length;
    var drafts = rmq.list.filter(function (r) { return r.status === 'draft'; }).length;
    var done = rmq.list.filter(function (r) { return r.status === 'published'; }).length;

    var html =
      '<div class="stats">' +
        '<div class="stat"><span class="v">' + waiting + '</span><span class="l">Waiting to generate</span></div>' +
        '<div class="stat"><span class="v">' + drafts + '</span><span class="l">Drafts to review</span></div>' +
        '<div class="stat"><span class="v">' + done + '</span><span class="l">Published</span></div>' +
      '</div>';

    if (!rmq.canGenerate) {
      html += '<div class="rm-warn"><b>Generation is off.</b> ANTHROPIC_API_KEY is not set on this ' +
        'deployment, so the Generate button will refuse. Everything else \u2014 reading answers, editing ' +
        'and publishing \u2014 works without it.</div>';
    }

    html += rmq.list.length
      ? rmq.list.map(rmCard).join('')
      : '<p class="empty">No roadmap requests yet.</p>';

    p.innerHTML = html;
    wireRoadmaps(p);
  }

  function rmCard(r) {
    var when = new Date(r.createdAt);
    return '<div class="rmq' + (rmq.open === r.id ? ' open' : '') + '" data-id="' + r.id + '">' +
      '<div class="h"><b>' + esc(r.name || r.email) + '</b>' +
        '<span class="who">' + esc(r.email) + ' \u00b7 ' + esc(when.toLocaleDateString()) + '</span>' +
        '<span class="st ' + esc(r.status) + '" style="margin-left:auto">' + esc(r.status) + '</span></div>' +
      // The first open after a quiet spell waits for the function and the
      // database to wake, which is about ten seconds and looks like a hang
      // unless the screen says otherwise. Warm, it is a quarter of a second
      // and this is never read.
      (rmq.open === r.id
        ? '<div id="rm-body-' + r.id + '"><p class="empty">Loading\u2026 the first one after a ' +
          'quiet spell takes a few seconds while the server wakes up.</p></div>'
        : '') +
      '</div>';
  }

  function wireRoadmaps(p) {
    [].forEach.call(p.querySelectorAll('.rmq .h'), function (h) {
      h.addEventListener('click', function () {
        var id = Number(h.closest('.rmq').getAttribute('data-id'));
        rmq.open = rmq.open === id ? null : id;
        paintRoadmaps(document.getElementById('panel'));
        if (rmq.open) openRoadmap(rmq.open);
      });
    });
  }

  function openRoadmap(id) {
    var host = document.getElementById('rm-body-' + id);
    if (!host) return;
    fetch('/api/admin/roadmaps?id=' + id, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { host.innerHTML = '<p class="empty">Could not load that.</p>'; return; }
        var r = d.roadmap;
        var body = r.published || r.draft;

        host.innerHTML =
          '<div class="rm-ans">' + esc(r.answersText).replace(/^## (.+)$/gm, '<strong>$1</strong>') + '</div>' +
          (r.error ? '<p class="rm-note" style="color:#fca5a5">Last attempt failed: ' + esc(r.error) + '</p>' : '') +
          '<div class="rm-acts">' +
            '<button class="go" data-gen="' + id + '"' + (rmq.canGenerate ? '' : ' disabled') + '>' +
              (body ? '\u21bb Generate again' : '\u2728 Generate AI Roadmap') + '</button>' +
            (body ? '<button data-save="' + id + '">Save edits</button>' +
                    '<button class="pub" data-pub="' + id + '">' +
                      (r.status === 'published' ? 'Republish to member' : 'Publish to member') + '</button>' : '') +
          '</div>' +
          '<p class="rm-note" id="rm-msg-' + id + '">' +
            (r.model ? 'Written by ' + esc(r.model) : '') +
            (r.publishedAt ? ' \u00b7 published ' + esc(new Date(r.publishedAt).toLocaleString()) : '') +
          '</p>' +
          (body
            ? '<div class="rm-tabs"><button class="on" data-view="prev">Preview</button>' +
                '<button data-view="json">JSON</button></div>' +
              '<div class="rm-prev" id="rm-prev-' + id + '"></div>' +
              '<textarea class="rm-json" id="rm-json-' + id + '" hidden>' +
                esc(JSON.stringify(body, null, 2)) + '</textarea>'
            : '');

        if (body) showPreview(id, body, r.name || r.email);
        wireRoadmapActions(host, id, r.name || r.email);
      });
  }

  /**
   * The roadmap as the member will see it, rendered by the member area's own
   * renderer rather than a second one that would quietly drift away from it.
   * Links point into the member area; nothing here is interactive, because
   * ticking somebody else's steps off is not a thing an admin should be able
   * to do by accident.
   */
  function showPreview(id, body, name) {
    var host = document.getElementById('rm-prev-' + id);
    if (!host) return;
    try {
      host.innerHTML = window.roadmapDoc.render(body, {
        name: name, base: 'index.html', interactive: false
      });
    } catch (err) {
      host.innerHTML = '<p class="empty">Could not render that: ' + esc(err.message) + '</p>';
    }
  }

  function wireRoadmapActions(host, id, name) {
    var msg = host.querySelector('#rm-msg-' + id);

    host.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      e.stopPropagation();

      if (b.hasAttribute('data-view')) {
        var wantJson = b.getAttribute('data-view') === 'json';
        var ta = host.querySelector('#rm-json-' + id);
        var prev = host.querySelector('#rm-prev-' + id);
        // Coming back from the JSON box previews what is in the box, so an
        // edit can be read before it is published rather than after.
        if (!wantJson) {
          try { showPreview(id, JSON.parse(ta.value), name); }
          catch (err) { msg.textContent = 'That is not valid JSON: ' + err.message; return; }
        }
        ta.hidden = !wantJson;
        prev.hidden = wantJson;
        [].forEach.call(host.querySelectorAll('.rm-tabs button'), function (t) {
          t.classList.toggle('on', t === b);
        });
        return;
      }

      if (b.hasAttribute('data-gen')) {
        b.disabled = true;
        msg.textContent = 'Writing it \u2014 this takes up to a minute\u2026';
        fetch('/api/admin/roadmaps', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, generate: true })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (out) {
            b.disabled = false;
            if (!out.ok) { msg.textContent = out.j.message || out.j.error || 'Generation failed.'; return; }
            // Said out loud rather than swallowed: if the model keeps naming
            // things that are not in the library, that is worth knowing.
            msg.textContent = 'Done. ' + (out.j.dropped && out.j.dropped.length
              ? out.j.dropped.length + ' invented reference(s) dropped: ' + out.j.dropped.join(', ')
              : 'Every resource it named exists.');
            rmq.list = null;
            loadRoadmaps().then(function () {
              paintRoadmaps(document.getElementById('panel'));
              openRoadmap(id);
            });
          })
          .catch(function () { b.disabled = false; msg.textContent = 'Network error.'; });
        return;
      }

      if (b.hasAttribute('data-save') || b.hasAttribute('data-pub')) {
        var publish = b.hasAttribute('data-pub');
        var ta = host.querySelector('#rm-json-' + id);
        var parsed;
        try { parsed = JSON.parse(ta.value); }
        catch (err) { msg.textContent = 'That is not valid JSON: ' + err.message; return; }
        if (publish && !window.confirm('Publish this to the member? They get an email and it appears in their member area.')) return;

        b.disabled = true;
        msg.textContent = publish ? 'Publishing\u2026' : 'Saving\u2026';
        fetch('/api/admin/roadmaps', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(publish ? { id: id, publish: true, roadmap: parsed } : { id: id, roadmap: parsed })
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            b.disabled = false;
            if (!j) { msg.textContent = 'That did not save.'; return; }
            msg.textContent = publish ? 'Published \u2014 the member has been emailed.' : 'Saved.';
            showPreview(id, parsed, name);
            if (publish) {
              rmq.list = null;
              loadRoadmaps().then(function () { paintRoadmaps(document.getElementById('panel')); });
            }
          })
          .catch(function () { b.disabled = false; msg.textContent = 'Network error.'; });
      }
    });
  }


  function paint() {
    var p = document.getElementById('panel');
    if (tab === 'members') { paintMembers(p); return; }
    if (tab === 'leads') { paintLeads(p); return; }
    if (tab === 'traffic') { paintTraffic(p); return; }
    if (tab === 'projects') { paintProjects(p); return; }
    if (tab === 'community') { paintCommunity(p); return; }
    if (tab === 'roadmaps') { paintRoadmaps(p); return; }
    p.innerHTML = tab === 'requests' ? requestsHTML() : commentsHTML();
    if (tab === 'requests') {
      [].forEach.call(p.querySelectorAll('[data-set]'), function (b) {
        b.addEventListener('click', function () {
          var id = Number(b.getAttribute('data-id')), st = b.getAttribute('data-set');
          fetch('/api/admin/request-status', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, status: st })
          }).then(function (r) {
            if (!r.ok) return;
            data.requests.forEach(function (x) { if (x.id === id) x.status = st; });
            counts(); paint();
          });
        });
      });
    } else {
      // Reply, with the same editor members write in. The editor is built the
      // first time a box is opened and kept, so reopening it keeps a half-typed
      // reply rather than throwing it away.
      var editors = {};
      [].forEach.call(p.querySelectorAll('[data-reply]'), function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-reply');
          var host = p.querySelector('.rt-reply[data-for="' + id + '"]');
          if (!host) return;

          if (!editors[id]) {
            var mount = document.createElement('div');
            host.appendChild(mount);
            var ed = window.rtMount(mount, { placeholder: 'Reply as admin\u2026' });

            var acts = document.createElement('div');
            acts.className = 'acts';
            var send = document.createElement('button');
            send.type = 'button';
            send.textContent = 'Post reply';
            var note = document.createElement('span');
            note.className = 'meta';
            acts.appendChild(send);
            acts.appendChild(note);
            host.appendChild(acts);

            send.addEventListener('click', function () {
              if (ed.isEmpty()) { note.textContent = 'Write something first.'; return; }
              send.disabled = true; note.textContent = 'Posting\u2026';
              fetch('/api/comments/create', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                // The reply is flagged as staff by the endpoint, from the
                // session - never from anything this page sends.
                body: JSON.stringify({
                  course: b.getAttribute('data-course'),
                  parentId: Number(id),
                  body: ed.html()
                })
              })
                .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                .then(function (res) {
                  send.disabled = false;
                  if (!res.ok) { note.textContent = res.d.error || 'Did not post.'; return; }
                  ed.clear();
                  note.textContent = 'Posted.';
                  reloadOverview(false);
                })
                .catch(function () { send.disabled = false; note.textContent = 'Did not post.'; });
            });

            editors[id] = ed;
          }

          host.hidden = !host.hidden;
          if (!host.hidden) editors[id].focus();
        });
      });

      [].forEach.call(p.querySelectorAll('[data-del]'), function (b) {
        b.addEventListener('click', function () {
          if (!window.confirm('Delete this comment? The member will see it as removed.')) return;
          var id = Number(b.getAttribute('data-del'));
          fetch('/api/comments/delete', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
          }).then(function (r) {
            if (!r.ok) return;
            data.comments.forEach(function (c) { if (c.id === id) { c.removed = true; c.body = ''; } });
            counts(); paint();
          });
        });
      });
    }
  }

  function requestsHTML() {
    if (!data.requests.length) return '<p class="empty">No content requests yet.</p>';
    return data.requests.map(function (r) {
      return '<div class="card"><div class="hd">' +
        '<b>' + esc(r.title) + '</b>' +
        '<span class="st ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<span class="meta" style="margin-left:auto">' + esc(r.from) + ' · ' + esc(r.email) + ' · ' + esc(when(r.createdAt)) + '</span>' +
        '</div>' +
        (r.body ? '<p>' + esc(r.body) + '</p>' : '') +
        '<div class="acts">' + STATUSES.map(function (s) {
          return '<button data-id="' + r.id + '" data-set="' + s + '"' + (r.status === s ? ' class="on"' : '') + '>' + s + '</button>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function commentsHTML() {
    if (!data.comments.length) return '<p class="empty">No comments yet.</p>';
    return data.comments.map(function (c) {
      if (c.removed) {
        return '<div class="card removed"><div class="hd"><b>Removed</b>' +
          '<span class="meta" style="margin-left:auto">' + esc(c.course || '') + ' · ' + esc(when(c.createdAt)) + '</span></div></div>';
      }
      return '<div class="card' + (c.isReply ? ' reply' : '') + '"><div class="hd">' +
        '<b>' + esc(c.author) + '</b>' +
        (c.isAdmin ? '<span class="badge">Admin</span>' : '') +
        '<span class="meta" style="margin-left:auto">' + esc(c.email) + ' · ' + esc(when(c.createdAt)) + '</span>' +
        '</div>' +
        '<span class="meta">' + (c.isReply ? 'reply · ' : '') + esc(c.course || '') +
          (c.lesson ? ' · ' + esc(c.lesson) : '') + '</span>' +
        '<div class="ctext">' + (c.body ? window.rtSanitize(c.body) : '') + '</div>' +
        '<div class="acts">' +
          '<button data-reply="' + c.id + '" data-course="' + esc(c.course || '') + '">Reply</button>' +
          '<button class="danger" data-del="' + c.id + '">Delete</button>' +
        '</div>' +
        '<div class="rt-reply" data-for="' + c.id + '" hidden></div></div>';
    }).join('');
  }
})();
</script>
</body>
</html>
