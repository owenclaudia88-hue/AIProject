<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — AI Founder University</title>
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--bg-2:#111113;--bg-3:#161619;--bg-4:#1c1c20;
  --line:#242429;--line-2:#33333a;--txt:#f4f4f5;--txt-2:#a1a1aa;--txt-3:#71717a;
  --accent:#ff7a1a;--accent-2:#ffb020;--green:#34d399;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

#gate{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#gate p{color:var(--txt-2);max-width:460px;line-height:1.6}
#gate a{color:var(--accent-2);text-decoration:underline}

#app{display:none;max-width:1100px;margin:0 auto;padding:clamp(20px,3vw,40px)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:900;font-size:.78rem;flex:none}
h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;letter-spacing:-.03em;margin:0}
.who{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--txt-3)}
.sub{color:var(--txt-2);font-family:var(--mono);font-size:.88rem;margin:0 0 26px}

.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab{background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);border-radius:999px;padding:9px 18px;font-size:.9rem;cursor:pointer}
.tab.on{background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.34);color:#ffd9b3;font-weight:600}
.tab .n{font-family:var(--mono);font-size:.74rem;color:var(--txt-3);margin-left:7px}
.tab.on .n{color:var(--accent-2)}

.card{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card .hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card .hd b{font-size:1rem}
.card .meta{font-family:var(--mono);font-size:.74rem;color:var(--txt-3)}
.card p{margin:9px 0 0;color:var(--txt-2);font-size:.92rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.card .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.card .acts button{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.74rem;cursor:pointer}
.card .acts button:hover{border-color:var(--accent);color:var(--accent-2)}
.card .acts button.on{background:rgba(255,122,26,.14);border-color:rgba(255,122,26,.4);color:#ffd9b3}
.card .acts button.danger:hover{border-color:#f87171;color:#fca5a5}

.st{flex:none;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--txt-2);background:var(--bg-3)}
.st.new{color:var(--accent-2);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.12)}
.st.planned{color:#93c5fd;border-color:rgba(147,197,253,.4);background:rgba(147,197,253,.12)}
.st.done{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12)}
.st.declined{color:var(--txt-3)}
.oc{background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:16px 18px;margin:0 0 18px}
.oc b{display:block;font-size:.95rem}
.oc .meta{margin-top:6px;line-height:1.55}
.oc-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.oc-list li{font-size:.86rem;color:var(--txt-2);display:flex;gap:9px;align-items:center}
/* the button rules above only reach inside .card, and this block is not one */
.oc .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
.oc .acts button{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);
  border-radius:999px;padding:8px 16px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.oc .acts button:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2)}
.oc .acts button:disabled{opacity:.55;cursor:default}
.unsub-panel{margin-top:13px;border-top:1px solid var(--line);padding-top:13px}
.us-head{font-size:.9rem;margin:0}
.us-note{color:var(--txt-2);font-size:.84rem;line-height:1.55;margin:7px 0 0;max-width:62ch}
.us-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.us-acts button{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);
  border-radius:999px;padding:8px 15px;font-family:var(--mono);font-size:.75rem;cursor:pointer}
.us-acts button:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2)}
.us-acts button.danger:hover:not(:disabled){border-color:#f87171;color:#fca5a5}
.us-acts button.quiet{color:var(--txt-3)}
.us-acts button:disabled{opacity:.5;cursor:default}
.us-msg{color:var(--txt-2);font-size:.83rem;line-height:1.55;margin:10px 0 0}
.pbody{color:var(--txt-2);font-size:.9rem;line-height:1.6;margin:8px 0 0;white-space:pre-wrap}
.fb{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.fb textarea{width:100%;background:var(--bg-3);border:1px solid var(--line-2);border-radius:9px;
             color:var(--txt);font:inherit;font-size:.88rem;padding:10px 12px;min-height:72px;resize:vertical}
.fb .acts{margin-top:9px;display:flex;align-items:center;gap:11px}

/* the line under a section heading that says what the list below means */
.sub-note{margin:-6px 0 14px;font-size:.84rem;color:var(--txt-2);line-height:1.55;max-width:70ch}
.badge{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,122,26,.16);color:var(--accent-2);border:1px solid rgba(255,122,26,.3)}
.reply{margin-left:16px;border-left:2px solid var(--line-2);padding-left:14px}
.ctext{font-size:.9rem;line-height:1.6;margin:8px 0 0;overflow-wrap:anywhere}
.ctext a{color:var(--accent-2)}
.ctext ul,.ctext ol{margin:6px 0;padding-left:21px}
.ctext code{background:var(--bg-4);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-family:var(--mono);font-size:.85em}
.ctext pre{background:var(--bg-4);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;overflow-x:auto;font-family:var(--mono);font-size:.82rem}
.rt-reply{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
/* A class selector that sets display beats the browser's own [hidden] rule, so
   an element with a class and a hidden attribute stays on screen. Settled once
   here rather than patched per element, as the member area already does. */
[hidden]{display:none!important}
.rt-reply .acts{margin-top:9px}
.removed{opacity:.55;font-style:italic}
.empty{color:var(--txt-3);font-family:var(--mono);font-size:.88rem;padding:40px 0;text-align:center}
.back{display:inline-block;margin-top:30px;color:var(--txt-2);font-family:var(--mono);font-size:.85rem}
.back:hover{color:var(--accent-2)}

/* the brand lockup — one image, so it cannot drift between pages */
/* Sized by width, not height. A fixed height plus the global img{max-width:100%}
   let a narrow header clamp the width while the height stayed put, which
   stretched the lockup out of shape at 320px. */
.brand-logo{width:176px;max-width:44vw;height:auto;display:block;flex:none}
@media(max-width:600px){.brand-logo{width:150px}}

/* ---------- members view ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;flex-direction:column;gap:3px}
.stat .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.stat .l{font-family:var(--mono);font-size:.74rem;color:var(--txt-3)}
.stat .s{font-family:var(--mono);font-size:.7rem;color:var(--txt-3);opacity:.75}
.warn{font-family:var(--mono);font-size:.8rem;color:var(--accent-2);margin:0 0 14px}
.alert{background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.32);border-radius:14px;
  padding:14px 18px;margin-bottom:12px}
.alert b{color:var(--accent-2)}
.alert p{margin:6px 0 0;color:var(--txt-2);font-size:.88rem;line-height:1.55}
.sech{font-size:1rem;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sech .meta{font-family:var(--mono);font-size:.74rem;color:var(--txt-3);font-weight:400}
.dl{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin:4px 0 2px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl a{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;
  padding:6px 14px}
.dl a:hover{border-color:var(--accent);color:var(--accent-2)}
.dl .bulk{background:rgba(255,122,26,.14);border:1px solid rgba(255,122,26,.4);color:#ffd9b3;
  border-radius:999px;padding:7px 15px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.dl .bulk:hover{border-color:var(--accent)}
.dl .bulk:disabled{opacity:.6;cursor:default}
/* ---------- roadmaps view ---------- */
.rmq{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:11px}
.rmq.open{border-color:rgba(255,176,32,.4)}
.rmq .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.rmq .h b{font-size:.98rem}
.rmq .h .who{font-family:var(--mono);font-size:.75rem;color:var(--txt-3)}
.rmq .st{flex:none;font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--txt-3)}
.rmq .st.new{color:var(--accent-2);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.12)}
.rmq .st.draft{color:#93c5fd;border-color:rgba(147,197,253,.4);background:rgba(147,197,253,.1)}
.rmq .st.published{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.rmq .st.failed{color:#fca5a5;border-color:rgba(252,165,165,.4);background:rgba(252,165,165,.08)}
.rm-ans{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);
  white-space:pre-wrap;font-size:.88rem;line-height:1.65;color:var(--txt-2);overflow-wrap:anywhere}
.rm-ans strong{color:var(--txt)}
.rm-acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.rm-acts button{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;
  min-height:40px;padding:0 16px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.rm-acts button:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2)}
.rm-acts button:disabled{opacity:.55;cursor:default}
.rm-acts .go{background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.42);color:#ffd9b3}
.rm-acts .pub{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:#a7f3d0}
.rm-json{width:100%;min-height:340px;margin:14px 0 0;background:var(--bg-3);border:1px solid var(--line-2);
  color:var(--txt);border-radius:10px;padding:13px;font-family:var(--mono);font-size:.78rem;line-height:1.6;
  resize:vertical}
.rm-json:focus{outline:none;border-color:var(--accent)}
.rm-note{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin:10px 0 0;line-height:1.6}
/* Preview first, JSON behind it. Reviewing a deliverable means reading it the
   way the member will; the JSON is for fixing what the reading finds. */
.rm-tabs{display:flex;gap:7px;margin:16px 0 0}
.rm-tabs button{background:var(--bg-3);border:1px solid var(--line);color:var(--txt-3);
  border-radius:999px;min-height:34px;padding:0 14px;font-family:var(--mono);font-size:.72rem;cursor:pointer}
.rm-tabs button.on{background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.34);color:#ffd9b3}
.rm-prev{margin:14px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:14px;
  padding:26px 24px;max-height:70vh;overflow:auto}
.rm-prev .rmd{max-width:none}
.rm-json[hidden],.rm-prev[hidden]{display:none}
.rm-warn{background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.32);border-radius:12px;
  padding:13px 16px;margin:0 0 16px;font-size:.88rem;line-height:1.6;color:var(--txt-2)}
.rm-warn b{color:var(--accent-2)}

/* ---------- community view ---------- */
.cm-filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.cm-filters button{background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);
  border-radius:999px;min-height:38px;padding:0 15px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.cm-filters button.on{background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.34);color:#ffd9b3}
.cm-filters .n{margin-left:6px;opacity:.7}

.cm-t{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
  margin-bottom:10px;cursor:pointer}
.cm-t:hover{border-color:var(--line-2)}
.cm-t.open{border-color:rgba(255,176,32,.4)}
.cm-t .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cm-t .h b{font-size:.97rem}
.cm-t .ex{margin:6px 0 0;color:var(--txt-2);font-size:.88rem;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm-t .m{margin:9px 0 0;font-family:var(--mono);font-size:.73rem;color:var(--txt-3);
  display:flex;gap:7px;flex-wrap:wrap}
.cm-sp{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--txt-3)}
.cm-need{color:var(--accent-2);border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.12)}
.cm-done{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}

.cm-open{background:var(--bg-2);border:1px solid rgba(255,176,32,.35);border-radius:14px;
  padding:18px;margin-bottom:12px}
.cm-open h3{margin:0 0 4px;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.cm-open .who{font-family:var(--mono);font-size:.75rem;color:var(--txt-3);margin:0 0 12px}
.cm-body{color:var(--txt);font-size:.94rem;line-height:1.65;overflow-wrap:anywhere}
.cm-body p{margin:0 0 10px}
.cm-body a{color:var(--accent-2)}
.cm-body code{background:var(--bg-4);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-family:var(--mono);font-size:.86em}
.cm-rp{display:flex;gap:11px;padding:14px 0;border-top:1px solid var(--line)}
.cm-rp .av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:.85rem;color:#140c03;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.cm-rp .w{flex:1;min-width:0}
.cm-rp .w .n{font-size:.9rem;font-weight:700}
.cm-rp .w .t{font-family:var(--mono);font-size:.7rem;color:var(--txt-3);margin-left:7px}
.cm-reply{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.cm-new{background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:18px;margin-bottom:16px}
.cm-new[hidden]{display:none}
.cm-new input[type=text]{width:100%;background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt);
  border-radius:9px;padding:11px 13px;font-family:inherit;font-size:.92rem;margin-bottom:12px}
.cm-new input:focus{outline:none;border-color:var(--accent)}

/* ---------- traffic view ---------- */
.range{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap;align-items:center}
.range button{background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);border-radius:999px;
  padding:6px 14px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.range button.on{background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.34);color:#ffd9b3}
.chart{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:8px}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:170px}
.chart .col{flex:1;min-width:4px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:3px;overflow:hidden;cursor:default}
/* Nested, not side by side: every buyer started a checkout and every checkout
   was a visitor, so the segments really are one inside the other. */
.chart .seg-v{background:var(--bg-4)}
.chart .seg-c{background:rgba(255,176,32,.55)}
.chart .seg-p{background:var(--green)}
.chart .col:hover .seg-v{background:var(--line-2)}
.chart .axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;
  color:var(--txt-3);margin-top:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--txt-3);
  margin:0 0 8px;padding-left:2px}
/* The day's numbers used to live in a title attribute, which a phone never
   shows. Here they are readable whichever way the bar was reached. */
.chart-read{font-family:var(--mono);font-size:.76rem;color:var(--txt-2);margin:0 0 22px;
  padding-left:2px;min-height:1.2em}
.chart .col{cursor:pointer}
.chart .col.sel .seg-v{background:var(--line-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tbls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tbl{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.tbl h4{margin:0 0 10px;font-size:.78rem;font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.07em;color:var(--txt-3);font-weight:700}
.tbl .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.tbl .row:last-child{border-bottom:0}
.tbl .row .k{font-family:var(--mono);font-size:.78rem;color:var(--txt-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tbl .row .n{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--txt);flex:none}
/* ---------- refund picker ---------- */
.refund-panel{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.refund-panel .rp-load{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin:4px 0}
.refund-panel .rp-head{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-3);margin-bottom:8px}
.refund-panel .rp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.refund-panel .rp-desc{font-family:var(--mono);font-size:.8rem;color:var(--txt-2)}
.refund-panel .rp-what{display:block;margin-top:3px;font-size:.76rem;color:var(--txt-3)}
.refund-panel .rp-sub{font-family:var(--mono);font-size:.74rem;color:var(--txt-3);margin:10px 0 4px}
.refund-panel .rp-btn{margin-left:auto;background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);
  border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.74rem;cursor:pointer}
.refund-panel .rp-btn:hover{border-color:#f87171;color:#fca5a5}
.refund-panel .rp-btn:disabled{opacity:.6;cursor:default}
.refund-panel .rp-btn.all{margin:12px 0 0;margin-left:0}
.sched{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg-2);
  border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;
  font-family:var(--mono);font-size:.8rem;color:var(--txt-2)}
.sched .tog{display:flex;align-items:center;gap:8px;cursor:pointer}
.sched .tog input{width:16px;height:16px;accent-color:var(--accent)}
.sched .sep{color:var(--txt-3)}
.sched input[type=number]{width:74px;background:var(--bg-3);border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:.8rem}
.sched input[type=number]:focus{outline:none;border-color:var(--accent)}
.sched input[type=text]{background:var(--bg-3);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:.8rem}
.sched input[type=text]:focus{outline:none;border-color:var(--accent)}
.sched .bulk{background:rgba(255,122,26,.14);border:1px solid rgba(255,122,26,.4);color:#ffd9b3;
  border-radius:999px;padding:7px 15px;font-family:var(--mono);font-size:.76rem;cursor:pointer}
.sched .hint{flex:1 1 100%;color:var(--txt-3);font-size:.74rem}

/* These are 29-30px beside a pointer, which is under every platform's
   minimum under a thumb - and they are the buttons that cancel access and
   issue refunds. Every row here already wraps, so the width costs nothing. */
@media(max-width:620px),(hover:none){
  .card .acts button,.oc .acts button,.us-acts button,.refund-panel .rp-btn,
  .range button,.dl a,.dl .bulk,.sched .bulk{min-height:40px;padding-top:0;padding-bottom:0;
    display:inline-flex;align-items:center;justify-content:center}
  .tab{min-height:42px;display:inline-flex;align-items:center}
  .back{padding:10px 0;display:inline-block}
  .fb textarea{min-height:88px}
  /* This checkbox switches the reminder emails on and off; 16px is not a
     thumb-sized way to decide that. */
  .sched .tog input{width:22px;height:22px}
  .sched .tog{padding:8px 0}
  .sched input[type=number],.sched input[type=text]{min-height:40px}
}
@media(max-width:620px){
  /* A 4px floor and a 3px gap put 90 days at 627px of bars in a 298px box. */
  .chart{padding:14px}
  .chart .bars{gap:1px;height:140px}
  .chart .col{min-width:2px}
  .stat{padding:14px 15px}
  .stat .v{font-size:1.45rem}
}

</style>
<link rel="stylesheet" href="../assets/richtext.css">
<link rel="stylesheet" href="../assets/roadmap-doc.css">
<script src="../assets/emoji.js"></script>
<script src="../assets/richtext.js"></script>
<script src="../assets/roadmap-doc.js"></script>
</head>
<body>

  <div id="gate"><div>
    <p id="gate-msg">Checking your access&hellip;</p>
    <!-- Staff sign in here rather than through the member login: an admin
         account is not a customer account and has nothing to buy. -->
    <form id="staff-signin" hidden autocomplete="on">
      <img class="brand-logo" src="../assets/logo.webp" alt="AI Founder University" width="720" height="139" style="margin:0 auto 22px">
      <h2 style="margin:0 0 6px;font-size:1.2rem">Staff sign-in</h2>
      <p style="margin:0 0 18px">Enter your staff address and we'll email you a sign-in link.</p>
      <input type="email" id="staff-email" name="email" required placeholder="you@aifounderuniversity.com"
             autocomplete="username" spellcheck="false">
      <button type="submit" id="staff-go">Email me a link</button>
      <p class="note" id="staff-note" hidden></p>
    </form>
  </div></div>

  <div id="app">
    <div class="top">
      <img class="brand-logo" src="../assets/logo.webp" alt="AI Founder University" width="720" height="139">
      <h1>Admin</h1>
      <span class="who" id="who"></span>
    </div>
    <p class="sub">Members, content requests, and every comment left on a course.</p>

    <div class="tabs">
      <button class="tab on" data-tab="requests">Content requests<span class="n" id="n-req">0</span></button>
      <button class="tab" data-tab="comments">Course comments<span class="n" id="n-com">0</span></button>
      <button class="tab" data-tab="roadmaps">Roadmaps<span class="n" id="n-rm"></span></button>
      <button class="tab" data-tab="community">Community<span class="n" id="n-cm"></span></button>
      <button class="tab" data-tab="projects">Projects<span class="n" id="n-proj"></span></button>
      <button class="tab" data-tab="members">Members<span class="n" id="n-mem">0</span></button>
      <button class="tab" data-tab="leads">Leads &amp; buyers<span class="n" id="n-leads"></span></button>
      <button class="tab" data-tab="traffic">Traffic</button>
    </div>

    <div id="panel"></div>
    <a class="back" href="index.html">&larr; Back to the member area</a>
  </div>

<script>
(function () {
  var STATUSES = ['new', 'planned', 'done', 'declined'];
  var data = { requests: [], comments: [] };
  var members = null;          // loaded the first time the tab is opened
  var membersError = '';
  var leads = null;            // loaded when the tab is first opened
  var leadsError = '';
  var projects = null;         // loaded the first time the tab is opened
  var projectsError = '';
  var traffic = null;          // same again, keyed by the window being shown
  var trafficError = '';
  var trafficDays = 30;
  var tab = 'requests';

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function when(iso){
    var t = new Date(iso).getTime(); if (!t) return '';
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }

  /* Requests and comments, fetched at startup and again whenever something
     here changes them. */
  function reloadOverview(first) {
    return fetch('/api/admin/overview', { credentials: 'same-origin' })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (res) {
      if (res.status === 200) {
        data = res.d;
        if (first) {
          document.getElementById('gate').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          // So the tab says how many questions are waiting without anybody
          // having to open it and find out.
          counts(); refreshBadge(); loadRoadmaps().catch(function () {}); paint(); wire();
        } else {
          counts(); paint();
        }
      } else if (res.status === 403) {
        document.getElementById('gate-msg').innerHTML =
          'That account is not a staff account. <a href="index.html">Back to the member area</a>';
      } else {
        // Not signed in. Offer the staff sign-in rather than sending them to
        // the member login, which would turn them away for not having bought.
        document.getElementById('gate-msg').hidden = true;
        document.getElementById('staff-signin').hidden = false;
        document.getElementById('staff-email').focus();
      }
    })
    .catch(function () {
      document.getElementById('gate-msg').textContent = 'Could not load the admin view. Please refresh.';
    });
  }

  reloadOverview(true);

  /* ---------------- staff sign-in ---------------- */
  document.getElementById('staff-signin').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('staff-go');
    var note = document.getElementById('staff-note');
    var email = document.getElementById('staff-email').value.trim();
    if (!email) return;

    btn.disabled = true; btn.textContent = 'Sending…';
    fetch('/api/auth/request-link', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        // The reply is the same whether or not the address is known, so that
        // this cannot be used to find out who has an account.
        note.textContent = d.message || 'If that address has access, a sign-in link is on its way.';
        note.hidden = false;
        btn.textContent = 'Email me a link';
        btn.disabled = false;
      })
      .catch(function () {
        note.textContent = 'Could not send the link. Please try again.';
        note.hidden = false;
        btn.textContent = 'Email me a link';
        btn.disabled = false;
      });
  });

  /* ---------------- members ---------------- */

  function money(cents, cur) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: (cur || 'usd').toUpperCase() }).format((cents || 0) / 100); }
    catch (e) { return ((cents || 0) / 100).toFixed(2) + ' ' + String(cur || '').toUpperCase(); }
  }
  function day(iso) { var t = new Date(iso).getTime(); return t ? new Date(t).toLocaleDateString() : ''; }
  // Date and time. "Somebody bought today" is a different fact from "somebody
  // bought at 02:14", and only the second one tells you which ad was running.
  function stamp(iso) {
    var t = new Date(iso).getTime();
    if (!t) return '';
    var d = new Date(t);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  // The exact page somebody arrived on, shown short enough to scan and with
  // the query string kept — that is where the utm and fbclid live.
  function landing(url) {
    if (!url) return '';
    try { var u = new URL(url); return u.pathname + u.search; } catch (e) { return String(url); }
  }

  // What a step's clock actually runs from, read off the step it chains to.
  // This used to be hardcoded as "from checkout" or "from the first", which a
  // two-step sequence got away with — the moment a third was added it told
  // you the explainer was timed from the first email when it is timed from
  // the second.
  function afterLabel(step, steps) {
    if (step.after === 'checkout') return 'from checkout';
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].kind === step.after) return 'from the ' + steps[i].label.toLowerCase();
    }
    return 'from the previous email';
  }

  // Mirrors the server's rule so the dashboard never offers a button the API
  // would refuse: not unsubscribed, hasn't had this one, and has had the one
  // before it.
  function canSend(person, step, steps) {
    // Buying ends the sequence. Checked here rather than at each caller so the
    // single Send button, the bulk send and the counts beside it cannot
    // disagree about it — and so a buyer can never be offered one.
    if (person.purchased) return false;
    if (person.unsubscribed) return false;
    // A dead mailbox. Offering the button would only produce another hard
    // bounce, which is what erodes the reputation the receipts depend on.
    if (person.bounced) return false;
    var sent = person.sent || {};
    if (sent[step.kind]) return false;
    if (step.after === 'checkout') return true;
    return !!sent[step.after];
  }

  function paintLeads(p) {
    if (leadsError) { p.innerHTML = '<p class="empty">' + esc(leadsError) + '</p>'; return; }
    if (!leads) {
      p.innerHTML = '<p class="empty">Loading&hellip;</p>';
      fetch('/api/admin/leads', { credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (res) {
          if (res.status !== 200) leadsError = res.d.error || 'Could not load leads.';
          else {
            leads = res.d;
            document.getElementById('n-leads').textContent = res.d.leads.length;
          }
          if (tab === 'leads') paintLeads(document.getElementById('panel'));
        })
        .catch(function () {
          leadsError = 'Could not load leads.';
          if (tab === 'leads') paintLeads(document.getElementById('panel'));
        });
      return;
    }

    var c = leads.counts, h = '';

    h += '<div class="stats">' +
      stat(c.reachedCheckout, 'Opened checkout', 'distinct people') +
      stat(c.gaveDetails, 'Gave name &amp; email', c.detailsRate + '% of those') +
      stat(c.purchased, 'Purchased', c.detailsToPurchase + '% of those who gave details') +
      stat(c.gaveDetailsNoPurchase, 'Details, no purchase', 'worth chasing') +
      '</div>';

    if (c.leftBeforeDetails > 0) {
      h += '<p class="warn">' + c.leftBeforeDetails + ' opened the checkout and left without typing a name.</p>';
    }
    // The two figures come from different places and different periods —
    // leads from the day someone first filled the form, checkout visits only
    // from the day traffic started being recorded. Comparing them without
    // saying so would overstate the drop-off.
    if (leads.trackingSince) {
      h += '<p class="warn">Checkout visits are only counted from ' +
        esc(day(leads.trackingSince)) + ', when traffic tracking started. Leads go back further.</p>';
    }

    h += '<div class="dl">Download: ' +
      '<a href="/api/admin/export?set=leads">non-buyers</a>' +
      '<a href="/api/admin/export?set=members">buyers</a>' +
      '<a href="/api/admin/export?set=all">everyone</a></div>';

    var addr = function (x) {
      var bits = [x.address, x.city, x.zip, x.country].filter(Boolean);
      return bits.length ? bits.join(', ') : '';
    };

    // Short names for the landing pages. Anything not listed shows its raw
    // key rather than nothing, so a new product is visible before it is named.
    // Declared before the buyers list, which now uses it too.
    var SOURCE_LABEL = {
      '70-ai-specialists-for-claude': 'main page',
      'lifetime-access': 'lifetime lander',
      'claude-automation-engine': 'automation engine'
    };
    var badge = function (x) {
      return x.source ? '<span class="st">' + esc(SOURCE_LABEL[x.source] || x.source) + '</span>' : '';
    };
    // The entry page, under the card. Kept monospace and unlinked: it is a
    // record of where they came from, not somewhere to go.
    var entry = function (x) {
      return x.landingUrl
        ? '<p style="font-family:var(--mono);font-size:.74rem;color:var(--txt-2);margin-top:4px">'
          + esc(landing(x.landingUrl)) + '</p>'
        : '';
    };

    h += '<h3 class="sech">Purchased <span class="meta">' + leads.buyers.length + '</span></h3>';
    if (!leads.buyers.length) h += '<p class="empty">Nobody yet.</p>';
    leads.buyers.forEach(function (b) {
      h += '<div class="card"><div class="hd"><b>' + esc(b.name) + '</b>' +
        '<span class="st ' + (b.status === 'active' ? 'done' : 'declined') + '">' + esc(b.status) + '</span>' +
        badge(b) +
        '<span class="meta" style="margin-left:auto">' + esc(b.email) + ' &middot; ' + esc(stamp(b.joinedAt)) + '</span></div>' +
        (addr(b) ? '<p style="font-family:var(--mono);font-size:.78rem">' + esc(addr(b)) + '</p>' : '') +
        entry(b) +
        '</div>';
    });

    var unconverted = leads.leads.filter(function (l) { return !l.purchased; });
    h += '<h3 class="sech">Gave details, never bought <span class="meta">' + unconverted.length + '</span></h3>';
    if (!unconverted.length) h += '<p class="empty">Nobody in this state.</p>';
    unconverted.forEach(function (l) {
      h += '<div class="card"><div class="hd"><b>' + esc(l.name || l.email.split('@')[0]) + '</b>' +
        '<span class="st new">no purchase</span>' +
        // Which page they came through. Worth showing now there is more than
        // one, because it decides which offer the reminders chase them with.
        badge(l) +
        '<span class="meta" style="margin-left:auto">' + esc(l.email) + ' &middot; ' + esc(stamp(l.firstSeen)) + '</span></div>' +
        (addr(l) ? '<p style="font-family:var(--mono);font-size:.78rem">' + esc(addr(l)) + '</p>' : '') +
        entry(l) +
        '</div>';
    });

    p.innerHTML = h;
  }

  function paintTraffic(p) {
    if (trafficError) { p.innerHTML = '<p class="empty">' + esc(trafficError) + '</p>'; return; }
    if (!traffic || traffic.days !== trafficDays) {
      p.innerHTML = '<p class="empty">Loading traffic&hellip;</p>';
      fetch('/api/admin/traffic?days=' + trafficDays, { credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (res) {
          if (res.status !== 200) trafficError = res.d.error || 'Could not load traffic.';
          else traffic = res.d;
          if (tab === 'traffic') paintTraffic(document.getElementById('panel'));
        })
        .catch(function () {
          trafficError = 'Could not load traffic.';
          if (tab === 'traffic') paintTraffic(document.getElementById('panel'));
        });
      return;
    }

    var t = traffic.totals, h = '';

    h += '<div class="range">' +
      [7, 30, 90].map(function (d) {
        return '<button data-days="' + d + '"' + (d === trafficDays ? ' class="on"' : '') +
          '>Last ' + d + ' days</button>';
      }).join('') + '</div>';

    h += '<div class="stats">' +
      stat(t.visitors.toLocaleString(), 'Visitors', t.views.toLocaleString() + ' page views') +
      stat(t.checkouts.toLocaleString(), 'Started checkout', t.visitorToCheckout + '% of visitors') +
      stat(t.purchases.toLocaleString(), 'Purchases', t.checkoutToPurchase + '% of checkouts') +
      stat(t.visitorToPurchase + '%', 'Visitor to buyer', t.purchases + ' of ' + t.visitors) +
      '</div>';

    // The number that explains an ad account reporting nothing. Without a
    // click id Meta cannot connect anything that happens here to the ad that
    // paid for the visit, so those people are invisible in its reporting
    // however far down the funnel they get.
    if (typeof t.attributable === 'number') {
      h += '<div class="stats" style="margin-bottom:18px">' +
        stat(t.attributable + ' of ' + t.visitors, 'Meta can attribute',
             t.attributableRate + '% carry an ad click id') +
        '</div>';
    }

    // Purchases go back further than traffic does, so the window is clamped to
    // the day tracking started. Without saying so, a 7-day view that only has
    // two days in it looks like a collapse in traffic.
    if (traffic.trackingSince) {
      var startedMs = new Date(traffic.trackingSince).getTime();
      if (startedMs > Date.now() - trafficDays * 86400000 + 86400000) {
        h += '<p class="warn">Traffic has only been recorded since ' +
          esc(day(traffic.trackingSince)) + ', so these cover that period rather than the full ' +
          trafficDays + ' days.</p>';
      }
    }

    if (!traffic.daily.length) {
      h += '<p class="empty">Nothing recorded yet. Views start appearing here as soon as somebody lands on the site.</p>';
      p.innerHTML = h;
      wireRange(p);
      return;
    }

    // Scale every column against the busiest day, so the shape of the chart is
    // the shape of the traffic rather than of whatever the latest day happens
    // to be.
    var peak = Math.max.apply(null, traffic.daily.map(function (d) { return d.visitors; })) || 1;
    h += '<div class="chart"><div class="bars">';
    traffic.daily.forEach(function (d) {
      var pv = Math.round((d.purchases / peak) * 100);
      var pc = Math.round((d.checkouts / peak) * 100);
      var pvis = Math.round((d.visitors / peak) * 100);
      // Each visible band is the difference between its ring and the next one
      // in, because the three counts nest rather than add up.
      var title = day(d.day) + ' — ' + d.visitors + ' visitors, ' + d.views + ' views, ' +
        d.checkouts + ' checkouts, ' + d.purchases + ' purchases';
      h += '<div class="col" data-read="' + esc(title) + '" title="' + esc(title) + '">' +
        '<div class="seg-v" style="height:' + Math.max(0, pvis - pc) + '%"></div>' +
        '<div class="seg-c" style="height:' + Math.max(0, pc - pv) + '%"></div>' +
        '<div class="seg-p" style="height:' + pv + '%"></div>' +
        '</div>';
    });
    h += '</div><div class="axis"><span>' + esc(day(traffic.daily[0].day)) + '</span>' +
      '<span>' + esc(day(traffic.daily[traffic.daily.length - 1].day)) + '</span></div></div>';

    h += '<div class="legend">' +
      '<span><i style="background:var(--bg-4)"></i>Visitors</span>' +
      '<span><i style="background:rgba(255,176,32,.55)"></i>Started checkout</span>' +
      '<span><i style="background:var(--green)"></i>Purchased</span>' +
      '</div><p class="chart-read" id="chart-read">Tap or hover a bar for that day’s numbers.</p>';

    // `pick` turns a row into its label, so the same table renders a path, a
    // country name or a "City, Country" without four near-identical functions.
    function table(title, rows, pick, empty) {
      var body = rows.length ? rows.map(function (r) {
        return '<div class="row"><span class="k">' + esc(pick(r)) + '</span>' +
          '<span class="n">' + Number(r.visitors).toLocaleString() + '</span></div>';
      }).join('') : '<p class="empty" style="padding:14px 0">' + esc(empty || 'Nothing yet.') + '</p>';
      return '<div class="tbl"><h4>' + esc(title) + '</h4>' + body + '</div>';
    }

    h += '<h3 class="sech">Where they came from and what they looked at</h3>';
    h += '<div class="tbls">' +
      table('Countries', traffic.countries, function (r) { return r.name || r.country; }) +
      table('Cities', traffic.cities || [], function (r) {
        return r.city + (r.name ? ', ' + r.name : '');
      }, 'Cities need IPINFO_TOKEN set.') +
      table('Pages', traffic.paths, function (r) { return r.path; }) +
      table('Referrers', traffic.referrers, function (r) { return r.referrer; }) +
      table('Devices', traffic.devices, function (r) { return r.device; }) +
      '</div>';

    p.innerHTML = h;
    wireRange(p);
    wireChart(p);
  }

  /* One listener on the bars rather than one per column, so the 90-day view
     costs no more than the 7-day one. */
  function wireChart(p) {
    var bars = p.querySelector('.chart .bars');
    var out = p.querySelector('#chart-read');
    if (!bars || !out) return;
    var resting = out.textContent;

    function show(e) {
      var col = e.target.closest && e.target.closest('.col');
      if (!col) return;
      [].forEach.call(bars.querySelectorAll('.col.sel'), function (c) { c.classList.remove('sel'); });
      col.classList.add('sel');
      out.textContent = col.getAttribute('data-read');
    }

    bars.addEventListener('click', show);
    bars.addEventListener('mouseover', show);
    bars.addEventListener('mouseleave', function () {
      [].forEach.call(bars.querySelectorAll('.col.sel'), function (c) { c.classList.remove('sel'); });
      out.textContent = resting;
    });
  }

  function wireRange(p) {
    [].forEach.call(p.querySelectorAll('[data-days]'), function (b) {
      b.addEventListener('click', function () {
        trafficDays = Number(b.getAttribute('data-days'));
        trafficError = '';
        paintTraffic(document.getElementById('panel'));
      });
    });
  }

  function paintMembers(p) {
    if (membersError) { p.innerHTML = '<p class="empty">' + esc(membersError) + '</p>'; return; }
    if (!members) {
      p.innerHTML = '<p class="empty">Loading members&hellip;</p>';
      fetch('/api/admin/members', { credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (res) {
          if (res.status !== 200) { membersError = res.d.error || 'Could not load members.'; }
          else { members = res.d; document.getElementById('n-mem').textContent = res.d.counts.active + ' active'; }
          if (tab === 'members') paintMembers(document.getElementById('panel'));
        })
        .catch(function () {
          membersError = 'Could not load members.';
          if (tab === 'members') paintMembers(document.getElementById('panel'));
        });
      return;
    }

    var f = members.funnel;
    var h = '';

    /* the numbers */
    h += '<div class="stats">' +
      stat(members.counts.active, 'Active members') +
      stat(members.counts.revoked, 'Revoked') +
      (f && f.people != null ? stat(f.people, 'Reached checkout') : '') +
      (f && f.detailsStats && f.detailsStats.rate != null
        ? stat(f.detailsStats.rate + '%', 'Converted to paid',
            f.detailsStats.bought + ' of ' + f.detailsStats.gaveDetails + ' who gave their details')
        : '') +
      // What the reminder sequence is worth: of everyone who handed over their
      // details and did not buy there and then, how many an email won back.
      (f && f.reminderStats && f.reminderStats.rate != null
        ? stat(f.reminderStats.rate + '%', 'Won back by reminders',
            f.reminderStats.bought + ' of ' + f.reminderStats.pool + ' who gave details but did not buy')
        : '') +
      '</div>';
    if (members.funnelError) h += '<p class="warn">' + esc(members.funnelError) + '</p>';

    /* Opening the courses to people who subscribed before the webhook did it
       for us. Only ever a catch-up; new payments grant it themselves. */
    h += '<div class="oc" id="oc"><p class="meta">Checking subscriptions…</p></div>';

    /* paid but no access — the thing that needs acting on */
    if (f && f.paidWithoutAccess && f.paidWithoutAccess.length) {
      h += '<div class="alert"><b>' + f.paidWithoutAccess.length + ' paid but have no access.</b>' +
        '<p>A payment went through and the account was never created — usually a webhook that did not arrive. Granting access here also sends them the welcome email with their sign-in link.</p></div>';
      f.paidWithoutAccess.forEach(function (x) {
        h += '<div class="card"><div class="hd"><b>' + esc(x.name || x.email) + '</b>' +
          '<span class="st new">paid, no access</span>' +
          '<span class="meta" style="margin-left:auto">' + esc(x.email) + ' · ' + money(x.amount, x.currency) + ' · ' + esc(day(x.createdAt)) + '</span></div>' +
          '<div class="acts"><button data-act="grant" data-email="' + esc(x.email) + '" data-pi="' + esc(x.paymentIntent) + '" data-name="' + esc(x.name || '') + '">Give access &amp; email them</button></div></div>';
      });
    }

    /* downloads */
    h += '<div class="dl">Download: ' +
      '<a href="/api/admin/export?set=members">members</a>' +
      '<a href="/api/admin/export?set=leads">non-buyers</a>' +
      '<a href="/api/admin/export?set=all">everyone</a></div>';

    /* the members themselves */
    h += '<h3 class="sech">Members</h3>';
    if (!members.members.length) h += '<p class="empty">No members yet.</p>';
    members.members.forEach(function (m) {
      var active = m.status === 'active';
      // Won back by the sequence. "after 3 reminders" is how many had reached
      // them, which is the useful number - not which one gets the credit.
      var via = m.viaReminder
        ? '<span class="st done">bought after ' + m.viaReminder.count +
          ' reminder' + (m.viaReminder.count === 1 ? '' : 's') + '</span>'
        : '';
      var ending = m.endingAt
        ? '<span class="st new">ends ' + esc(stamp(m.endingAt * 1000)) + '</span>'
        : '';
      h += '<div class="card"><div class="hd"><b>' + esc(m.name) + '</b>' + via + ending +
        '<span class="st ' + (active ? 'done' : 'declined') + '">' + esc(m.status) + '</span>' +
        '<span class="meta" style="margin-left:auto">' + esc(m.email) + ' · joined ' + esc(stamp(m.joinedAt)) + '</span></div>' +
        '<div class="acts">' +
          (active
            ? '<button class="danger" data-act="revoke" data-email="' + esc(m.email) + '">Cancel access</button>'
            : '<button data-act="restore" data-email="' + esc(m.email) + '">Restore access</button>') +
          (m.viaSubscription
            ? (m.endingAt
              ? '<button data-act="resub" data-email="' + esc(m.email) + '">Keep the subscription</button>'
              : '<button data-act="unsub" data-email="' + esc(m.email) + '">End subscription&hellip;</button>')
            : '') +
          (m.paymentIntent ? '<button class="danger" data-act="refund" data-email="' + esc(m.email) + '">Refund&hellip;</button>' : '') +
        '</div></div>';
    });

    /* the sales the reminder sequence brought in */
    if (f && f.convertedFromReminder && f.convertedFromReminder.length) {
      var won = f.convertedFromReminder;
      var proven = won.filter(function (x) { return x.arrivedThrough; }).length;

      h += '<h3 class="sech">Bought after a reminder <span class="meta">' + won.length + '</span></h3>';
      h += '<p class="sub-note">' + proven + ' of ' + won.length +
        ' clicked through the reminder itself. The rest bought after one went out, which is ' +
        'the order things happened rather than proof the email did it.</p>';

      won.forEach(function (x) {
        // Two different claims, so they are labelled differently rather than
        // shown as one number that overstates what is known.
        var badge = x.arrivedThrough
          ? '<span class="st done">came through ' + esc(label(x.arrivedThrough)) + '</span>'
          : '<span class="st planned">followed ' + esc(label(x.lastReminder)) + '</span>';

        var gap = x.hoursAfter < 1
          ? Math.round(x.hoursAfter * 60) + ' min later'
          : (x.hoursAfter < 48 ? x.hoursAfter.toFixed(1) + 'h later'
                               : Math.round(x.hoursAfter / 24) + ' days later');

        h += '<div class="card"><div class="hd"><b>' + esc(x.name || x.email) + '</b>' + badge +
          '<span class="st">' + esc(gap) + '</span>' +
          (x.reminderCount > 1 ? '<span class="st">' + x.reminderCount + ' reminders sent</span>' : '') +
          '<span class="meta" style="margin-left:auto">' + esc(x.email) + ' \u00b7 bought ' +
          esc(day(x.boughtAt)) + '</span></div></div>';
      });
    }

    /* everyone who started and did not finish */
    if (f && f.didNotConvert && f.didNotConvert.length) {
      // who could still be written to: not unsubscribed, not already reminded
      h += '<h3 class="sech">Leads to win back <span class="meta">' + f.didNotConvert.length + '</span></h3>';
      h += '<p class="sub-note">Gave their details and did not buy. They leave this list the moment '
        + 'they do \u2014 look for them under Members, flagged with how many reminders it took.</p>';

      // the automatic sequence, its waits, and the switch for the lot
      var rs = members.reminders || { enabled: true, steps: [], regularPriceLabel: '' };
      var steps = rs.steps || [];
      h += '<div class="sched">' +
        '<label class="tog"><input type="checkbox" id="rem-on"' + (rs.enabled ? ' checked' : '') + '>' +
          '<span>Email them automatically</span></label>' +
        steps.map(function (s, i) {
          return '<span class="sep">' + (i === 0 ? '·' : '·') + ' ' + esc(s.label) + ' after</span>' +
            '<input type="number" data-delay="' + esc(s.delayKey) + '" min="0.25" max="168" step="0.25" value="' + esc(s.delayHours) + '">' +
            '<span class="sep">h ' + esc(afterLabel(s, steps)) + '</span>';
        }).join('') +
        '<span class="sep">· full price shown in the follow-up</span>' +
        '<input type="text" id="rem-price" placeholder="$285" value="' + esc(rs.regularPriceLabel || '') + '" style="width:88px">' +
        '<button class="bulk" id="rem-save">Save</button>' +
        '<span class="hint" id="rem-hint">' +
          // Proof the schedule is alive. Without it, a job that has silently
          // stopped is indistinguishable from one with nobody due.
          (rs.lastRunAt
            ? 'Last checked ' + esc(when(rs.lastRunAt)) +
              (rs.lastRunReport ? ' (' + esc(rs.lastRunReport) + ').' : '.') + ' '
            : 'The scheduled check has not run yet. ') +
          'Anyone who has paid, already had it, unsubscribed, or whose address bounced is skipped. ' +
          'Leave the price blank to drop that line from the email.</span>' +
        '</div>';

      // one "send now" per step, for whoever is currently due it
      var bulk = steps.map(function (s) {
        var list = f.didNotConvert.filter(function (x) { return canSend(x, s, steps); });
        return list.length
          ? '<button class="bulk" data-sendall="' + esc(s.kind) + '">Send ' + esc(s.label.toLowerCase()) + ' to ' + list.length + ' now</button>'
          : '';
      }).filter(Boolean).join('');
      if (bulk) h += '<div class="dl" style="margin-bottom:12px">' + bulk + '<span>Don\'t wait for the schedule.</span></div>';
      f.didNotConvert.forEach(function (x) {
        var sent = x.sent || {};
        // where they are in the sequence, in order
        var notes = x.bounced ? '<span class="st declined">email does not exist</span>'
          : x.unsubscribed ? '<span class="st declined">unsubscribed</span>'
          : steps.filter(function (s) { return sent[s.kind]; })
                 .map(function (s) { return '<span class="st planned">' + esc(s.label.toLowerCase()) + ' ' + esc(day(sent[s.kind])) + '</span>'; })
                 .join('');

        var acts = (x.unsubscribed || x.bounced) ? '' : steps.filter(function (s) { return canSend(x, s, steps); })
          .map(function (s) {
            return '<button data-remind="' + esc(x.email) + '" data-kind="' + esc(s.kind) + '">Send ' + esc(s.label.toLowerCase()) + '</button>';
          }).join('');

        h += '<div class="card"><div class="hd"><b>' + esc(x.name || x.email) + '</b>' + notes +
          '<span class="meta" style="margin-left:auto">' + esc(x.email) + ' · ' + esc(day(x.createdAt)) + '</span></div>' +
          (acts ? '<div class="acts">' + acts + '</div>' : '') +
          '</div>';
      });
    }

    p.innerHTML = h;
    wireMemberActions(p);
    paintOpenCourses();
  }

  /* "checkout-reminder-3" -> the label the sequence uses for it, or a readable
     version of the slug when it is one the sequence no longer lists. */
  function label(kind) {
    var steps = ((members.reminders || {}).steps) || [];
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].kind === kind) return steps[i].label.toLowerCase();
    }
    return String(kind || '').replace(/-/g, ' ');
  }


  /* ---------------- open the courses to subscribers ---------------- */

  function paintOpenCourses() {
    var box = document.getElementById('oc');
    if (!box) return;

    fetch('/api/admin/open-courses', { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { box.innerHTML = '<p class="meta">' + esc(res.d.error || 'Could not check.') + '</p>'; return; }
        var d = res.d;

        // Locally this talks to test-mode Stripe and finds nothing real. Saying
        // so beats showing a confident zero.
        var testNote = d.mode === 'test'
          ? '<p class="meta">Stripe is in test mode here, so these are test subscriptions. '
            + 'Run this on the live site to act on real ones.</p>'
          : '';

        if (!d.toGrant.length) {
          box.innerHTML = '<b>Courses are open to every subscriber.</b>' +
            '<p class="meta">' + d.already + ' of ' + d.subscribers +
            ' live subscription(s) already have them.</p>' + testNote;
          return;
        }

        box.innerHTML = '<b>' + d.toGrant.length + ' subscriber(s) cannot see the courses yet.</b>' +
          '<p class="meta">They subscribed before this was automatic, so they have no new invoice ' +
          'to open it for them. New payments grant it themselves.</p>' + testNote +
          '<ul class="oc-list">' + d.toGrant.map(function (x) {
            return '<li>' + esc(x.email) + ' <span class="st">' + esc(x.status) + '</span></li>';
          }).join('') + '</ul>' +
          '<div class="acts"><button id="oc-go">Open the courses to them</button>' +
          '<span class="meta" id="oc-msg"></span></div>';

        document.getElementById('oc-go').addEventListener('click', function () {
          var b = this;
          if (!window.confirm('Give all ' + d.toGrant.length + ' of them access to every course?')) return;
          b.disabled = true;
          document.getElementById('oc-msg').textContent = 'Working\u2026';
          fetch('/api/admin/open-courses', { method: 'POST', credentials: 'same-origin' })
            .then(function (r) { return r.json().then(function (x) { return { ok: r.ok, d: x }; }); })
            .then(function (out) {
              if (!out.ok) {
                b.disabled = false;
                document.getElementById('oc-msg').textContent = out.d.error || 'Did not work.';
                return;
              }
              paintOpenCourses();
            })
            .catch(function () {
              b.disabled = false;
              document.getElementById('oc-msg').textContent = 'Did not work.';
            });
        });
      })
      .catch(function () { box.innerHTML = '<p class="meta">Could not check subscriptions.</p>'; });
  }


  /* ---------------- end a subscription ---------------- */

  /* Opened in the card rather than as a confirm dialog. There are three
     answers here - at the period end, immediately, or not at all - and a
     confirm only has two buttons, so one of them had to mean something other
     than "stop". On a cancellation screen that is the wrong button to overload. */
  function endSubscription(email, btn) {
    var card = btn.closest('.card');
    if (!card) return;
    var open = card.querySelector('.unsub-panel');
    if (open) { open.remove(); return; }

    var panel = document.createElement('div');
    panel.className = 'unsub-panel';
    panel.innerHTML =
      '<p class="us-head">End the membership for <b>' + esc(email) + '</b>?</p>' +
      '<p class="us-note">They keep everything they bought \u2014 the plugin packs, the ' +
        'specialist courses, and any upsell they paid for. Only the membership content closes.</p>' +
      '<div class="us-acts">' +
        '<button data-us="end">At the end of the paid period</button>' +
        '<button class="danger" data-us="now">Immediately</button>' +
        '<button class="quiet" data-us="no">Leave it alone</button>' +
      '</div>' +
      '<p class="us-msg" id="us-msg"></p>';
    card.appendChild(panel);

    panel.querySelector('[data-us="no"]').addEventListener('click', function () { panel.remove(); });

    var run = function (immediate, button) {
      var msg = panel.querySelector('.us-msg');
      [].forEach.call(panel.querySelectorAll('button'), function (b) { b.disabled = true; });
      msg.textContent = 'Working\u2026';

      fetch('/api/admin/cancel-subscription', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, immediate: immediate })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) {
            [].forEach.call(panel.querySelectorAll('button'), function (b) { b.disabled = false; });
            msg.textContent = res.d.error || 'Could not cancel that.';
            return;
          }
          msg.textContent = (res.d.immediate
            ? 'Ended now \u2014 ' + res.d.cancelled.length + ' subscription(s).'
            : 'Will end at the period end \u2014 ' + res.d.cancelled.length + ' subscription(s).') +
            ' ' + res.d.kept;
          // Re-read rather than guess: the button should disappear only if the
          // subscription really has gone.
          members = null;
          setTimeout(function () { paintMembers(document.getElementById('panel')); }, 1800);
        })
        .catch(function () {
          [].forEach.call(panel.querySelectorAll('button'), function (b) { b.disabled = false; });
          msg.textContent = 'Could not cancel that.';
        });
    };

    panel.querySelector('[data-us="end"]').addEventListener('click', function () { run(false, this); });
    panel.querySelector('[data-us="now"]').addEventListener('click', function () {
      // The only genuinely destructive option: it takes back days they paid for.
      if (!window.confirm('End it immediately?\n\n' + email +
        ' loses the rest of a month they have already paid for. ' +
        'Everything they bought is still kept.')) return;
      run(true, this);
    });
  }

  function stat(value, label, sub) {
    return '<div class="stat"><span class="v">' + esc(value) + '</span>' +
      '<span class="l">' + esc(label) + '</span>' +
      (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</div>';
  }

  function sendReminders(emails, btn, kind) {
    if (!emails.length) return;
    var many = emails.length > 1;
    if (!window.confirm(many
      ? 'Email a checkout reminder to ' + emails.length + ' people?'
      : 'Email a checkout reminder to ' + emails[0] + '?')) return;

    var was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch('/api/admin/send-reminder', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emails: emails, kind: kind })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status !== 200) { window.alert(res.d.error || 'That did not work.'); btn.disabled = false; btn.textContent = was; return; }
        var msg = res.d.sent.length + ' reminder' + (res.d.sent.length === 1 ? '' : 's') + ' sent.';
        // Say which ones did not go and why, rather than quietly sending fewer.
        if (res.d.skipped.length) {
          msg += '\n\nNot sent:\n' + res.d.skipped.map(function (s) { return '  ' + s.email + ' — ' + s.why; }).join('\n');
        }
        window.alert(msg);
        members = null;
        paintMembers(document.getElementById('panel'));
      })
      .catch(function () { window.alert('That did not work.'); btn.disabled = false; btn.textContent = was; });
  }

  /* ---------------- refund picker ---------------- */

  // Opens (or closes, on a second click) a panel under the member's card that
  // lists every payment they've made and lets you refund any one, or all.
  function openRefundPanel(btn) {
    var email = btn.getAttribute('data-email');
    var card = btn.closest('.card');
    if (!card) return;
    var open = card.querySelector('.refund-panel');
    if (open) { open.remove(); return; }
    var panel = document.createElement('div');
    panel.className = 'refund-panel';
    card.appendChild(panel);
    loadRefundPanel(panel, email);
  }

  function loadRefundPanel(panel, email) {
    panel.innerHTML = '<p class="rp-load">Loading payments…</p>';
    fetch('/api/admin/member-payments?email=' + encodeURIComponent(email), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status !== 200) { panel.innerHTML = '<p class="rp-load">' + esc(res.d.error || 'Could not load payments.') + '</p>'; return; }
        renderRefundPanel(panel, email, res.d);
      })
      .catch(function () { panel.innerHTML = '<p class="rp-load">Could not load payments.</p>'; });
  }

  function renderRefundPanel(panel, email, d) {
    var pays = d.payments || [];
    if (!pays.length) { panel.innerHTML = '<p class="rp-load">No payments found for this member.</p>'; return; }
    var refundable = pays.filter(function (p) { return p.refundable; });

    var rows = pays.map(function (p) {
      var tag = p.refunded ? '<span class="st declined">refunded</span>'
        : p.refundable ? '' : '<span class="st declined">not refundable</span>';
      var act = p.refundable
        ? '<button class="rp-btn" data-refund-ref="' + esc(p.ref) + '">Refund ' + esc(money(p.amount, p.currency)) + '</button>'
        : '';
      // What is in the order, under the amount — a combined order and a plain
      // one are otherwise the same row with a different number.
      var what = p.contents ? '<span class="rp-what">' + esc(p.contents) + '</span>' : '';
      return '<div class="rp-row"><span class="rp-desc">' + esc(money(p.amount, p.currency)) +
        ' · ' + esc(p.label) + ' · ' + esc(day(p.date)) + what + '</span>' + tag + act + '</div>';
    }).join('');

    var subNote = (d.subscriptions && d.subscriptions.length)
      ? '<div class="rp-sub">Active membership subscription — cancel it with “Cancel access”.</div>' : '';
    var all = refundable.length > 1
      ? '<button class="rp-btn all" data-refund-all="1">Refund all ' + refundable.length + ' payments</button>' : '';

    panel.innerHTML = '<div class="rp-head">Payments</div>' + rows + subNote + all;

    [].forEach.call(panel.querySelectorAll('[data-refund-ref]'), function (b) {
      b.addEventListener('click', function () { doRefund(email, { ref: b.getAttribute('data-refund-ref') }, b, panel); });
    });
    var allBtn = panel.querySelector('[data-refund-all]');
    if (allBtn) allBtn.addEventListener('click', function () { doRefund(email, { all: true }, allBtn, panel); });
  }

  function doRefund(email, sel, btn, panel) {
    var what = sel.all ? 'ALL refundable payments for ' + email : 'this payment';
    if (!window.confirm('Refund ' + what + '?\n\nThis moves real money and cannot be undone. Access is not changed — use “Cancel access” for that.')) return;
    btn.disabled = true; var was = btn.textContent; btn.textContent = 'Refunding…';
    fetch('/api/admin/member-action', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ email: email, action: 'refund' }, sel))
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status !== 200) { window.alert(res.d.error || 'That did not work.'); btn.disabled = false; btn.textContent = was; return; }
        var n = (res.d.refunded || []).length, f = (res.d.failed || []).length;
        window.alert(n + ' payment' + (n === 1 ? '' : 's') + ' refunded' + (f ? ', ' + f + ' failed' : '') + '.');
        loadRefundPanel(panel, email);   // refresh so refunded rows update
      })
      .catch(function () { window.alert('That did not work.'); btn.disabled = false; btn.textContent = was; });
  }

  function wireMemberActions(scope) {
    [].forEach.call(scope.querySelectorAll('[data-remind]'), function (b) {
      b.addEventListener('click', function () {
        sendReminders([b.getAttribute('data-remind')], b, b.getAttribute('data-kind'));
      });
    });
    var save = scope.querySelector('#rem-save');
    if (save) save.addEventListener('click', function () {
      var on = scope.querySelector('#rem-on').checked;
      var delays = {};
      [].forEach.call(scope.querySelectorAll('[data-delay]'), function (i) {
        delays[i.getAttribute('data-delay')] = i.value;
      });
      var price = (scope.querySelector('#rem-price') || {}).value || '';
      var hint = scope.querySelector('#rem-hint');
      save.disabled = true; save.textContent = 'Saving…';
      fetch('/api/admin/settings', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: on, delays: delays, regularPriceLabel: price })
      })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (res) {
          save.disabled = false; save.textContent = 'Save';
          if (res.status !== 200) { hint.textContent = res.d.error || 'That did not save.'; return; }
          hint.textContent = res.d.enabled
            ? 'Saved — ' + res.d.steps.map(function (s) {
                return s.label.toLowerCase() + ' at ' + s.delayHours + 'h';
              }).join(', ') + '.'
            : 'Saved — automatic reminders are off. You can still send them by hand.';
          if (members) members.reminders = res.d;
        })
        .catch(function () { save.disabled = false; save.textContent = 'Save'; hint.textContent = 'That did not save.'; });
    });

    [].forEach.call(scope.querySelectorAll('[data-sendall]'), function (b) {
      b.addEventListener('click', function () {
        var kind = b.getAttribute('data-sendall');
        var steps = (members && members.reminders && members.reminders.steps) || [];
        var step = steps.filter(function (s) { return s.kind === kind; })[0];
        var f = members && members.funnel;
        var list = ((f && f.didNotConvert) || [])
          .filter(function (x) { return canSend(x, step, steps); })
          .map(function (x) { return x.email; });
        sendReminders(list, b, kind);
      });
    });

    [].forEach.call(scope.querySelectorAll('[data-act]'), function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-act');
        var email = b.getAttribute('data-email');
        var payload = { email: email, action: act };

        if (act === 'refund') {
          // Refund now opens a picker of this member's payments rather than
          // firing straight away — one click no longer moves money.
          openRefundPanel(b);
          return;
        } else if (act === 'resub') {
          // Undoing a cancellation that has not happened yet. Safe enough to do
          // on one press: it puts things back rather than taking anything away.
          b.disabled = true;
          var was = b.textContent;
          b.textContent = 'Working\u2026';
          fetch('/api/admin/cancel-subscription', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, resume: true })
          })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (res) {
              b.disabled = false; b.textContent = was;
              if (!res.ok) { window.alert(res.d.error || 'Could not do that.'); return; }
              members = null;
              paintMembers(document.getElementById('panel'));
            })
            .catch(function () { b.disabled = false; b.textContent = was; window.alert('Could not do that.'); });
          return;
        } else if (act === 'unsub') {
          // Ends the billing and leaves the account alone. Separate from
          // "Cancel access", which closes the account entirely.
          endSubscription(email, b);
          return;
        } else if (act === 'revoke') {
          if (!window.confirm('Cancel access for ' + email + '?\n\nThis also cancels their membership subscription in Stripe, so they are not charged again. They keep their account and you can restore access here (the subscription is not restored).')) return;
        } else if (act === 'grant') {
          payload.paymentIntent = b.getAttribute('data-pi') || undefined;
          payload.name = b.getAttribute('data-name') || undefined;
        }

        b.disabled = true; var was = b.textContent; b.textContent = 'Working…';
        fetch('/api/admin/member-action', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (res) {
            if (res.status !== 200) {
              window.alert(res.d.error || 'That did not work.');
              b.disabled = false; b.textContent = was;
              return;
            }
            // Say plainly whether the welcome actually went out. Access
            // without the email is a member who still cannot find the door.
            if (act === 'grant') {
              window.alert(res.d.emailed
                ? 'Access granted, and the welcome email with their sign-in link is on its way.'
                : 'Access granted, but the welcome email did not send' +
                  (res.d.emailError ? ' (' + res.d.emailError + ')' : '') +
                  '.\n\nThey can still sign in from the login page using this address.');
            }
            if (act === 'revoke') {
              var nsub = (res.d.cancelledSubscriptions || []).length;
              if (nsub) window.alert('Access cancelled, and ' + nsub + ' subscription' + (nsub === 1 ? '' : 's') + ' cancelled in Stripe.');
            }
            members = null;                 // refetch so the figures move too
            paintMembers(document.getElementById('panel'));
          })
          .catch(function () {
            window.alert('That did not work.');
            b.disabled = false; b.textContent = was;
          });
      });
    });
  }

  function counts() {
    var open = data.requests.filter(function (r) { return r.status === 'new'; }).length;
    document.getElementById('n-req').textContent = open ? open + ' new' : data.requests.length;
    document.getElementById('n-com').textContent = data.comments.filter(function (c) { return !c.removed; }).length;
  }

  function wire() {
    [].forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () {
        tab = t.getAttribute('data-tab');
        [].forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.toggle('on', x === t); });
        paint();
      });
    });
  }


  /* ---------------- projects members have handed in ---------------- */

  function paintProjects(p) {
    if (projectsError) { p.innerHTML = '<p class="empty">' + esc(projectsError) + '</p>'; return; }
    if (!projects) {
      p.innerHTML = '<p class="empty">Loading\u2026</p>';
      fetch('/api/admin/projects', { credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { projectsError = res.d.error || 'Could not load projects.'; }
          else {
            projects = res.d;
            var n = document.getElementById('n-proj');
            if (n) n.textContent = res.d.counts.waiting || '';
          }
          if (tab === 'projects') paintProjects(document.getElementById('panel'));
        })
        .catch(function () {
          projectsError = 'Could not reach the server.';
          if (tab === 'projects') paintProjects(document.getElementById('panel'));
        });
      return;
    }

    var list = projects.projects || [];
    if (!list.length) { p.innerHTML = '<p class="empty">Nobody has handed anything in yet.</p>'; return; }

    var h = '<h3 class="sech">Projects <span class="meta">' + list.length + '</span></h3>';
    h += '<p class="sub-note">' + projects.counts.waiting + ' waiting for a reply. '
      + 'Feedback is optional \u2014 leaving it blank puts a project back in the queue.</p>';

    list.forEach(function (x) {
      h += '<div class="card"><div class="hd"><b>' + esc(x.name || x.email) + '</b>' +
        '<span class="st ' + (x.status === 'reviewed' ? 'done' : 'new') + '">' +
          (x.status === 'reviewed' ? 'replied' : 'waiting') + '</span>' +
        '<span class="meta" style="margin-left:auto">' + esc(x.courseSlug) + ' \u00b7 ' +
        esc(when(x.createdAt)) + '</span></div>';

      if (x.title) h += '<div style="font-weight:600;margin-top:8px">' + esc(x.title) + '</div>';
      if (x.body) h += '<p class="pbody">' + esc(x.body) + '</p>';
      if (x.url) h += '<p style="margin-top:7px"><a href="' + esc(x.url) +
        '" target="_blank" rel="noopener noreferrer">' + esc(x.url) + '</a></p>';

      h += '<div class="fb">' +
        '<textarea data-fb="' + x.id + '" maxlength="8000" placeholder="Feedback for ' +
          esc((x.name || x.email).split(' ')[0]) + '\u2026">' + esc(x.feedback || '') + '</textarea>' +
        '<div class="acts"><button data-save="' + x.id + '">' +
          (x.feedback ? 'Update feedback' : 'Send feedback') + '</button>' +
          '<span class="meta" data-msg="' + x.id + '">' +
          (x.feedbackAt ? 'replied ' + esc(when(x.feedbackAt)) : '') + '</span></div>' +
        '</div></div>';
    });

    p.innerHTML = h;

    [].forEach.call(p.querySelectorAll('[data-save]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-save');
        var box = p.querySelector('[data-fb="' + id + '"]');
        var msg = p.querySelector('[data-msg="' + id + '"]');
        var was = b.textContent;
        b.disabled = true; b.textContent = 'Saving\u2026';
        fetch('/api/admin/projects', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: Number(id), feedback: box.value })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            b.disabled = false; b.textContent = was;
            if (!res.ok) { msg.textContent = res.d.error || 'Did not save.'; return; }
            msg.textContent = res.d.project.feedback ? 'saved' : 'cleared';
            // The queue count moved, so it is refetched rather than guessed at.
            projects = null;
            fetch('/api/admin/projects', { credentials: 'same-origin' })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (d) {
                if (!d) return;
                projects = d;
                var n = document.getElementById('n-proj');
                if (n) n.textContent = d.counts.waiting || '';
              });
          })
          .catch(function () { b.disabled = false; b.textContent = was; msg.textContent = 'Did not save.'; });
      });
    });
  }


  /* ---------------- community ---------------- */

  var cm = { spaces: [], stats: null, threads: [], filter: 'need', open: null, loaded: false };

  function cmAgo(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var secs = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    if (secs < 604800) return Math.floor(secs / 86400) + 'd ago';
    return d.toLocaleDateString();
  }

  function cmText(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }

  /** A question nobody on the team has answered yet. */
  function cmNeeds(t) {
    return t.space === 'help' && !t.resolved && !t.staffReplies;
  }

  function cmLoad(p) {
    // Every space in one pass. Four small queries beat making the admin click
    // through four tabs to find out where the unanswered question is.
    var keys = ['help', 'intros', 'wins', 'announcements'];
    return Promise.all(keys.map(function (k) {
      return fetch('/api/community/list?space=' + k, { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; });
    })).then(function (all) {
      var threads = [];
      all.forEach(function (d) {
        if (!d) return;
        cm.spaces = d.spaces || cm.spaces;
        if (d.stats) cm.stats = d.stats;
        (d.threads || []).forEach(function (t) { threads.push(t); });
      });
      threads.sort(function (a, b) { return new Date(b.lastAt) - new Date(a.lastAt); });
      cm.threads = threads;
      cm.loaded = true;
      var badge = document.getElementById('n-cm');
      if (badge) badge.textContent = cm.stats && cm.stats.unanswered ? cm.stats.unanswered + ' to answer' : '';
      return threads;
    });
  }

  function paintCommunity(p) {
    if (!cm.loaded) {
      p.innerHTML = '<p class="empty">Loading the community&hellip;</p>';
