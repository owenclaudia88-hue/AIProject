<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library — AI Founder University</title>
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--bg-2:#111113;--bg-3:#18181b;--line:#26262b;--line-2:#333338;--txt:#f4f4f5;--txt-2:#a1a1aa;--txt-3:#71717a;--accent:#ff7a1a;--accent-2:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-2);text-decoration:none}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:clamp(18px,4vw,32px)}
header{border-bottom:1px solid var(--line);background:var(--bg-2);position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:900;font-size:.78rem}
.brand-name{font-weight:800;letter-spacing:-.02em;font-size:.95rem}
.back{font-size:.85rem;color:var(--txt-2)}
main{padding-block:28px 70px}
h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:400;letter-spacing:-.02em;margin:0 0 16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:63px;background:var(--bg);padding-block:12px;z-index:5}
#search{flex:1;min-width:200px;background:#fff;color:#16161c;border:0;border-radius:10px;padding:12px 15px;font-size:.95rem;font-family:inherit}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--bg-2);border:1px solid var(--line);color:var(--txt-2);font-family:inherit;font-size:.85rem;padding:9px 15px;border-radius:999px;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#1a0d00;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s ease,transform .15s ease;display:flex;flex-direction:column}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.card .thumb{aspect-ratio:16/9;background:#0e0e10 center/cover no-repeat;border-bottom:1px solid var(--line)}
.card .body{padding:15px}
.card .kindtag{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2);font-weight:800}
.card h3{margin:6px 0 4px;font-size:.98rem;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.card p{margin:0;color:var(--txt-2);font-size:.85rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--txt-2);padding:40px 0;text-align:center}
.count{color:var(--txt-3);font-weight:400;font-size:.9rem}

/* reader overlay */
.reader{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;display:none;padding:24px;overflow:auto}
.reader.show{display:block}
.reader-inner{max-width:820px;margin:24px auto;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:34px}
.reader-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.reader-kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-2);font-weight:800}
.reader h2{margin:6px 0 4px;font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.reader .close{background:none;border:1px solid var(--line-2);color:var(--txt-2);width:34px;height:34px;border-radius:999px;cursor:pointer;flex:none;font-size:1.1rem}
.reader .desc{color:var(--txt-2);margin:0 0 20px}
.reader-body{color:var(--txt);line-height:1.65;font-size:.98rem}
.reader-body img{max-width:100%;border-radius:10px;margin:14px 0}
.reader-body h1,.reader-body h2,.reader-body h3{color:#fff;margin:22px 0 8px}
.reader-body pre,.reader-body code{background:#0e0e10;border:1px solid var(--line);border-radius:8px}
.reader-body pre{padding:14px;overflow:auto}
.reader-body a{color:var(--accent-2)}
.copy{margin-top:20px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;font-family:inherit;border:0;border-radius:999px;padding:11px 22px;cursor:pointer}

/* the brand lockup — one image, so it cannot drift between pages */
/* Sized by width, not height. A fixed height plus the global img{max-width:100%}
   let a narrow header clamp the width while the height stayed put, which
   stretched the lockup out of shape at 320px. */
.brand-logo{width:176px;max-width:44vw;height:auto;display:block;flex:none}
@media(max-width:600px){.brand-logo{width:150px}}
</style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div class="brand"><img class="brand-logo" src="../assets/logo.webp" alt="AI Founder University" width="720" height="139"></div>
      <a class="back" href="/members/">&larr; Back to dashboard</a>
    </div>
  </header>

  <main class="wrap">
    <h1>Library <span class="count" id="total"></span></h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search prompts, skills, lessons…" autocomplete="off">
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="results"><p class="empty" id="status">Loading your library…</p></div>
  </main>

  <div class="reader" id="reader">
    <div class="reader-inner">
      <div class="reader-top">
        <div>
          <div class="reader-kind" id="r-kind"></div>
          <h2 id="r-title"></h2>
        </div>
        <button class="close" id="r-close" aria-label="Close">&times;</button>
      </div>
      <p class="desc" id="r-desc"></p>
      <div class="reader-body" id="r-body"></div>
      <button class="copy" id="r-copy" hidden>Copy text</button>
    </div>
  </div>

<script>
(function () {
  var KINDS = {
    lesson:{label:'Courses'}, prompt:{label:'Prompts'}, image_prompt:{label:'Image & Video'},
    skill:{label:'Agents & Skills'}, gpt:{label:'Custom GPTs'}, guide:{label:'Fundamentals'},
    automation:{label:'Automations'}, video:{label:'Tutorials'}
  };
  var ORDER = ['lesson','prompt','image_prompt','skill','gpt','guide','automation','video'];
  var all = [];        // flat list of items with .kind
  var activeKind = 'all';
  var q = '';

  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}

  function render() {
    var results = document.getElementById('results');
    var list = all.filter(function (it) {
      if (activeKind !== 'all' && it.kind !== activeKind) return false;
      if (q) { var hay = (it.title + ' ' + (it.description||'') + ' ' + (it.category||'')).toLowerCase(); if (hay.indexOf(q) < 0) return false; }
      return true;
    });
    if (!list.length) { results.innerHTML = '<p class="empty">Nothing matches.</p>'; return; }
    var html = '<div class="grid">';
    list.forEach(function (it) {
      html += '<div class="card" data-id="' + esc(it.id) + '">' +
        (it.thumb ? '<div class="thumb" style="background-image:url(\'' + it.thumb + '\')"></div>' : '') +
        '<div class="body"><div class="kindtag">' + esc((KINDS[it.kind]||{}).label || it.kind) + '</div>' +
        '<h3>' + esc(it.title) + '</h3>' +
        (it.description ? '<p>' + esc(it.description) + '</p>' : '') +
        '</div></div>';
    });
    html += '</div>';
    results.innerHTML = html;
    [].forEach.call(results.querySelectorAll('.card'), function (c) {
      c.addEventListener('click', function () { openItem(c.getAttribute('data-id')); });
    });
  }

  function buildTabs(groups) {
    var tabs = document.getElementById('tabs');
    var present = ORDER.filter(function (k) { return groups[k]; });
    var html = '<button class="tab active" data-kind="all">All</button>';
    present.forEach(function (k) {
      html += '<button class="tab" data-kind="' + k + '">' + esc((KINDS[k]||{}).label||k) + ' <span style="opacity:.6">' + groups[k].length + '</span></button>';
    });
    tabs.innerHTML = html;
    [].forEach.call(tabs.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () {
        [].forEach.call(tabs.querySelectorAll('.tab'), function (x){x.classList.remove('active');});
        t.classList.add('active'); activeKind = t.getAttribute('data-kind'); render();
      });
    });
  }

  var reader = document.getElementById('reader');
  function openItem(id) {
    fetch('/api/library/item?id=' + encodeURIComponent(id), { credentials:'same-origin' })
      .then(function(r){return r.json();})
      .then(function(it){
        document.getElementById('r-kind').textContent = (KINDS[it.kind]||{}).label || it.kind;
        document.getElementById('r-title').textContent = it.title || '';
        document.getElementById('r-desc').textContent = it.description || '';
        document.getElementById('r-body').innerHTML = it.bodyHtml || '<p style="color:var(--txt-3)">No text for this item.</p>';
        var copy = document.getElementById('r-copy');
        copy.hidden = !it.bodyHtml;
        copy.onclick = function(){
          var tmp = document.createElement('div'); tmp.innerHTML = it.bodyHtml || '';
          navigator.clipboard.writeText(tmp.innerText).then(function(){ copy.textContent='Copied!'; setTimeout(function(){copy.textContent='Copy text';},1500); });
        };
        reader.classList.add('show'); reader.scrollTop = 0;
      });
  }
  document.getElementById('r-close').addEventListener('click', function(){ reader.classList.remove('show'); });
  reader.addEventListener('click', function(e){ if (e.target === reader) reader.classList.remove('show'); });

  var searchEl = document.getElementById('search');
  var t;
  searchEl.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(function(){ q = searchEl.value.trim().toLowerCase(); render(); }, 150); });

  fetch('/api/library/list', { credentials:'same-origin' })
    .then(function(r){ if(r.status===401){location.replace('login.html');return null;} return r.json(); })
    .then(function(data){
      if (!data) return;
      var groups = data.groups || {};
      ORDER.forEach(function(k){ (groups[k]||[]).forEach(function(it){ it.kind = k; all.push(it); }); });
      Object.keys(groups).forEach(function(k){ if(ORDER.indexOf(k)<0) groups[k].forEach(function(it){it.kind=k;all.push(it);}); });
      document.getElementById('total').textContent = all.length ? '· ' + all.length + ' items' : '';
      if (!all.length) { document.getElementById('results').innerHTML = '<p class="empty">Your library is being set up — check back shortly.</p>'; return; }
      buildTabs(groups); render();
    })
    .catch(function(){ document.getElementById('status').textContent = 'Could not load the library. Please refresh.'; });
})();
</script>
</body>
</html>
