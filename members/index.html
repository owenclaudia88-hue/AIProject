  function renderSearch(c) {
    var items = all.filter(function (it) {
      var hay = (it.title + ' ' + (it.description || '') + ' ' + (it.category || '') + ' ' + it.kind).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    var html = '<h1 class="page-h">Search</h1>' +
      '<p class="page-sub">' + items.length + ' result' + (items.length === 1 ? '' : 's') + ' for “' + esc(q) + '”.</p>';
    html += items.length ? gridOf(items) : '<p class="empty">Nothing matches “' + esc(q) + '”.</p>';
    c.innerHTML = html;
    bindCards(c);
  }

  function kb(n) { if (!n) return ''; return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }

  /* ---------------- reader ---------------- */
  var reader = document.getElementById('reader');
  // Wording for the panel that holds the item's own text, per kind.
  //
  // `copy` is null where the body is something to read rather than to paste.
  // All 51 skill bodies are the same install note ("Claude Skills work inside
  // Claude Code and Cowork only…"), a Custom GPT's body is a link blurb, and an
  // automation's is "download the blueprint below" — a copy button on any of
  // those offers the member nothing. The prompt text, the template and a GPT's
  // system instructions are the things people actually paste, so those keep it.
  var BODY_PANEL = {
    prompt:       { title: 'The Prompt',   mono: true,  copy: 'Copy prompt' },
    image_prompt: { title: 'The Prompt',   mono: true,  copy: 'Copy prompt' },
    skill:        { title: 'How to use it', mono: false, copy: null },
    gpt:          { title: 'How to use it', mono: false, copy: null },
    automation:   { title: 'How to use it', mono: false, copy: null },
    guide:        { title: 'The Guide',    mono: false, copy: null },
    video:        { title: 'Notes',        mono: false, copy: null },
    // No copy button on the body: a routine's document is setup steps and
    // troubleshooting, and copying all of it into Claude's Instructions box
    // is exactly the mistake to design out. The prompt gets its own panel.
    routine:      { title: 'Setup & notes', mono: false, copy: null }
  };
  // Only the item's own note is ever shown. There used to be invented fallbacks
  // here, which meant a panel could claim something the source never said.
  var HOW_TO = {};

  function dots(){ return '<span class="dots"><i class="d-r"></i><i class="d-y"></i><i class="d-g"></i></span>'; }

  // A share link is not an embed link. Vimeo's unlisted URLs carry the privacy
  // hash as a second path segment (vimeo.com/<id>/<hash>) and it has to move to
  // ?h= or the player refuses to load.
  function embedUrl(u) {
    u = String(u || '');
    var m = /vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-z]+))?/i.exec(u);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (m[2] ? '?h=' + m[2] : '');
    m = /(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/i.exec(u);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = /loom\.com\/(?:share|embed)\/([\w-]+)/i.exec(u);
    if (m) return 'https://www.loom.com/embed/' + m[1];
    return u;
  }
  function textOf(html){ var t=document.createElement('div'); t.innerHTML=html||''; return (t.innerText||t.textContent||'').trim(); }

  // Copy handlers are wired by index into this list, so nothing has to be
  // escaped into an onclick attribute.
  var copyBank = [];
  function copyBtn(text, label, cls) {
    var i = copyBank.push(text) - 1;
    return '<button class="' + cls + '" data-copy="' + i + '">' + esc(label) + '</button>';
  }

  function openItem(id) {
    fetch('/api/library/item?id=' + encodeURIComponent(id), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (it) {
        if (!it) return;
        copyBank = [];
        var meta = it.meta || {};
        var body = it.bodyHtml || '';
        // Older rows stored the description as the body too — show it once.
        if (body && textOf(body) === String(it.description || '').trim()) body = '';

        document.getElementById('r-kind').textContent = (KINDS[it.kind] || {}).label || it.kind;
        document.getElementById('r-title').textContent = it.title || '';

        var h = '';

        // chips: the category first, then its tags
        var chips = [];
        if (it.category) chips.push('<span class="chip k">' + esc(it.category) + '</span>');
        (it.tags || []).slice(0, 8).forEach(function (t) {
          if (String(t).toLowerCase() !== String(it.category || '').toLowerCase()) chips.push('<span class="chip">' + esc(t) + '</span>');
        });
        if (chips.length) h += '<div class="r-chips">' + chips.join('') + '</div>';

        if (it.description) h += '<p class="desc">' + esc(it.description) + '</p>';

        // the facts strip
        var facts = [];
        if (meta.difficulty && !meta.level) facts.push('<span>Level <b>' + esc(meta.difficulty) + '</b></span>');
        if (meta.duration) facts.push('<span>Duration <b>' + esc(meta.duration) + '</b></span>');
        if (meta.setupTime) facts.push('<span>Setup <b>' + esc(meta.setupTime) + '</b></span>');
        if (meta.estimatedTime) facts.push('<span>Time <b>' + esc(meta.estimatedTime) + '</b></span>');
        if (meta.instructor) facts.push('<span>By <b>' + esc(meta.instructor) + '</b></span>');
        if (meta.platform) facts.push('<span>Runs on <b>' + esc(meta.platform) + '</b></span>');
        if (it.gallery && it.gallery.length) facts.push('<span><b>' + it.gallery.length + '</b> prompts in this collection</span>');
        if (meta.promptType === 'stack' && (meta.promptItems || []).length > 1) facts.push('<span><b>' + meta.promptItems.length + '-part</b> prompt stack</span>');
        if (meta.modelCompatibility && meta.modelCompatibility.length) facts.push('<span>Works with <b>' + esc(meta.modelCompatibility.join(', ')) + '</b></span>');
        if (facts.length) h += '<div class="r-meta">' + facts.join('') + '</div>';

        // The source's articles open with a dotted hero carrying the blurb, the
        // read time and the level. The title itself is already above, so only
        // the parts that are not repeated are kept.
        if (meta.readTime || meta.level) {
          h += '<div class="r-hero">' +
            (meta.heroText ? '<p>' + esc(meta.heroText) + '</p>' : '') +
            '<div class="r-hero-meta">' +
            (meta.readTime ? '<span class="pill">⏱ ' + esc(meta.readTime) + '</span>' : '') +
            (meta.level ? '<span class="pill lvl">● ' + esc(meta.level) + '</span>' : '') +
            '</div></div>';
        }

        // video
        if (meta.videoUrl) {
          h += '<div class="r-video">' + (/\.(mp4|webm|mov)(\?|$)/i.test(meta.videoUrl)
            ? '<video controls playsinline preload="metadata" src="' + esc(meta.videoUrl) + '"></video>'
            : '<iframe src="' + esc(embedUrl(meta.videoUrl)) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>') + '</div>';
          if (meta.videoText) h += '<p class="desc">' + esc(meta.videoText) + '</p>';
        }

        // how-to note — the item's own, or the fallback for its kind
        var howTo = meta.howTo || (HOW_TO[it.kind] && (body || (it.gallery || []).length) ? HOW_TO[it.kind] : null);
        if (howTo) {
          h += '<div class="panel note"><div class="panel-h">' + dots() +
            '<span class="pt">How to use this</span></div>' +
            '<div class="panel-b">' + howTo + '</div></div>';
        }

        var p = BODY_PANEL[it.kind] || { title: 'Details', mono: false, copy: 'Copy text' };
        function panel(title, html, mono, copyLabel, domId) {
          h += '<div class="panel"' + (domId ? ' id="' + domId + '"' : '') + '><div class="panel-h">' + dots() +
            '<span class="pt">' + esc(title) + '</span>' +
            (copyLabel ? copyBtn(textOf(html), copyLabel, 'pc') : '') + '</div>' +
            '<div class="panel-b' + (mono ? ' mono' : '') + '">' + html + '</div></div>';
        }

        var parts = (meta.promptItems || []).filter(function (x) { return x && (x.content || x.text); });
        // Most single-item prompts store the same text twice — once as the body,
        // once as the lone prompt_item — so a part that repeats the body adds
        // nothing. A Custom GPT is the opposite case: its body is the short "open
        // this GPT" note and the part is the system prompt it actually sells, so
        // dropping the part there loses the whole point of the item.
        var bodyText = textOf(body);
        var extras = parts.filter(function (x) { return textOf(x.content || x.text) !== bodyText; });

        if (parts.length > 1) {
          // a stack: several prompts meant to be used in order, each copyable
          parts.forEach(function (part, i) {
            panel(part.title || ('Prompt ' + (i + 1)), part.content || part.text || '', true, 'Copy prompt');
          });
        } else {
          if (body) panel(p.title, body, p.mono, p.copy);
          // a differing prompt_item is the thing the item actually sells — the
          // GPT's system prompt — so it is always copyable, whatever its kind
          extras.forEach(function (part) {
            panel(part.title || 'System instructions', part.content || part.text || '', true, 'Copy');
          });
        }

        // A routine's prompt sits below the setup, not above it: you read how
        // to set it up, and the thing you have to paste is the next thing you
        // reach. The setup panel ends by pointing down at it.
        if (it.kind === 'routine' && meta.prompt) {
          panel('Instructions — paste this into Claude',
                '<pre>' + esc(meta.prompt) + '</pre>', true, 'Copy instructions',
                'routine-instructions');
        }

        // An automation mirrors the source's Template Instructions block: the
        // blueprint to import, then the walk-through for wiring up accounts.
        if (it.kind === 'automation' && (it.download || meta.setupUrl)) {
          var plat = meta.platform ? meta.platform.charAt(0).toUpperCase() + meta.platform.slice(1) : 'your automation tool';
          h += '<div class="panel"><div class="panel-h">' + dots() +
            '<span class="pt">Template Instructions</span></div><div class="panel-b">';
          if (it.download) {
            h += '<p>Click the link below to download the JSON blueprint and import it in your ' + esc(plat) + ' account.</p>' +
              '<p><a class="tpl-btn" href="' + esc(it.download.url) + '" download>' + esc(it.title) + ' via ' + esc(plat) + '</a></p>';
          }
          if (meta.setupUrl) {
            h += '<p>Follow the instructions below to connect your accounts and get it set up correctly.</p>' +
              '<p><a class="tpl-btn" href="' + esc(meta.setupUrl) + '" target="_blank" rel="noopener">View Instructions &#8599;</a></p>';
          }
          h += '</div></div>';
        }

        // downloadable file (skills, plugins, agents) — the automation panel
        // above already offers its blueprint, so it is not repeated here
        if (it.download && it.kind !== 'automation') {
          var dlName = it.download.name || 'file';
          var label = /\.zip$/i.test(dlName) ? 'Download the .zip'
            : (it.kind === 'skill' ? 'Download Skill' : 'Download file');
          h += '<a class="r-dl" href="' + esc(it.download.url) + '" download>&#11015; ' + esc(label) + '</a>' +
            '<p class="r-dl-sub">' + esc(dlName) + (meta.fileSize ? ' · ' + kb(meta.fileSize) : '') +
            (/\.zip$/i.test(dlName) ? ' — unzip it first, then install the file inside.'
              : it.kind === 'skill' ? ' — to use in Claude.' : '') + '</p>';
        }

        // the long-form guide, rendered as part of this page
        if (it.guideHtml) h += '<div class="guide">' + it.guideHtml + '</div>';

        // a video's supporting notes
        if (meta.supportingText) h += '<div class="panel note"><div class="panel-b">' + esc(meta.supportingText) + '</div></div>';

        // a guide that embeds something hosted elsewhere
        if (meta.richHtml) h += '<div class="panel"><div class="panel-b">' + meta.richHtml + '</div></div>';
        else if (meta.embedUrl) {
          h += '<p class="r-sec-s"><a href="' + esc(meta.embedUrl) + '" target="_blank" rel="noopener" style="color:var(--accent-2)">Open the full guide &#8599;</a></p>';
        }

        // starters / capabilities
        if (meta.starters && meta.starters.length) {
          h += '<div class="r-sec">Conversation starters</div>';
          h += '<div class="panel"><div class="panel-b"><ul style="margin:0;padding-left:18px">' +
            meta.starters.map(function (x) { return '<li>' + esc(typeof x === 'string' ? x : (x.text || x.title || '')) + '</li>'; }).join('') +
            '</ul></div></div>';
        }

        // the gallery
        if (it.gallery && it.gallery.length) {
          h += '<div class="r-sec">' + it.gallery.length + ' prompts</div>' +
            '<p class="r-sec-s">Hover a tile to read its prompt, then copy it.</p><div class="gal">';
          it.gallery.forEach(function (g) {
            var ov = '<div class="ov"><p>' + esc(g.prompt || 'No prompt recorded.') + '</p>' +
              (g.prompt ? copyBtn(g.prompt, 'Copy prompt', '') : '') + '</div>';
            h += g.image
              ? '<figure><img loading="lazy" src="' + esc(g.image) + '" alt="">' + ov + '</figure>'
              : '<figure class="noimg">' + ov + '</figure>';
          });
          h += '</div>';
        }

        // related
        if (it.related && it.related.length) {
          h += '<div class="r-sec">Related</div><p class="r-sec-s">More like this in your library.</p><div class="r-rel">';
          it.related.forEach(function (r) {
            h += '<div class="rc" data-open="' + esc(r.id) + '"><div class="rt">' + esc(r.title) + '</div>' +
              (r.description ? '<div class="rd">' + esc(r.description) + '</div>' : '') + '</div>';
          });
          h += '</div>';
        }

        if (!body && !parts.length && !(it.gallery || []).length && !meta.videoUrl && !it.download && !it.guideHtml && !meta.richHtml) {
          // A collection whose tiles have not been built yet is a different thing
          // from an item with nothing in it — say which.
          h += meta.contentMode === 'image_gallery'
            ? '<p class="empty">This collection is still being prepared. Check back shortly.</p>'
            : '<p class="empty">Nothing else recorded for this item yet.</p>';
        }

        var c = document.getElementById('r-content');
        c.innerHTML = h;

        [].forEach.call(c.querySelectorAll('[data-copy]'), function (b) {
          b.addEventListener('click', function (e) {
            e.stopPropagation();
            var was = b.textContent;
            navigator.clipboard.writeText(copyBank[Number(b.getAttribute('data-copy'))] || '').then(function () {
              b.textContent = 'Copied!';
              setTimeout(function () { b.textContent = was; }, 1400);
            });
          });
        });
        // touch: no hover, so tapping a tile reveals its prompt
        [].forEach.call(c.querySelectorAll('.gal figure'), function (fig) {
          fig.addEventListener('click', function (e) {
            if (e.target.closest('button')) return;
            fig.classList.toggle('open');
          });
        });
        [].forEach.call(c.querySelectorAll('[data-open]'), function (r) {
          r.addEventListener('click', function () { openItem(r.getAttribute('data-open')); });
        });
        // A routine's body points down at its instructions panel. The pointer is
        // a link rather than a sentence, because on a phone the panel it names
        // is several screens away and "below this one" is not a way of getting
        // anywhere. Flash the panel on arrival so the jump is legible.
        [].forEach.call(c.querySelectorAll('[data-scroll]'), function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var target = document.getElementById(a.getAttribute('data-scroll'));
            if (!target) return;
            target.scrollIntoView({ block: 'start', behavior: 'smooth' });
            target.classList.remove('flash');
            void target.offsetWidth;
            target.classList.add('flash');
          });
        });
        // An article's own table of contents links to #block-… anchors. Left
        // alone they rewrite location.hash, which is what the app routes on, so
        // clicking one threw the member back to the dashboard. Scroll instead.
        [].forEach.call(c.querySelectorAll('.guide a[href^="#"]'), function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var id = a.getAttribute('href').slice(1);
            var target = id && (document.getElementById(id) || c.querySelector('[id="' + id + '"]'));
            // not smooth: these articles run to 20,000+ pixels and a smooth
            // scroll that far takes several seconds of nothing appearing to happen
            if (target) target.scrollIntoView({ block: 'start' });
          });
        });

        reader.classList.add('show');
        reader.scrollTop = 0;
        document.querySelector('.reader-inner').scrollIntoView({ block: 'start' });
      });
  }
  document.getElementById('r-close').addEventListener('click', function(){ reader.classList.remove('show'); });
  reader.addEventListener('click', function(e){ if (e.target === reader) reader.classList.remove('show'); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') reader.classList.remove('show'); });

  /* ---------------- search box ---------------- */
  var searchEl = document.getElementById('search');
  var st;
  searchEl.addEventListener('input', function () {
    clearTimeout(st);
    st = setTimeout(function () { q = searchEl.value.trim().toLowerCase(); render(); }, 140);
  });

  /* ---------------- mobile sidebar ---------------- */
  function closeNav(){ document.body.classList.remove('nav-open'); }
  document.getElementById('hamb').addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
  document.getElementById('scrim').addEventListener('click', closeNav);
})();
</script>
</body>
</html>
