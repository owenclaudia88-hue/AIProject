     lesson controls down. One line, clipped, keeps the bar a single row. */
  .player-topbar .pt-back{min-width:0;flex:1 1 auto}
  .player-topbar .pt-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .player-topbar{gap:8px}
  .pt-tools{gap:0}
}

/* backdrop for mobile sidebar */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:min(84vw,300px);z-index:20;transform:translateX(-100%);transition:transform .22s ease}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}

<script>
(function () {
  /* ---------------- access gate ---------------- */
  var gate = document.getElementById('gate');
  var gateMsg = document.getElementById('gate-msg');
  var gateBtn = document.getElementById('gate-btn');
  var appEl = document.getElementById('app');

  function showGate(msg, showBtn) { gateMsg.textContent = msg; gateBtn.hidden = !showBtn; }

  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (res) {
      if (res.status === 200 && res.d.active) {
        gate.style.display = 'none';
        appEl.style.display = 'block';
        var whoEmail = document.getElementById('who-email');
        whoEmail.textContent = res.d.email;
        // The card is too narrow for most addresses, so it is cut with an
        // ellipsis. The whole thing is still one hover away rather than gone.
        whoEmail.title = res.d.email;
        document.getElementById('who-name').textContent = res.d.name || res.d.email;
        me.email = res.d.email;
        me.name = res.d.name || '';
        me.hasName = !!res.d.hasName;
        me.isAdmin = !!res.d.isAdmin;
        // Course features still being built. Copied across like the rest — this
        // object is assembled field by field, so anything left out here is
        // undefined no matter what the server sent.
        me.isTester = !!res.d.isTester;
        me.canSeeReports = !!res.d.canSeeReports;
        me.hasMembership = !!res.d.hasMembership;
        // Who gets the membership rooms rather than a lock on them. Staff are
        // in because they have never bought anything and still have to be able
        // to look. Set here, with the rest of the fields copied off /api/me,
        // because several gates below read it and a flag assigned after its
        // first reader is a flag that is undefined when it matters.
        me.canPreview = !!(me.hasMembership || me.isAdmin);
        // A perk they are not currently paying for reads as one, rather than
        // as a menu item that turns out to be a dead end.
        var reqNav = document.querySelector('.nav[data-view="request"]');
        if (reqNav && !me.hasMembership) reqNav.classList.add('is-locked');
        // Same rule, said the same way: connecting is part of the membership,
        // so it carries a lock rather than leading somewhere that refuses them.
        var connectNav = document.getElementById('nav-connect');
        if (connectNav && !me.hasMembership) connectNav.classList.add('is-locked');
        var rmNav = document.querySelector('.nav[data-view="roadmap"]');
        // Both are membership perks, said the same way as the others: shown to
        // everybody, wearing a lock for anybody not paying for them, rather
        // than hidden from the people most worth showing them to.
        if (rmNav) {
          rmNav.hidden = false;
          if (me.canPreview) loadRoadmap();
          else rmNav.classList.add('is-locked');
        }
        // Not open yet: shown to the test account and staff, hidden from
        // everybody else rather than locked, because a lock advertises
        // something that cannot be bought yet.
        var rpNav = document.getElementById('nav-reports');
        if (rpNav) {
          rpNav.hidden = !me.canSeeReports;
          if (me.canSeeReports) loadReports();
        }
        var sbCommunity = document.getElementById('sb-community');
        if (sbCommunity) sbCommunity.hidden = false;
        // Nobody outside the community can have a notification waiting, so the
        // bell is shown on the same condition rather than on one of its own.
        var bell = document.getElementById('bell');
        if (bell) bell.classList.toggle('on', me.canPreview);

        if (me.canPreview) {
          loadNotes();
          loadSpaces();
        } else {
          [].forEach.call(document.querySelectorAll('#sb-community .nav'), function (n) {
            n.classList.add('is-locked');
          });
        }
        // The account and the library load as separate requests, so whichever
        // lands second is the one that can paint this correctly. Called from
        // both; it reads the current state and is safe to run twice.
        paintJoinBanner();
        me.photoUrl = res.d.photoUrl || null;

        // The account card carries their own picture, or their initial. Two
        // places show it now - the sidebar row and the topbar on a phone - so
        // they are filled from one place rather than two that can drift.
        var initial = String(me.name || res.d.email || '?').trim().charAt(0).toUpperCase() || '?';
        [['acct-pic', 'acct-initial'], ['tb-acct-pic', 'tb-acct-initial']].forEach(function (ids) {
          var pic = document.getElementById(ids[0]);
          if (!pic) return;
          if (me.photoUrl) pic.innerHTML = '<img alt="" src="' + esc(me.photoUrl) + '">';
          else document.getElementById(ids[1]).textContent = initial;
        });
        // the admin view is staff-only server-side; this just stops showing a
        // link to a page that would refuse them anyway
        if (me.isAdmin) document.getElementById('admin-link').hidden = false;
        boot();
      } else if (res.status === 403) {
        showGate('Your access is not active. If you were recently refunded that’s expected; otherwise contact support@aifounderuniversity.com.', true);
        gateBtn.textContent = 'Back to sign in';
      } else {
        window.location.replace('login.html');
      }
    })
    .catch(function () { showGate('Could not verify your access. Please refresh, or sign in again.', true); });

  document.getElementById('signout').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
      .finally(function () { window.location.replace('login.html'); });
  });

  /* ---------------- config ---------------- */
  // Names match the source library exactly — "Prompts" and "LLM Prompts" are
  // the same shelf and it should not be a guess which one a member is on.
  // `label` names the shelf, `one` names a single item — a card reading
  // "LLM Prompts" describes a category rather than the thing in front of you.
  var KINDS = {
    prompt:       { label: 'LLM Prompts',            one: 'LLM Prompt',   glyph: '💬' },
    image_prompt: { label: 'Image & Video Prompts',  one: 'Image Prompt', glyph: '🎨' },
    skill:        { label: 'Agents & Skills',        one: 'Claude Skill', glyph: '🤖' },
    gpt:          { label: 'Custom GPTs',            one: 'Custom GPT',   glyph: '🧠' },
    automation:   { label: 'Automation Templates',   one: 'Automation',   glyph: '⚡' },
    guide:        { label: 'Prompting Fundamentals', one: 'Guide',        glyph: '📖' },
    video:        { label: 'Tutorials',              one: 'Tutorial',     glyph: '🎬' },
    // Named for what Anthropic calls them, so a member searching the Claude
    // docs finds the same word. Distinct from 'automation' above, which is the
    // Make and n8n blueprint library.
    routine:      { label: 'Claude Routines',        one: 'Routine',      glyph: '⏱️' }
  };
  // 'lesson' is intentionally excluded — courses have their own player.
  // Routines lead: they are the newest thing and the one members are most
  // likely to have come looking for.
  var LIB_ORDER = ['routine','prompt','image_prompt','gpt','automation','guide','video','skill'];
  var DL_META = {
    plugin:  { label: 'Specialists & Plugins', glyph: '🧩', blurb: 'Install these in Claude.' },
    // Sold as an add-on, so it gets its own section rather than sitting among
    // the plugins that come with membership — a buyer should be able to see
    // the thing they paid for without reading six titles.
    carousel: { label: 'Carousel Studio',      glyph: '🎠', blurb: 'Instagram and LinkedIn carousels.' },
    powerup: { label: 'Power-Ups',             glyph: '⚡', blurb: 'Focused packs for every job.' },
    course:  { label: 'Course files',          glyph: '🎓', blurb: 'Downloadable course material.' }
  };
  var COURSE_NAMES = {
    '70-ai-specialists-for-claude-course': '70 AI Specialists for Claude',
    'ai-automation-specialists-for-claude-01f5af': 'AI Automation Specialists',
    'carousel-post-specialist-for-claude': 'Carousel Post Specialist',
    'email-specialists-for-claude-97058b': 'Email Specialist',
    'image-designers-for-claude': 'Image Designers',
    'video-shorts-specialist-for-claude': 'Video Shorts Specialist',
    'claude-carousel-studio': 'Claude Carousel Studio'
  };

  var me = { email: '', name: '', hasName: false, isAdmin: false, isTester: false, canPreview: false,
             hasMembership: true };
  var all = [];        // library items (with .kind)
  var downloads = {};  // grouped downloadables
  var courses = [];    // course list (cards)
  var courseCache = {};// slug -> full course tree
  var counts = {};
  var view = 'dashboard';
  var q = '';

  /* lesson completion in localStorage (per viewer) */
  var progress = (function () {
    try { return JSON.parse(localStorage.getItem('afu_progress') || '{}') || {}; }
    catch (e) { return {}; }
  })();
  function saveProgress() { try { localStorage.setItem('afu_progress', JSON.stringify(progress)); } catch (e) {} }
  function isDone(libId) { return !!progress[libId]; }

  /* favorites in localStorage (per viewer) */
  var favs = (function () {
    try { return new Set(JSON.parse(localStorage.getItem('afu_favs') || '[]')); }
    catch (e) { return new Set(); }
  })();
  function saveFavs() { try { localStorage.setItem('afu_favs', JSON.stringify(Array.from(favs))); } catch (e) {} }

  /* bookmarked lessons — these live on the server, so they follow the member
     between devices (unlike favorites and progress, which stay local). */
  var bookmarks = [], bookmarkIds = {};
  function setBookmarks(list) {
    bookmarks = list || [];
    bookmarkIds = {};
    bookmarks.forEach(function (b) { bookmarkIds[b.lessonId] = true; });
    updateBookmarkCount();
  }
  function isBookmarked(libId) { return !!bookmarkIds[libId]; }
  function updateBookmarkCount() {
    var el = document.getElementById('cnt-bookmarks');
    if (el) el.textContent = bookmarks.length;
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function hue(s){var h=0;s=String(s||'x');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;}

  /* ---------------- data ---------------- */
  function boot() {
    Promise.all([
      fetch('/api/library/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{groups:{}};}),
      fetch('/api/content/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{groups:{}};}),
      fetch('/api/courses/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{courses:[]};}),
      fetch('/api/bookmarks/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{bookmarks:[]};})
    ]).then(function (arr) {
      var lib = arr[0].groups || {};
      LIB_ORDER.forEach(function(k){ (lib[k]||[]).forEach(function(it){ it.kind=k; all.push(it); }); });
      Object.keys(lib).forEach(function(k){ if(LIB_ORDER.indexOf(k)<0 && k!=='lesson')(lib[k]||[]).forEach(function(it){it.kind=k;all.push(it);}); });
      downloads = arr[1].groups || {};
      courses = arr[2].courses || [];
      setBookmarks(arr[3].bookmarks || []);

      counts = {};
      all.forEach(function(it){ counts[it.kind]=(counts[it.kind]||0)+1; });
      var dlTotal = 0; Object.keys(downloads).forEach(function(k){ dlTotal += downloads[k].length; });
      counts.downloads = dlTotal;

      LIB_ORDER.forEach(function(k){ var el=document.getElementById('cnt-'+k); if(el) el.textContent = counts[k]||0; });
      // Routines are bought separately, and used to be filtered out of the
      // catalogue for anyone without them — so this hid the nav entry too, and
      // a member without a subscription had no idea they existed. They are
      // listed locked now, so the entry stays. It goes only when there are
      // genuinely none, which would otherwise open on an empty page.
      var navRoutine = document.getElementById('nav-routine');
      if (navRoutine) navRoutine.hidden = !(counts.routine > 0);
      document.getElementById('cnt-downloads').textContent = dlTotal;
      document.getElementById('cnt-courses').textContent = courses.length || '';
      updateFavCount();
      paintJoinBanner();

      wireNav();
      wirePlayer();
      wireNewThread();
      wireBell();
      // Fetched at start rather than when the page is opened, because the
      // sidebar has to be able to say a roadmap has arrived before anybody
      // thinks to go and look.
      if (me.canPreview) loadRoadmap();
      routeFromHash();
    }).catch(function(){
      document.getElementById('content').innerHTML = '<p class="empty" style="color:#fca5a5">Could not load your library. Please refresh.</p>';
    });
  }

  function updateFavCount(){ document.getElementById('cnt-fav').textContent = favs.size; }

  /* ---------------- navigation ---------------- */
  function wireNav() {
    [].forEach.call(document.querySelectorAll('.nav'), function (n) {
      n.addEventListener('click', function () { location.hash = n.getAttribute('data-view'); closeNav(); });
    });
    window.addEventListener('hashchange', routeFromHash);
  }
  // A hash somebody typed by hand can be malformed, and decodeURIComponent
  // throws on that rather than returning anything, which would take the whole
  // router down.
  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  function routeFromHash() {
    var raw = (location.hash || '#dashboard').slice(1);
    var navKey = raw;
    if (raw.indexOf('course-') === 0) { navKey = 'courses'; view = raw; }
    // One open report keeps AI Reports lit in the sidebar: you are still in
    // the thing you walked into.
    else if (raw.indexOf('report-') === 0) { view = raw; navKey = 'reports'; }
    // A thread keeps its space highlighted in the sidebar: you are still in
    // the room you walked into.
    else if (raw.indexOf('t-') === 0) { view = raw; navKey = 'c-' + (threadSpace || ''); }
    else if (raw.indexOf('item-') === 0) {
      // Opens the reader over whatever is already there, then takes the hash
      // back out so closing it does not leave a URL that reopens it.
      // Decoded, because ids carry colons ("automation:38a2…") and a link that
      // percent-encodes one would otherwise be looked up with the %3A still in
      // it and found to be nothing.
      var wanted = safeDecode(raw.slice('item-'.length));
      history.replaceState(null, '', location.pathname + location.search + '#' + (view || 'dashboard'));
      openItem(wanted);
      return;
    }
    // A roadmap step that says "watch section 3" links to section 3. Same
    // treatment as an item: the player opens over the page and the hash goes
    // back to where you were, so closing it does not reopen it.
    else if (raw.indexOf('lesson-') === 0 && raw.indexOf('/') > 0) {
      var cut = raw.indexOf('/');
      var lslug = safeDecode(raw.slice('lesson-'.length, cut));
      var lid = safeDecode(raw.slice(cut + 1));
      history.replaceState(null, '', location.pathname + location.search + '#' + (view || 'dashboard'));
      openLessonById(lslug, lid);
      return;
    }
    else if (raw.indexOf('c-') === 0) { view = raw; navKey = raw; }
    else {
      if (raw !== 'dashboard' && raw !== 'downloads' && raw !== 'favorites' && raw !== 'bookmarks' && raw !== 'courses' && raw !== 'request' && raw !== 'roadmap' && raw !== 'reports' && !KINDS[raw]) raw = 'dashboard';
      view = raw; navKey = raw;
    }
    [].forEach.call(document.querySelectorAll('.nav'), function (n) {
      n.classList.toggle('active', n.getAttribute('data-view') === navKey);
    });
    document.querySelector('.content').scrollTop = 0;
    window.scrollTo(0, 0);
    render();
  }

  /* ---------------- card rendering ---------------- */

  // Prompt cards only. A prompt has nothing to show a picture of, so its card
  // used to be a speech-balloon emoji at 2.5rem, which read as a placeholder.
  // The other libraries' glyphs are doing their job and are left alone.
  var KIND_COLORS = {
    prompt: ['#f472b6', '#a78bfa', '#38bdf8'],
    routine: ['#ffb020', '#ff7a1a', '#f87171']
  };

  // A fan of dots, widest at the top, tapering to a two-dot tail — drawn rather
  // than shipped as seven image files, so it stays crisp and costs nothing.
  var MARK_ROWS = [5, 7, 7, 6, 4, 2, 1, 1];

  function kindMark(kind) {
    var c = KIND_COLORS[kind] || ['#a1a1aa', '#71717a', '#52525b'];
    var id = 'km' + kind.replace(/[^a-z]/g, '');
    var step = 13, r = 4.1, cols = 7, dots = '';
    for (var row = 0; row < MARK_ROWS.length; row++) {
      var n = MARK_ROWS[row];
      var offset = (cols - n) / 2;
      for (var i = 0; i < n; i++) {
        var cx = 8 + (offset + i) * step;
        var cy = 8 + row * step;
        // fade the tail so the shape reads as one object
        var o = row >= 5 ? 0.75 : 1;
        dots += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r +
          '" fill="url(#' + id + ')" opacity="' + o + '"/>';
      }
    }
    return '<svg viewBox="0 0 106 118" aria-hidden="true">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0.6" y2="1">' +
        '<stop offset="0" stop-color="' + c[0] + '"/>' +
        '<stop offset="0.5" stop-color="' + c[1] + '"/>' +
        '<stop offset="1" stop-color="' + c[2] + '"/>' +
      '</linearGradient></defs>' + dots + '</svg>';
  }

  function cardHTML(it) {
    var k = KINDS[it.kind] || { label: it.kind, glyph: '📦' };
    var h = hue(it.category || it.kind);
    var dots = '<span class="dots"><i class="d-r"></i><i class="d-y"></i><i class="d-g"></i></span>';
    var head;
    if (it.thumb) {
      head = '<div class="head" style="background-image:url(\'' + it.thumb + '\')">' + dots + favBtn(it) + '</div>';
    } else if (it.kind === 'prompt') {
      // Only the prompt library gets the drawn mark. Everywhere else the glyph
      // already reads clearly, and one shape in seven colours would say less
      // than seven different glyphs do.
      head = '<div class="head hmark">' + dots +
        '<span class="kmark">' + kindMark(it.kind) + '<span class="klabel">' + esc(k.one || k.label) + '</span></span>' +
        favBtn(it) + '</div>';
    } else {
      head = '<div class="head hglyph" style="background:linear-gradient(135deg,hsl(' + h + ',55%,22%),hsl(' + ((h + 40) % 360) + ',50%,12%))">' +
        dots + '<span class="glyph">' + k.glyph + '</span>' + favBtn(it) + '</div>';
    }
    // Locked items keep the card they always had - thumbnail, category,
    // description - and gain a lock. Replacing it with a smaller panel made the
    // library look like a different product rather than the same one shut.
    if (it.locked) {
      return '<a class="card locked" href="join.html" title="Unlock with the membership">' +
        '<span class="lock-badge">\ud83d\udd12</span>' + head.replace(/<button[\s\S]*?<\/button>/, '') +
        '<div class="body">' +
          '<div class="cat">' + esc(it.category || k.label) + '</div>' +
          '<h3>' + esc(it.title) + '</h3>' +
          (it.description ? '<p>' + esc(it.description) + '</p>' : '') +
          '<span class="c-lock">\ud83d\udd12 Unlock with the membership</span>' +
        '</div></a>';
    }

    return '<div class="card" data-id="' + esc(it.id) + '">' + head +
      '<div class="body">' +
        '<div class="cat">' + esc(it.category || k.label) + '</div>' +
        '<h3>' + esc(it.title) + '</h3>' +
        (it.description ? '<p>' + esc(it.description) + '</p>' : '') +
      '</div></div>';
  }
  function favBtn(it){ return '<button class="fav ' + (favs.has(it.id)?'on':'') + '" data-fav="' + esc(it.id) + '" aria-label="Favorite">' + (favs.has(it.id)?'♥':'♡') + '</button>'; }

  function bindCards(scope) {
    [].forEach.call(scope.querySelectorAll('.card'), function (c) {
      c.addEventListener('click', function (e) {
        if (e.target.closest('.fav')) return;
        openItem(c.getAttribute('data-id'));
      });
    });
    [].forEach.call(scope.querySelectorAll('.fav'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.getAttribute('data-fav');
        if (favs.has(id)) { favs.delete(id); b.classList.remove('on'); b.textContent='♡'; }
        else { favs.add(id); b.classList.add('on'); b.textContent='♥'; }
        saveFavs(); updateFavCount();
        if (view === 'favorites') render();
      });
    });
  }

  function gridOf(items) {
    if (!items.length) return '<p class="empty">Nothing here yet.</p>';
    return '<div class="grid">' + items.map(cardHTML).join('') + '</div>';
  }

  /* ---------------- views ---------------- */

  /* ---------------- the upgrade banner ---------------- */

  /* Shown to members without a subscription. Counted from the same locked
     flags the cards carry, so it can never promise something the library does
     not actually have shut. */
  function paintJoinBanner() {
    var el = document.getElementById('join-banner');
    if (!el) return;
    if (me.hasMembership) { el.hidden = true; el.innerHTML = ''; return; }

    var byKind = {};
    all.forEach(function (it) { if (it.locked) byKind[it.kind] = (byKind[it.kind] || 0) + 1; });

    var dls = 0;
    Object.keys(downloads).forEach(function (k) {
      downloads[k].forEach(function (it) { if (it.locked) dls++; });
    });
    var shutCourses = courses.filter(function (c) { return c.locked; }).length;

    var total = Object.keys(byKind).reduce(function (n, k) { return n + byKind[k]; }, 0) + dls;
    // Nothing is shut, so there is nothing to sell. A banner here would be an
    // advert for something they already have.
    if (!total && !shutCourses) { el.hidden = true; el.innerHTML = ''; return; }

    // The biggest few categories, named. A single total is abstract; "901
    // prompts" is the same fact in a form somebody can picture.
    var chips = Object.keys(byKind)
      .sort(function (a, b) { return byKind[b] - byKind[a]; })
      .slice(0, 5)
      .map(function (k) {
        var label = (KINDS[k] && KINDS[k].label) || k;
        return '<span>' + byKind[k].toLocaleString() + ' ' + esc(label.toLowerCase()) + '</span>';
      });
    if (dls) chips.push('<span>' + dls + ' downloads</span>');
    if (shutCourses) chips.push('<span>' + shutCourses + ' courses</span>');

    var tiles = '';
    for (var i = 0; i < 9; i++) tiles += '<i' + (i === 4 ? ' class="on"' : '') + '></i>';

    el.innerHTML =
      '<a class="jb" href="join.html">' +
        '<span class="jb-art">' + tiles + '<span class="jb-lock">\ud83d\udd12</span></span>' +
        '<span class="jb-text">' +
          '<p class="jb-kicker">AI Founder University</p>' +
          '<h3>You are seeing a fraction of what is in here.</h3>' +
          '<p>' + (total ? '<b>' + total.toLocaleString() + '</b> prompts, tutorials, templates and downloads are locked'
                         : 'Courses are locked') +
            (shutCourses && total ? ', along with ' + shutCourses + ' courses' : '') +
            '. One membership opens all of it \u2014 and everything added every week.</p>' +
          '<span class="jb-chips">' + chips.join('') + '</span>' +
          // The newest reason to subscribe, and the one nothing else here says.
          // A line rather than another chip: the chips are counts of what is
          // shut, and this is not one of those.
          '<span class="jb-new">🔌 <b>New</b> · pull any of it straight into Claude</span>' +
        '</span>' +
        '<span class="jb-cta">' +
          '<span class="jb-btn">Unlock everything \u2014 $39/month</span>' +
          '<span class="jb-fine">Cancel any time \u00b7 keep what you bought</span>' +
        '</span>' +
      '</a>';
    el.hidden = false;
  }


  /* ---------------- the community ---------------- */

  var spaces = {};            // key -> { label, glyph, blurb, canPost, threads, ... }
  var threadSpace = '';       // the space of the thread being read, for the sidebar
  var feeds = {};             // space -> threads, so going back does not refetch
  var openThread = null;      // { thread, replies }

  function spaceMeta(key) { return spaces[key] || { label: key, glyph: '', blurb: '' }; }

  /** "2 days ago" beats a timestamp on something you are deciding whether to read. */
  function ago(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var secs = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    if (secs < 604800) return Math.floor(secs / 86400) + 'd ago';
    return d.toLocaleDateString();
  }

  /* An avatar is the member's photo when they have one. Initials otherwise -
     never a stock silhouette, which makes a room of real people look like a
     room of placeholders. */
  function avatar(name, cls) {
    var initial = String(name || 'M').trim().charAt(0).toUpperCase() || 'M';
    return '<span class="av ' + (cls || '') + '">' + esc(initial) + '</span>';
  }

  /** Markup already sanitised by the server; shown as the text it is. */
  function excerpt(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function loadSpaces() {
    return fetch('/api/community/list', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return null;
        spaces = {};
        d.spaces.forEach(function (sp) {
          spaces[sp.key] = sp;
          var el = document.getElementById('cnt-c-' + sp.key);
          if (el) el.textContent = sp.threads || '';
        });
        return d;
      })
      .catch(function () { return null; });
  }

  /* ---- a space ---- */

  /* What each room is for, so the locked panel can say it without having
     loaded the spaces - which is the one thing a member without a membership
     is not allowed to do. */
  var SPACE_PITCH = {
    all: ['Community', 'Everything the other founders are asking, building and sharing, newest first.'],
    announcements: ['Announcements', 'Hear first about new courses, new tools and what is coming next.'],
    intros: ['Introductions', 'Meet the other founders building with AI, and tell them what you are working on.'],
    help: ['Ask for help', 'Stuck on a prompt, a tool or a lesson? Ask, and members and the team both answer.'],
    wins: ['Wins', 'See what other members are shipping, and post your own.']
  };

  function renderSpace(c, key) {
    var pitch = SPACE_PITCH[key] || ['Community', 'Talk to the other members.'];
    if (!me.hasMembership) {
      c.innerHTML = '<h1 class="page-h">' + esc(pitch[0]) + '</h1>' +
        '<p class="page-sub">' + esc(pitch[1]) + '</p>' +
        '<div class="req-card locked-perk">' +
          '<span class="lock-badge">\ud83d\udd12</span>' +
          '<h2>A membership perk</h2>' +
          '<p class="sub">The AI Founder University community is open to members \u2014 ask questions, ' +
            'share what you are building, and get answers from other founders and from the team.</p>' +
          '<a class="dl" href="join.html" style="display:inline-flex;margin-top:14px">' +
            '\ud83d\udd12 Unlock with the membership</a>' +
        '</div>';
      return;
    }

    var all = key === 'all';
    var sp = all
      ? { label: 'Community', glyph: '\u2728', blurb: SPACE_PITCH.all[1], canPost: false }
      : spaceMeta(key);

    var head =
      '<div class="sp-head"><span class="g">' + (sp.glyph || '') + '</span>' +
        '<div><h1 class="page-h" style="margin:0">' + esc(sp.label) + '</h1>' +
        '<p class="page-sub" style="margin:6px 0 0">' + esc(sp.blurb || '') + '</p></div></div>' +
      (sp.canPost
        ? '<button class="sp-new" id="sp-new" type="button"><span>\u270e</span>' +
            (key === 'intros' ? 'Introduce yourself' : key === 'wins' ? 'Share a win'
              : key === 'help' ? 'Ask a question' : 'New announcement') + '</button>'
        : all ? '<div style="height:18px"></div>'
        : '<p class="page-sub" style="margin:16px 0 22px">Posted by the AI Founder University team. Replies are open to everyone.</p>') +
      // One box over the whole community, not this room: somebody looking for
      // an answer does not know which room it was given in.
      '<div class="sp-search"><span>\ud83d\udd0d</span>' +
        '<input id="sp-q" type="search" placeholder="Search the community\u2026" ' +
          'value="' + esc(communityQ) + '" autocomplete="off">' +
        (communityQ ? '<button class="x" id="sp-qx" type="button" aria-label="Clear">\u00d7</button>' : '') +
      '</div>';

    c.innerHTML = head + '<div id="sp-body"><p class="empty">Loading\u2026</p></div>';
    if (sp.canPost) document.getElementById('sp-new').addEventListener('click', function () { newThread(key); });
    wireCommunitySearch(key);

    var url = communityQ
      ? '/api/community/list?q=' + encodeURIComponent(communityQ)
      : '/api/community/list?space=' + encodeURIComponent(key);

    fetch(url, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (view !== 'c-' + key) return;              // they navigated on
        var body = document.getElementById('sp-body');
        if (!body) return;
        if (!d) { body.innerHTML = '<p class="empty">Could not load this yet.</p>'; return; }
        d.spaces.forEach(function (x) {
          spaces[x.key] = x;
          var el = document.getElementById('cnt-c-' + x.key);
          if (el) el.textContent = x.threads || '';
        });
        feeds[key] = d.threads;
        var found = communityQ
          ? '<p class="sp-found">' + d.threads.length +
              (d.threads.length === 1 ? ' result for \u201c' : ' results for \u201c') +
              esc(communityQ) + '\u201d</p>'
          : '';
        body.innerHTML = found + (d.threads.length
          ? '<div class="th-list">' + d.threads.map(function (t) { return threadCard(t, all || !!communityQ); }).join('') + '</div>'
          : '<p class="empty">' + esc(communityQ
              ? 'Nothing matched. Try fewer words.'
              : (sp.empty || 'Nothing here yet.')) + '</p>');
        [].forEach.call(body.querySelectorAll('.th'), function (el) {
          el.addEventListener('click', function () {
            var id = Number(el.getAttribute('data-id'));
            var hit = (d.threads || []).find(function (x) { return x.id === id; });
            // Back goes to the room the thread lives in rather than to a
            // search that may no longer be on screen.
            threadSpace = (hit && hit.space) || (all ? 'all' : key);
            // And the search ends here. Its button says "back to Ask for
            // help"; landing there still filtered by something typed two
            // clicks ago would make that label a lie.
            communityQ = '';
            location.hash = 't-' + id;
          });
        });
      });
  }

  function threadCard(t, showSpace) {
    var sp = spaceMeta(t.space);
    return '<article class="th' + (t.pinned ? ' pinned' : '') + '" data-id="' + t.id + '">' +
      avatar(t.author) +
      '<div class="th-main">' +
        '<div class="th-t"><b>' + esc(t.title || excerpt(t.body).slice(0, 80)) + '</b>' +
          (showSpace ? '<span class="tag">' + esc(sp.label || t.space) + '</span>' : '') +
          (t.pinned ? '<span class="tag pin">Pinned</span>' : '') +
          (t.resolved ? '<span class="tag ok">Answered</span>' : '') +
          (t.isAdmin ? '<span class="tag staff">Team</span>' : '') +
          (t.lesson ? '<span class="tag les">on ' + esc(t.lesson) + '</span>' : '') +
        '</div>' +
        '<p class="th-ex">' + esc(excerpt(t.body)) + '</p>' +
        '<div class="th-m"><span>' + esc(t.author) + '</span><span>\u00b7</span>' +
          '<span>' + esc(ago(t.lastAt || t.createdAt)) + '</span>' +
          (t.replies ? '<span>\u00b7</span><span>' + t.replies + (t.replies === 1 ? ' reply' : ' replies') + '</span>' : '') +
          (t.likes ? '<span>\u00b7</span><span>\u2665 ' + t.likes + '</span>' : '') +
        '</div>' +
      '</div></article>';
  }

  /* ---- one thread ---- */

  function renderThread(c, id) {
    // A link to one post, followed by somebody without the membership: the
    // server would refuse it, and "that post is no longer here" is not what
    // happened. Same locked screen as the room it is in.
    if (!me.canPreview) return renderSpace(c, 'all');
    c.innerHTML = '<p class="empty">Loading\u2026</p>';
    fetch('/api/community/thread?id=' + encodeURIComponent(id), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (view !== 't-' + id) return;
        if (!d) { c.innerHTML = '<p class="empty">That post is no longer here.</p>'; return; }
        openThread = d;
        threadSpace = d.thread.space;
        [].forEach.call(document.querySelectorAll('.nav'), function (n) {
          n.classList.toggle('active', n.getAttribute('data-view') === 'c-' + threadSpace);
        });
        paintThread(c, d);
      });
  }

  function paintThread(c, d) {
    var t = d.thread;
    var answer = t.resolvedReplyId;

    c.innerHTML =
      '<div class="tv">' +
      '<button class="tv-back" type="button" id="tv-back">\u2190 ' + esc(t.spaceLabel) + '</button>' +
      '<div class="tv-head">' + avatar(t.author) +
        '<div style="flex:1;min-width:0">' +
          '<h1>' + esc(t.title || 'Post') + '</h1>' +
          '<div class="tv-m"><span>' + esc(t.author) + '</span>' +
            (t.isAdmin ? '<span class="tag staff">Team</span>' : '') +
            '<span>\u00b7</span><span>' + esc(ago(t.createdAt)) + '</span>' +
            (t.resolved ? '<span class="tag ok">Answered</span>' : '') +
            (t.pinned ? '<span class="tag pin">Pinned</span>' : '') +
            (t.lesson ? '<span class="tag les">on ' + esc(t.lesson) + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tv-body">' + window.rtSanitize(t.body) + '</div>' +
      '<div class="tv-acts">' +
        '<button type="button" id="tv-like" class="' + (t.liked ? 'on' : '') + '">' +
          '<span>' + (t.liked ? '\u2665' : '\u2661') + '</span><span id="tv-likes">' + (t.likes || 0) + '</span></button>' +
        (t.canResolve
          ? '<button type="button" id="tv-res" class="' + (t.resolved ? 'on' : '') + '">' +
              (t.resolved ? '\u2713 Answered' : 'Mark answered') + '</button>' : '') +
        (d.isAdmin
          ? '<button type="button" id="tv-pin">' + (t.pinned ? 'Unpin' : 'Pin to top') + '</button>' : '') +
        (t.canDelete ? '<button type="button" id="tv-del" class="danger">Delete</button>' : '') +
      '</div>' +

      '<div id="tv-replies">' +
        (d.replies.length
          ? d.replies.map(function (r) { return replyHTML(r, r.id === answer); }).join('')
          : '') +
      '</div>' +

      '<div class="cw">' +
        '<h3>' + (d.replies.length ? 'Add a reply' : 'Be the first to reply') + '</h3>' +
        '<div id="tv-rt"></div>' +

  function act(body) {
    return fetch('/api/community/act', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.ok ? r.json() : null; });

  function wireThreadActions(c, d) {
    var t = d.thread;

    document.getElementById('tv-like').addEventListener('click', function () {
      var btn = this;
      act({ id: t.id, like: true }).then(function (res) {
        if (!res) return;
        t.liked = res.liked; t.likes = res.likes;
        btn.classList.toggle('on', res.liked);
        btn.firstChild.textContent = res.liked ? '\u2665' : '\u2661';
        document.getElementById('tv-likes').textContent = res.likes;
      });
    });

    var res = document.getElementById('tv-res');
    if (res) res.addEventListener('click', function () {
      act({ id: t.id, resolved: !t.resolved }).then(function (r) {
        if (r) renderThread(c, t.id);
      });
    });

    var pin = document.getElementById('tv-pin');
    if (pin) pin.addEventListener('click', function () {
      act({ id: t.id, pinned: !t.pinned }).then(function (r) {
        if (r) renderThread(c, t.id);
      });
    });

    var del = document.getElementById('tv-del');
    if (del) del.addEventListener('click', function () {
      if (!window.confirm('Delete this post? Replies to it go too.')) return;
      act({ id: t.id, remove: true }).then(function (r) {
        if (r) { delete feeds[t.space]; location.hash = 'c-' + t.space; loadSpaces(); }
      });
    });

    document.getElementById('tv-replies').addEventListener('click', function (e) {
      var likeBtn = e.target.closest('[data-like]');
      if (likeBtn) {
        act({ id: Number(likeBtn.getAttribute('data-like')), like: true }).then(function (r) {
          if (!r) return;
          likeBtn.classList.toggle('on', r.liked);
          likeBtn.textContent = (r.liked ? '\u2665' : '\u2661') + ' ' + (r.likes || '');
        });
        return;
      }
      var delBtn = e.target.closest('[data-del]');
      if (delBtn && window.confirm('Delete this reply?')) {
        act({ id: Number(delBtn.getAttribute('data-del')), remove: true }).then(function (r) {
          if (r) renderThread(c, t.id);
        });
      }
    });

    // The same editor members write comments in, mounted again - not a second
    // one built to look like it.
    var rt = window.rtMount(document.getElementById('tv-rt'), { placeholder: 'Write a reply\u2026' });
    var send = document.getElementById('tv-send');
    function post() {
      if (rt.isEmpty()) return;
      send.disabled = true; send.textContent = 'Posting\u2026';
      fetch('/api/community/post', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parentId: t.id, body: rt.html() })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (out) {
          send.disabled = false; send.textContent = 'Post reply';
          if (!out.ok) { alert(out.j.error || 'Could not post that.'); return; }
          rt.clear();
          delete feeds[t.space];
          renderThread(c, t.id);
          loadNotes();
        })
        .catch(function () { send.disabled = false; send.textContent = 'Post reply'; });
    }
    send.addEventListener('click', post);
    rt.el.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') post();
    });
  }

  /* ---- starting a thread ---- */

  var ntRt = null, ntSpace = '';
  function newThread(key) {
    ntSpace = key;
    var sp = spaceMeta(key);
    document.getElementById('nt-h').textContent =
      key === 'intros' ? 'Introduce yourself'
      : key === 'wins' ? 'Share a win'
      : key === 'help' ? 'Ask a question'
      : 'New announcement';
    document.getElementById('nt-sub').textContent = sp.blurb || '';
    document.getElementById('nt-title').value = '';
    document.getElementById('nt-err').hidden = true;
    if (!ntRt) ntRt = window.rtMount(document.getElementById('nt-rt'), { placeholder: 'Write your post\u2026' });
    else ntRt.clear();
    document.getElementById('nt').classList.add('show');
    document.getElementById('nt-title').focus();
  }

  /* What is being searched for, kept outside the view so it survives a
     repaint and is cleared when they walk away from the community. */
  var communityQ = '';
  var qTimer = null;

  function wireCommunitySearch(key) {
    var box = document.getElementById('sp-q');
    if (!box) return;

    box.addEventListener('input', function () {
      clearTimeout(qTimer);
      var v = box.value.trim();
      // Waits for them to stop typing: one query per search, not one per key.
      qTimer = setTimeout(function () {
        if (v === communityQ) return;
        communityQ = v;
        var at = box.selectionStart;
        renderSpace(document.getElementById('content'), key);
        var again = document.getElementById('sp-q');
        if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
      }, 280);
    });

    box.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && box.value) {
        box.value = ''; communityQ = ''; clearTimeout(qTimer);
        renderSpace(document.getElementById('content'), key);
      }
    });

    var x = document.getElementById('sp-qx');
    if (x) x.addEventListener('click', function () {
      communityQ = ''; clearTimeout(qTimer);
      renderSpace(document.getElementById('content'), key);
      var again = document.getElementById('sp-q');
      if (again) again.focus();
    });
  }

  function closeNewThread() { document.getElementById('nt').classList.remove('show'); }

  function wireNewThread() {
    document.getElementById('nt-no').addEventListener('click', closeNewThread);
    document.getElementById('nt').addEventListener('click', function (e) {
      if (e.target.id === 'nt') closeNewThread();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.getElementById('nt').classList.contains('show')) closeNewThread();
    });

    document.getElementById('nt-go').addEventListener('click', function () {
      var btn = this;
      var title = document.getElementById('nt-title').value.trim();
      var err = document.getElementById('nt-err');
      err.hidden = true;
      if (!title) { err.textContent = 'Give it a title.'; err.hidden = false; return; }
      if (!ntRt || ntRt.isEmpty()) { err.textContent = 'Write something first.'; err.hidden = false; return; }

      btn.disabled = true; btn.textContent = 'Posting\u2026';
      fetch('/api/community/post', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ space: ntSpace, title: title, body: ntRt.html() })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (out) {
          btn.disabled = false; btn.textContent = 'Post';
          if (!out.ok) { err.textContent = out.j.error || 'Could not post that.'; err.hidden = false; return; }
          closeNewThread();
          ntRt.clear();
          delete feeds[ntSpace];
          loadSpaces();
          threadSpace = ntSpace;
          location.hash = 't-' + out.j.thread.id;
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = 'Post';
          err.textContent = 'Network error. Try again.'; err.hidden = false;
        });
    });

  /* ---------------- notifications ---------------- */

  var notes = [];

  function paintBell(unread) {
    var n = document.getElementById('bell-n');
    if (!n) return;
    n.textContent = unread > 9 ? '9+' : String(unread || '');
    n.classList.toggle('show', unread > 0);
  }

  function loadNotes() {
    if (!me.canPreview) return;
    fetch('/api/notifications', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        notes = d.notifications || [];
        paintBell(d.unread || 0);
        paintNotes();
      })
      .catch(function () {});
  }

  function paintNotes() {
    var list = document.getElementById('nb-list');
    if (!list) return;
    if (!notes.length) {
      list.innerHTML = '<p class="nb-empty">Nothing yet. Replies to your posts land here.</p>';
      return;
    }
    list.innerHTML = notes.map(function (n) {
      // Three kinds now, and they do not read alike: a reply is about a post,
      // a roadmap is a thing that has arrived.
      var what;
      if (n.kind === 'roadmap') {
        what = '<p>Your <b>personalised AI roadmap</b> is ready' +
          (n.title ? ' — ' + esc(n.title) : '') + '</p>';
      } else if (n.kind === 'roadmap_reply') {
        // Not "answered your question": the team writes under a roadmap
        // unprompted as well, and this said somebody had asked one when
        // nobody had.
        what = '<p><b>' + esc(n.actor) + '</b> commented on your <b>AI roadmap</b></p>';
      } else {
        what = '<p><b>' + esc(n.actor) + '</b> replied' +
          (n.title ? ' to <b>' + esc(n.title) + '</b>' : ' to your post') + '</p>';
      }
      return '<button class="nb-i' + (n.read ? '' : ' unread') + '" type="button" ' +
        'data-id="' + n.id + '" data-thread="' + (n.threadId || '') + '" ' +
        'data-go="' + (n.kind === 'roadmap' || n.kind === 'roadmap_reply' ? 'roadmap' : '') + '">' +
        '<span class="d"></span><span class="w">' + what +
          '<span class="t">' + esc(ago(n.createdAt)) + '</span>' +
        '</span></button>';
    }).join('');
  }

  function closeBell() { document.getElementById('nb').classList.remove('show'); }

  function wireBell() {
    var bell = document.getElementById('bell');
    var panel = document.getElementById('nb');
    if (!bell) return;

    bell.addEventListener('click', function (e) {
      e.stopPropagation();
      var opening = !panel.classList.contains('show');
      panel.classList.toggle('show', opening);
      if (opening) loadNotes();
    });

    // Anywhere else closes it, but not a click inside it - which would shut
    // the panel before the item underneath had a chance to be followed.
    document.addEventListener('click', function (e) {
      if (panel.classList.contains('show') && !panel.contains(e.target) && e.target !== bell) closeBell();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeBell();
    });

    document.getElementById('nb-read').addEventListener('click', function (e) {
      e.stopPropagation();
      fetch('/api/notifications', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: '{}'
      }).then(function () {
        notes.forEach(function (n) { n.read = true; });
        paintBell(0); paintNotes();
      });
    });

    document.getElementById('nb-list').addEventListener('click', function (e) {
      var item = e.target.closest('.nb-i');
      if (!item) return;
      var id = Number(item.getAttribute('data-id'));
      var thread = item.getAttribute('data-thread');
      var go = item.getAttribute('data-go');
      closeBell();
      // Marked read because they are about to read it; the count should not
      // wait for the round trip to catch up.
      var was = notes.find(function (n) { return n.id === id; });
      if (was && !was.read) {
        was.read = true;
        paintBell(notes.filter(function (n) { return !n.read; }).length);
        paintNotes();
      }
      fetch('/api/notifications', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      }).catch(function () {});
      if (go) {
        // The roadmap may have been published since this page loaded, so it is
        // refetched rather than opened from whatever was cached at boot.
        rm.loaded = false;
        location.hash = go;
        if (view === go) render();
      } else if (thread) location.hash = 't-' + thread;
    });
  }



  /* ---------------- the weekly AI reports ---------------- */

  var rpState = { list: null, open: null, cache: {} };

  function loadReports() {
    return fetch('/api/reports', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        rpState.list = d ? (d.reports || []) : [];
        var c = document.getElementById('cnt-reports');
        if (c) c.textContent = rpState.list.length || '';
        return rpState.list;
      })
      .catch(function () { rpState.list = []; return []; });
  }

  function renderReports(c) {
    if (!rpState.list) {
      c.innerHTML = '<p class="empty">Loading…</p>';
      loadReports().then(function () { if (view === 'reports') renderReports(document.getElementById('content')); });
      return;
    }
    c.innerHTML =
      '<div class="rp-head"><h1>AI Reports</h1>' +
        (rpState.list.length ? '<span class="rp-count">' + rpState.list.length +
          ' report' + (rpState.list.length === 1 ? '' : 's') + '</span>' : '') +
      '</div>' +
      '<p class="rp-sub">What changed in AI this week, and what to do about it. Every claim links ' +
        'to the announcement it came from. One report every Monday.</p>' +
      window.reportDoc.cards(rpState.list, {});
    window.reportDoc.wire(c, { onOpen: function (n) { location.hash = 'report-' + n; } });
  }

  function renderReport(c, n) {
    var cached = rpState.cache[n];
    if (cached) return paintReport(c, cached);
    c.innerHTML = '<p class="empty">Loading…</p>';
    fetch('/api/reports?n=' + encodeURIComponent(n), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (view !== 'report-' + n) return;
        if (!d || !d.report) { c.innerHTML = '<p class="empty">That report is not here.</p>'; return; }
        rpState.cache[n] = d.report;
        paintReport(c, d.report);
      })
      .catch(function () { c.innerHTML = '<p class="empty">Could not load that report.</p>'; });
  }

  function paintReport(c, R) {
    c.innerHTML = window.reportDoc.render(R, {
      // Absolute, so a link still works from a saved PDF, and with the query
      // string so a member who arrived with one does not get a page reload.
      base: location.origin + location.pathname + location.search
    });
    window.reportDoc.wire(c, { onBack: function () { location.hash = 'reports'; } });
    window.scrollTo(0, 0);
  }

  /* ---------------- the personalised AI roadmap ---------------- */

  var rm = { steps: null, request: null, loaded: false, at: 0, answers: {}, err: '', notes: [] };

  /**
   * "It has arrived" in the sidebar.
   *
   * A published roadmap is the one thing here that turns up without being
   * asked for, so it says New until it has been opened, and then stops. The
   * key is the publish time, so a rewritten roadmap says New again - it is a
   * different plan, and that is worth looking at twice.
   */
  function roadmapKey() {
    var r = rm.request;
    return r && r.status === 'published' ? String(r.publishedAt || r.id || '1') : '';
  }
  function roadmapSeen() {
    try { return localStorage.getItem('afu_rm_seen') || ''; } catch (e) { return ''; }
  }
  function paintRoadmapBadge() {
    var c = document.getElementById('cnt-roadmap');
    if (!c) return;
    var key = roadmapKey();
    var fresh = !!key && roadmapSeen() !== key;
    c.textContent = fresh ? 'New' : (key ? '✓' : '');
    c.classList.toggle('is-new', fresh);
  }
  function markRoadmapSeen() {
    var key = roadmapKey();
    if (!key) return;
    try { localStorage.setItem('afu_rm_seen', key); } catch (e) {}
    paintRoadmapBadge();
  }

  function loadRoadmap() {
    return fetch('/api/roadmap', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return null;
        rm.steps = d.steps;
        rm.request = d.request;
        rm.loaded = true;
        if (d.request && d.request.answers) rm.answers = d.request.answers;
        if (d.notes) rm.notes = d.notes;
        paintRoadmapBadge();
        return d;
      })
      .catch(function () { return null; });
  }

  function renderRoadmap(c) {
    if (!me.hasMembership) {
      c.innerHTML = '<h1 class="page-h">Your AI Roadmap</h1>' +
        '<p class="page-sub">A plan built for your business, not a template.</p>' +
        '<div class="req-card locked-perk"><span class="lock-badge">\ud83d\udd12</span>' +
          '<h2>A membership perk</h2>' +
          '<p class="sub">We build you a personalised AI roadmap from what you tell us about your ' +
            'business \u2014 how the next 90 days reach your goal, week by week, and the exact courses, ' +
            'prompts and tools in here to use at each step.</p>' +
          '<a class="dl" href="join.html" style="display:inline-flex;margin-top:14px">' +
            '\ud83d\udd12 Unlock with the membership</a></div>';
      return;
    }

    if (!rm.loaded) {
      c.innerHTML = '<p class="empty">Loading\u2026</p>';
      loadRoadmap().then(function () { if (view === 'roadmap') renderRoadmap(document.getElementById('content')); });
      return;
    }

    var st = rm.request && rm.request.status;
    if (st === 'published' && rm.request.roadmap) return paintRoadmap(c, rm.request.roadmap);
    // 'failed' waits too. A generation that fell over is ours to retry, and
    // dropping somebody back onto the intro would read as their answers having
    // been lost — which is both alarming and untrue.
    if (st === 'new' || st === 'generating' || st === 'draft' || st === 'failed') {
      return paintWaiting(c, st);
    }
    if (rm.at > 0) return paintForm(c);
    return paintRoadmapIntro(c);
  }

  function paintRoadmapIntro(c) {
    c.innerHTML =
      '<h1 class="page-h">Your Personalised AI Roadmap</h1>' +
      '<p class="page-sub">Done for you, from what you tell us about your business.</p>' +
      '<div class="rm-hero">' +
        '<span class="val">\u2728 Included in your membership</span>' +
        '<h2>High clarity, clear direction, zero overwhelm.</h2>' +
        '<p>We build your roadmap by hand from the answers you give us \u2014 your industry, your ' +

        '<p>It sets out the priorities, strategy, tactics and tools to focus on across the next ' +
          '<b>7, 30 and 90 days</b>, and names the exact courses, prompts, skills and automations ' +

  function paintWaiting(c, st) {
    var done = st !== 'new';
    c.innerHTML =
      '<h1 class="page-h">Your Personalised AI Roadmap</h1>' +
      '<p class="page-sub">Submitted \u2014 we are working on it.</p>' +
      '<div class="rm-wait"><span class="g">\ud83d\uddfa\ufe0f</span>' +
        '<h3>' + (done ? 'Being written now' : 'We have your answers') + '</h3>' +

  /* ---- the form ---- */

  function paintForm(c) {
    var i = rm.at - 1;
    var step = rm.steps[i];
    var bars = rm.steps.map(function (_, n) {
      return '<i class="' + (n < rm.at ? 'on' : '') + '"></i>';
    }).join('');

    c.innerHTML =
      '<h1 class="page-h">Your Personalised AI Roadmap</h1>' +
      '<p class="page-sub">Step ' + rm.at + ' of ' + rm.steps.length + '. Nothing here is shared with anybody else.</p>' +
      '<div class="rm-form">' +
        '<div class="rm-prog">' + bars + '</div>' +
        '<p class="rm-step-h">' + esc(step.title) + '</p>' +
        '<h3>' + esc(step.title) + '</h3>' +
        '<p class="blurb">' + esc(step.blurb) + '</p>' +
        step.fields.map(fieldHTML).join('') +
        (rm.err ? '<p class="rm-err">' + esc(rm.err) + '</p>' : '') +
        '<div class="rm-nav">' +
          '<button class="rm-next" id="rm-next" type="button">' +
            (rm.at === rm.steps.length ? 'Submit for your roadmap' : 'Continue') + '</button>' +
          (rm.at > 1 ? '<button class="rm-back" id="rm-prev" type="button">Back</button>' : '') +
        '</div>' +
      '</div>';

    wireForm(step);
  }

  function fieldHTML(f) {
    var v = rm.answers[f.key] || '';
    var label = '<label for="f-' + esc(f.key) + '">' + esc(f.label) +
      (f.required ? '<span class="req">*</span>' : '') + '</label>';

    if (f.type === 'choice') {
      return '<div class="rm-f" data-k="' + esc(f.key) + '">' + label + '<div class="rm-opts">' +
        f.options.map(function (o) {
          return '<label class="rm-opt' + (v === o ? ' on' : '') + '">' +
            '<input type="radio" name="' + esc(f.key) + '" value="' + esc(o) + '"' +
              (v === o ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
        }).join('') + '</div></div>';
    }
    if (f.type === 'line') {
      return '<div class="rm-f" data-k="' + esc(f.key) + '">' + label +
        '<input type="text" id="f-' + esc(f.key) + '" value="' + esc(v) + '" maxlength="300" ' +
        'placeholder="' + esc(f.placeholder) + '"></div>';
    }
    return '<div class="rm-f" data-k="' + esc(f.key) + '">' + label +
      '<textarea id="f-' + esc(f.key) + '" maxlength="2000" ' +
      'placeholder="' + esc(f.placeholder) + '">' + esc(v) + '</textarea></div>';
  }

  function collect(step) {
    step.fields.forEach(function (f) {
      if (f.type === 'choice') {
        var on = document.querySelector('input[name="' + CSS.escape(f.key) + '"]:checked');
        if (on) rm.answers[f.key] = on.value;
      } else {
        var el = document.getElementById('f-' + f.key);
        if (el) {
          var v = el.value.trim();
          if (v) rm.answers[f.key] = v; else delete rm.answers[f.key];
        }
      }
    });
  }

  function wireForm(step) {
    [].forEach.call(document.querySelectorAll('.rm-opt input'), function (r) {
      r.addEventListener('change', function () {
        [].forEach.call(r.closest('.rm-opts').querySelectorAll('.rm-opt'), function (o) {
          o.classList.remove('on');
        });
        r.closest('.rm-opt').classList.add('on');
      });
    });

    var prev = document.getElementById('rm-prev');
    if (prev) prev.addEventListener('click', function () {
      collect(step); rm.err = ''; rm.at--;
      renderRoadmap(document.getElementById('content'));
    });

    document.getElementById('rm-next').addEventListener('click', function () {
      collect(step);
      // Checked here as well as on the server, so somebody is told on the step
      // they are standing on rather than six screens later.
      var gap = step.fields.find(function (f) { return f.required && !rm.answers[f.key]; });
      if (gap) {
        rm.err = 'Please answer: ' + gap.label;
        renderRoadmap(document.getElementById('content'));
        var el = document.querySelector('[data-k="' + CSS.escape(gap.key) + '"]');
        if (el) el.scrollIntoView({ block: 'center' });
        return;
      }
      rm.err = '';
      if (rm.at < rm.steps.length) {
        rm.at++;
        renderRoadmap(document.getElementById('content'));
        window.scrollTo(0, 0);
        return;
      }
      submitRoadmap();
    });
  }

  function submitRoadmap() {
    var btn = document.getElementById('rm-next');
    btn.disabled = true; btn.textContent = 'Sending\u2026';
    fetch('/api/roadmap', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: rm.answers })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (out) {
        btn.disabled = false; btn.textContent = 'Submit for your roadmap';
        if (!out.ok) {
          rm.err = out.j.missing ? 'Still needed: ' + out.j.missing.join(', ') : (out.j.error || 'Could not send that.');
          renderRoadmap(document.getElementById('content'));
          return;
        }
        rm.loaded = false; rm.at = 0;
        loadRoadmap().then(function () {
          renderRoadmap(document.getElementById('content'));
          window.scrollTo(0, 0);
        });
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Submit for your roadmap';
        rm.err = 'Network error. Try again.';
        renderRoadmap(document.getElementById('content'));
      });
  }

  /* ---- the finished roadmap ---- */

  /**
   * The conversation under the plan.
   *
   * Questions about a roadmap used to be pointed at the community, which asks
   * somebody to publish their revenue and their constraints in a room full of
   * other members to ask whether their own plan is right. It belongs here,

  function roadmapNotes() {
    var notes = rm.notes || [];
    return '<section class="rm-notes"><h2>Questions and feedback</h2>' +
      '<p class="sub">Anything here not fit, or not clear? Ask below and we will answer, and ' +
        'adjust the roadmap where it needs adjusting. Only you and the AFU team see this.</p>' +
      (notes.length
        ? '<div class="rm-thread">' + notes.map(function (n) {
            return '<div class="rm-note' + (n.mine ? '' : ' team') + '">' +
              '<div class="h"><b>' + esc(n.author) + '</b><span>' + esc(ago(n.createdAt)) + '</span></div>' +
              // Sanitised again on the way out, as everything written in the
              // editor is: stored safe is not the same as rendered safe.
              '<div class="rt-body">' + window.rtSanitize(n.body || '') + '</div></div>';
          }).join('') + '</div>'
        : '') +
      '<div class="rm-ask"><div id="rm-note-rt"></div>' +
        '<div class="rm-ask-go"><button class="rm-send" id="rm-note-send" type="button">Send</button>' +
        '<span class="rm-note-msg" id="rm-note-msg"></span></div></div></section>';

  function wireRoadmapNotes(host) {
    var btn = host.querySelector('#rm-note-send');
    var msg = host.querySelector('#rm-note-msg');
    var mount = host.querySelector('#rm-note-rt');
    if (!btn || !mount || !window.rtMount) return;

    // The same editor as the community and the lesson comments, mounted again
    // rather than a plain box that looks like it: bold, lists, links, emoji.
    var rt = window.rtMount(mount, { placeholder: 'Ask a question, or tell us what does not fit' });

    btn.addEventListener('click', function () {
      if (rt.isEmpty()) { rt.focus(); return; }
      btn.disabled = true; msg.textContent = 'Sending…';
      fetch('/api/roadmap', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: rt.html() })
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          btn.disabled = false;
          if (!d) { msg.textContent = 'That did not send. Try again.'; return; }
          rm.notes = d.notes || [];
          rt.clear();
          msg.textContent = '';
          // Repainted rather than appended, so the thread on screen is the
          // thread on the server.
          renderRoadmap(document.getElementById('content'));
        })
        .catch(function () { btn.disabled = false; msg.textContent = 'Network error.'; });
    });
  }

  function paintRoadmap(c, R) {
    var req = rm.request || {};
    markRoadmapSeen();
    c.innerHTML = window.roadmapDoc.render(R, {
      name: me.name || '',
      publishedAt: req.publishedAt,
      // Absolute, so the links still work from a saved PDF. Same page, so
      // clicking one in the member area is still a hash change rather than a
      // reload.
      // Query string included: without it a member who arrived with one on the
      // URL would have every link in their roadmap reload the page instead of
      // opening over it.
      base: location.origin + location.pathname + location.search,
      foot: 'Built for you by AI Founder University.'
    });
    window.roadmapDoc.wire(c, {
      // Ticks belong to this published version. A republished roadmap is a
      // different plan, and carrying the old ticks over would mark steps done
      // that nobody has done.
      storeKey: String(req.id || '0') + '_' + String(req.publishedAt || '')
    });

    // Outside the document, so it is not in the PDF: a printed plan with an
    // empty comment box at the end is a form nobody can fill in.
    var notes = document.createElement('div');
    notes.innerHTML = roadmapNotes();
    c.appendChild(notes);
    wireRoadmapNotes(c);
  }



  function render() {

    if (q) { renderSearch(c); return; }
    if (view === 'dashboard') return renderDashboard(c);

    if (view === 'bookmarks') return renderBookmarks(c);
    if (view === 'request') return renderRequest(c);
    // Both of these draw their own locked screen for somebody without the
    // membership, which is the point of them being in the sidebar at all.
    if (view === 'roadmap') return renderRoadmap(c);
    if (view === 'reports') {

      return renderReports(c);

  /* ---------------- library search, sort and filters ---------------- */
  var LIB_SORTS = [['new','Newest to Oldest'],['old','Oldest to Newest'],['fav','Most Favorited'],['az','A – Z'],['za','Z – A']];
  var libState = {};                       // per library, so switching tabs keeps your place
  function libSt(kind) { return libState[kind] || (libState[kind] = { q: '', sort: 'new', cats: [], page: 1 }); }
  var PER_PAGE = 48;   // matches the source library

  // Every label an item can be filtered by: its category plus its own tags.
  function labelsOf(it) {
    var out = it.category ? [it.category] : [];
    (it.tags || []).forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });
    return out;
  }

  function libApply(items, st) {
    var out = items;
    if (st.q) {
      var q = st.q.toLowerCase();
      out = out.filter(function (it) {
        return (it.title + ' ' + (it.description || '') + ' ' + labelsOf(it).join(' ')).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (st.cats.length) {
      out = out.filter(function (it) {
        var l = labelsOf(it);
        return st.cats.some(function (c) { return l.indexOf(c) >= 0; });
      });
    }
    var t = function (x) { return x.createdAt ? new Date(x.createdAt).getTime() : 0; };
    var by = {
      new: function (a, b) { return t(b) - t(a); },
      old: function (a, b) { return t(a) - t(b); },
      fav: function (a, b) { return (b.likes || 0) - (a.likes || 0); },
      az:  function (a, b) { return String(a.title).localeCompare(String(b.title)); },
      za:  function (a, b) { return String(b.title).localeCompare(String(a.title)); }
    }[st.sort] || null;
    return by ? out.slice().sort(by) : out;
  }

  function renderKind(c, kind) {
    var meta = KINDS[kind] || { label: kind };
    var items = all.filter(function (it) { return it.kind === kind; });
    var st = libSt(kind);

    var html = '<h1 class="page-h">' + esc(meta.label) + '</h1>' +
      '<p class="page-sub">' + items.length + ' items in your library.</p>' +
      '<div class="lib-bar">' +
        '<span class="lib-search"><span class="ic">🔍</span>' +
        '<input id="lib-q" type="search" placeholder="Search ' + esc((meta.label || '').toLowerCase()) + '…" autocomplete="off" value="' + esc(st.q) + '"></span>' +
        '<span class="lib-sort"><select id="lib-sort">' +
          LIB_SORTS.map(function (o) { return '<option value="' + o[0] + '"' + (st.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
        '</select><span class="ar">▾</span></span>' +
        '<button class="lib-btn' + (st.cats.length ? ' on' : '') + '" id="lib-filter">⚑ Filter' +
          (st.cats.length ? '<span class="n">' + st.cats.length + '</span>' : '') + '</button>' +
        '<span class="lib-count" id="lib-count"></span>' +
      '</div><div id="lib-grid"></div>';
    c.innerHTML = html;

    // Only the grid is redrawn as you type, so the search box keeps focus.
    function paint() {
      var shown = libApply(items, st);
      var pages = Math.max(1, Math.ceil(shown.length / PER_PAGE));
      if (st.page > pages) st.page = pages;
      if (st.page < 1) st.page = 1;
      var from = (st.page - 1) * PER_PAGE;
      var page = shown.slice(from, from + PER_PAGE);

      var g = document.getElementById('lib-grid');
      if (!shown.length) {
        g.innerHTML = '<p class="empty">Nothing matches those filters.</p>';
      } else {
        // One flat grid. Grouping by category used to split a page of 48 into a
        // dozen headings, several of them holding a single card, which left the
        // rows ragged and full of gaps. The category is on every card and in
        // the filter, so the headings were not carrying their weight.
        g.innerHTML = gridOf(page) + pagerHTML(shown.length, pages, st.page, from, page.length);
      }
      document.getElementById('lib-count').textContent =
        shown.length === items.length ? '' : shown.length + ' of ' + items.length;
      bindCards(g);
      bindPager(g, pages, paint, st);
    }
    paint();

    var qEl = document.getElementById('lib-q'), qT;
    qEl.addEventListener('input', function () {
      clearTimeout(qT);
      qT = setTimeout(function () { st.q = qEl.value.trim(); st.page = 1; paint(); }, 140);
    });
    document.getElementById('lib-sort').addEventListener('change', function (e) { st.sort = e.target.value; st.page = 1; paint(); });
    document.getElementById('lib-filter').addEventListener('click', function () { openFilter(kind, items, st, function () { render(); }); });
  }

  /* ---------------- pagination ---------------- */
  // Which page buttons to show: always the first and last, the current one and
  // its neighbours, and an ellipsis for whatever the gap swallows.
  function pageWindow(page, pages) {
    // Few enough to list in full — windowing here produced gaps like "1 2 4",
    // which reads as a missing page rather than a shortened list.
    if (pages <= 7) {
      var all = [];
      for (var i = 1; i <= pages; i++) all.push(i);
      return all;
    }
    var out = [], push = function (p) { if (out[out.length - 1] !== p) out.push(p); };
    push(1);
    if (page - 1 > 2) push('…');
    for (var p = Math.max(2, page - 1); p <= Math.min(pages - 1, page + 1); p++) push(p);
    if (page + 1 < pages - 1) push('…');
    push(pages);
    return out;
  }

  function pagerHTML(total, pages, page, from, count) {
    if (total <= PER_PAGE) return '';
    var btns = pageWindow(page, pages).map(function (p) {
      return p === '…'
        ? '<span class="of">…</span>'
        : '<button class="pg' + (p === page ? ' now' : '') + '" data-page="' + p + '">' + p + '</button>';
    }).join('');
    return '<div class="pager">' +
      '<span class="showing">Showing ' + (from + 1) + '–' + (from + count) + ' of ' + total + ' items</span>' +
      '<span class="ctrls">' +
        '<button class="pg" data-page="1"' + (page === 1 ? ' disabled' : '') + ' aria-label="First">&laquo;</button>' +
        '<button class="pg" data-page="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>Previous</button>' +
        btns +
        '<button class="pg" data-page="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + '>Next</button>' +
        '<button class="pg" data-page="' + pages + '"' + (page === pages ? ' disabled' : '') + ' aria-label="Last">&raquo;</button>' +
        '<span class="goto">Go to <input type="number" min="1" max="' + pages + '" id="pg-go" placeholder="#"></span>' +
      '</span></div>';
  }

  function bindPager(scope, pages, paint, st) {
    [].forEach.call(scope.querySelectorAll('[data-page]'), function (b) {
      b.addEventListener('click', function () {
        var p = Number(b.getAttribute('data-page'));
        if (!p || p < 1 || p > pages || p === st.page) return;
        st.page = p;
        paint();
        // a new page starts at the top of the list, not wherever you were
        var bar = document.querySelector('.lib-bar');
        if (bar) bar.scrollIntoView({ block: 'start' });
      });
    });
    var go = scope.querySelector('#pg-go');
    if (go) go.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var p = Number(go.value);
      if (!p || p < 1 || p > pages) { go.value = ''; return; }
      st.page = p; paint();
      var bar = document.querySelector('.lib-bar');
      if (bar) bar.scrollIntoView({ block: 'start' });
    });
  }

  /* ---------------- filter dialog ---------------- */
  var filEl = document.getElementById('fil');
  function openFilter(kind, items, st, done) {
    var counts = {};
    items.forEach(function (it) { labelsOf(it).forEach(function (l) { counts[l] = (counts[l] || 0) + 1; }); });
    var labels = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
    var chosen = st.cats.slice();

    document.getElementById('fil-title').textContent = 'Filter ' + ((KINDS[kind] || {}).label || kind);
    var body = document.getElementById('fil-body');
    body.innerHTML = '<div class="fil-sec">Categories &amp; tags</div><div class="fil-list">' +
      labels.map(function (l) {
        return '<span class="fil-opt' + (chosen.indexOf(l) >= 0 ? ' on' : '') + '" data-l="' + esc(l) + '">' +
          esc(l) + '<span class="c">' + counts[l] + '</span></span>';
      }).join('') + '</div>';

    function matching() {
      return chosen.length
        ? items.filter(function (it) { var l = labelsOf(it); return chosen.some(function (c) { return l.indexOf(c) >= 0; }); }).length
        : items.length;
    }
    function refresh() {
      document.getElementById('fil-apply').textContent = 'Apply filters (' + matching() + ')';
    }
    [].forEach.call(body.querySelectorAll('.fil-opt'), function (o) {
      o.addEventListener('click', function () {
        var l = o.getAttribute('data-l'), i = chosen.indexOf(l);
        if (i >= 0) { chosen.splice(i, 1); o.classList.remove('on'); }
        else { chosen.push(l); o.classList.add('on'); }
        refresh();
      });
    });
    refresh();

    filEl.classList.add('show');
    document.getElementById('fil-clear').onclick = function () {
      chosen = [];
      [].forEach.call(body.querySelectorAll('.fil-opt'), function (o) { o.classList.remove('on'); });
      refresh();
    };
    document.getElementById('fil-apply').onclick = function () {
      st.cats = chosen; st.page = 1; filEl.classList.remove('show'); done();
    };
  }
  document.getElementById('fil-x').addEventListener('click', function () { filEl.classList.remove('show'); });
  filEl.addEventListener('click', function (e) { if (e.target === filEl) filEl.classList.remove('show'); });
