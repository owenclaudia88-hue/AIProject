<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your member area — AI Founder University</title>
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="../assets/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--bg-2:#111113;--bg-3:#161619;--bg-4:#1c1c20;
  --line:#242429;--line-2:#33333a;--txt:#f4f4f5;--txt-2:#a1a1aa;--txt-3:#71717a;
  --accent:#ff7a1a;--accent-2:#ffb020;--green:#34d399;--sidebar:264px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
/* .nav and friends set display, which overrides the browser's [hidden] rule —
   without this the staff-only Admin link shows for everyone. */
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#gate p{color:var(--txt-2);max-width:420px;line-height:1.6}
#gate .btn{display:inline-block;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;padding:13px 26px;border-radius:999px;margin-top:14px}

/* ---------- app shell ---------- */
#app{display:none}
.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:0 0 16px}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 20px 16px;position:sticky;top:0;background:var(--bg-2);z-index:2}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:900;font-size:.78rem;flex:none}
.sb-brand .name{font-weight:800;letter-spacing:-.02em;font-size:.98rem;line-height:1.15}
.sb-group{padding:14px 14px 2px}
.pill-beta{margin-left:auto;font-family:var(--mono);font-size:.56rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;color:var(--accent-2);
  background:rgba(255,176,32,.13);border:1px solid rgba(255,176,32,.35);
  border-radius:999px;padding:3px 7px}
.nav.is-locked .pill-beta{display:none}
.sb-group-t{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--txt-3);font-weight:700;padding:0 8px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 6px;border-radius:9px;color:var(--txt-2);font-size:.9rem;font-weight:500;cursor:pointer;border:1px solid transparent;width:calc(100% - 12px);background:none;text-align:left}
.nav[hidden]{display:none} /* display:flex above beats the hidden attribute */
.nav:hover{background:var(--bg-3);color:var(--txt)}
.nav.active{background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.28);color:#ffd9b3;font-weight:600}
.nav .nic{width:20px;text-align:center;font-size:1rem;flex:none}
.nav .n-count{margin-left:auto;font-size:.72rem;color:var(--txt-3);font-family:var(--mono)}
.nav.active .n-count{color:var(--accent-2)}
/* "New", for the one thing in here that arrives rather than being browsed to.
   It stops saying it once the roadmap has been opened. */
.nav .n-count.is-new{background:var(--accent);color:#1a0d00;font-weight:700;font-size:.62rem;
  text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:999px}
.sb-spacer{flex:1}
.sb-foot{padding:14px 20px 4px;border-top:1px solid var(--line);margin-top:8px}
/* The account card. It used to look like the headings above it, so nothing
   said it could be pressed. */
.acct{display:flex;align-items:center;gap:11px;width:100%;
  /* 56px tall, a real target rather than a line of text */
  padding:9px 11px;margin:0 0 10px;border-radius:12px;text-decoration:none;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt);cursor:pointer}
.acct:hover{background:var(--bg-4);border-color:var(--accent)}
.acct:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acct-pic{width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;
  display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:#140c03;font-weight:800;font-size:.95rem}
.acct-pic img{width:100%;height:100%;object-fit:cover;display:block}
.acct-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.acct-who b{font-size:.88rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-go{color:var(--txt-3);font-size:1.2rem;line-height:1;flex:none}
.acct:hover .acct-go{color:var(--accent-2)}
.sb-user{font-size:.78rem;color:var(--txt-3);word-break:break-all;margin-bottom:8px}
.sb-user b{color:var(--txt-2);font-weight:600;display:block}
/* the name identifies the person, the address identifies which account —
   both matter, so keep the email but let the name lead */
/* Truncated like the name above it. Without this a long address ran out of
   the card and under the chevron, which reads as a broken layout rather than
   as a long email. */
.sb-email{display:block;font-size:.72rem;color:var(--txt-3);opacity:.75;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout{background:none;border:1px solid var(--line-2);color:var(--txt-2);font-size:.82rem;padding:8px 14px;border-radius:999px;cursor:pointer;width:100%}
.signout:hover{background:var(--bg-3);color:var(--txt)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(10,10,11,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px clamp(18px,3vw,40px)}
.hamb{display:none;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);width:40px;height:40px;border-radius:10px;font-size:1.1rem;cursor:pointer;flex:none}
/* the bell */
.bell{position:relative;flex:none;margin-left:auto;width:40px;height:40px;border-radius:10px;
  background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);cursor:pointer;
  display:none;place-items:center;font-size:1.05rem}
.bell.on{display:grid}
.bell:hover{color:var(--txt);border-color:var(--line-2)}
.bell .n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--accent);color:#1a0d00;font-family:var(--mono);
  font-size:.6rem;font-weight:700;display:none;align-items:center;justify-content:center}
.bell .n.show{display:flex}

.nb{position:absolute;top:calc(100% + 10px);right:0;width:min(360px,calc(100vw - 28px));
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;z-index:30;
  box-shadow:0 20px 50px -14px rgba(0,0,0,.85);overflow:hidden;display:none;text-align:left}
.nb.show{display:block}
.nb-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.nb-h b{font-size:.92rem;flex:1}
.nb-h button{background:none;border:0;color:var(--txt-3);font-family:var(--mono);font-size:.72rem;
  cursor:pointer;padding:8px;border-radius:7px}
.nb-h button:hover{color:var(--accent-2)}
.nb-list{max-height:min(380px,60vh);overflow-y:auto}
.nb-i{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--line);padding:13px 16px;cursor:pointer;color:inherit;
  font-family:inherit}
.nb-i:last-child{border-bottom:0}
.nb-i:hover{background:var(--bg-3)}
.nb-i.unread{background:rgba(255,122,26,.06)}
.nb-i .d{flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:transparent}
.nb-i.unread .d{background:var(--accent)}
.nb-i .w{flex:1;min-width:0}
.nb-i .w p{margin:0;font-size:.88rem;line-height:1.45}
.nb-i .w b{font-weight:700}
.nb-i .w .t{display:block;margin-top:4px;font-family:var(--mono);font-size:.7rem;color:var(--txt-3)}
.nb-empty{padding:30px 16px;text-align:center;color:var(--txt-3);font-family:var(--mono);font-size:.84rem}
/* Anchored to the bell, the panel is wider than the space to its left and
   hangs off the screen. On a phone it belongs to the viewport instead. */
@media(max-width:620px){
  .nb{position:fixed;top:64px;left:12px;right:12px;width:auto}
}

.tb-acct{display:none;flex:none;margin-left:8px;border-radius:50%}
.tb-acct:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tb-acct .acct-pic{width:40px;height:40px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 15px 11px 40px;font-size:.92rem;font-family:var(--mono)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.16)}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--txt-3);font-size:.95rem}
.content{padding:clamp(22px,3vw,40px);flex:1;max-width:1320px;width:100%}

.page-h{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.page-sub{color:var(--txt-2);font-family:var(--mono);font-size:.9rem;margin:0 0 26px}

/* section headers */
.sec-h{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px}
.sec-h h2{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-h .c{font-family:var(--mono);font-size:.82rem;color:var(--txt-3)}
.sec-h.first{margin-top:6px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(266px,100%),1fr));gap:16px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s ease,transform .15s ease}
.card:hover{border-color:var(--line-2);transform:translateY(-3px)}
.card .head{aspect-ratio:16/9;background:#0e0e10 center/cover no-repeat;position:relative;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.card .dots{position:absolute;top:11px;left:12px;display:flex;gap:6px}
.card .dots i{width:9px;height:9px;border-radius:50%;display:block}
.d-r{background:#ff5f57}.d-y{background:#febc2e}.d-g{background:#28c840}
.card .head .glyph{font-size:2.5rem;opacity:.9;filter:saturate(1.1)}
.card .head.hmark{background:linear-gradient(160deg,#1a1a22,#101016)}
.card .head .kmark{display:flex;align-items:center;gap:13px;padding:0 18px;width:100%;justify-content:flex-start}
.card .head .kmark svg{width:62px;height:62px;flex:none}
.card .head .klabel{font-family:var(--mono);font-size:.95rem;font-weight:500;color:var(--txt);letter-spacing:-.01em}
@media(max-width:520px){.card .head .kmark svg{width:52px;height:52px}.card .head .klabel{font-size:.86rem}}

/* ---------- the community ---------- */
.sp-head{display:flex;align-items:flex-start;gap:14px;margin:0 0 6px}
.sp-head .g{font-size:1.7rem;line-height:1;flex:none}
.sp-new{margin:18px 0 22px;background:linear-gradient(180deg,var(--accent-2),var(--accent));
  color:#1a0d00;font-weight:800;border:0;border-radius:11px;padding:0 20px;min-height:44px;
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:.95rem;font-family:inherit}
.sp-new:hover{filter:brightness(1.06)}

.sp-search{display:flex;align-items:center;gap:10px;background:var(--bg-3);border:1px solid var(--line-2);
  border-radius:11px;padding:0 14px;margin:0 0 18px;min-height:46px}
.sp-search input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:inherit;
  font-size:.94rem;outline:none;padding:12px 0}
.sp-search .x{background:none;border:0;color:var(--txt-3);cursor:pointer;font-size:1.1rem;
  padding:8px;border-radius:7px;line-height:1}
.sp-search .x:hover{color:var(--accent-2)}
.sp-found{font-family:var(--mono);font-size:.8rem;color:var(--txt-3);margin:0 0 14px}

.th-list{display:grid;gap:10px}
.th{display:flex;gap:14px;align-items:flex-start;background:var(--bg-2);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s ease}
.th:hover{border-color:var(--line-2)}
.th.pinned{border-color:rgba(255,122,26,.34)}
.av{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  font-weight:800;font-size:.95rem;color:#140c03;
  background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.th-main{flex:1;min-width:0}
.th-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.th-t b{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.th-ex{margin:5px 0 0;color:var(--txt-2);font-size:.89rem;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.th-m{margin:9px 0 0;font-family:var(--mono);font-size:.74rem;color:var(--txt-3);
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;border-radius:999px;padding:3px 8px;border:1px solid var(--line-2);color:var(--txt-3)}
.tag.ok{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.tag.pin{color:var(--accent-2);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.1)}
.tag.staff{color:var(--accent-2);border-color:rgba(255,122,26,.4);background:rgba(255,122,26,.12)}
.tag.les{color:#93c5fd;border-color:rgba(147,197,253,.35);background:rgba(147,197,253,.1);
  text-transform:none;letter-spacing:.02em;font-size:.64rem}

/* one thread */
.tv-back{display:inline-flex;align-items:center;gap:8px;color:var(--txt-2);font-family:var(--mono);
  font-size:.85rem;padding:10px 10px 10px 0;margin-bottom:6px;background:none;border:0;cursor:pointer}
.tv-back:hover{color:var(--accent-2)}
.tv-head{display:flex;gap:14px;align-items:flex-start;margin:0 0 4px}
.tv h1{margin:0;font-size:clamp(1.3rem,3vw,1.75rem);font-weight:800;letter-spacing:-.025em;line-height:1.25}
.tv-m{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin:8px 0 0;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tv-body{margin:18px 0 0;color:var(--txt);font-size:.98rem;line-height:1.7;overflow-wrap:anywhere}
.tv-body p{margin:0 0 12px}
.tv-body ul,.tv-body ol{margin:10px 0;padding-left:22px}
.tv-body a{color:var(--accent-2)}
.tv-body code{background:var(--bg-4);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-family:var(--mono);font-size:.87em}
.tv-body pre{background:var(--bg-4);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  overflow-x:auto;font-family:var(--mono);font-size:.84rem}
.tv-acts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.tv-acts button{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;
  min-height:40px;padding:0 15px;font-family:var(--mono);font-size:.76rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
.tv-acts button:hover{border-color:var(--accent);color:var(--accent-2)}
.tv-acts button.on{background:rgba(255,122,26,.14);border-color:rgba(255,122,26,.4);color:#ffd9b3}
.tv-acts button.danger:hover{border-color:#f87171;color:#fca5a5}

.rp{display:flex;gap:13px;align-items:flex-start;padding:17px 0;border-top:1px solid var(--line)}
.rp.answer{background:rgba(52,211,153,.05);border-radius:12px;padding:17px 14px;margin-top:10px;
  border:1px solid rgba(52,211,153,.3)}
.rp-main{flex:1;min-width:0}
.rp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp-h b{font-size:.92rem}
.rp-h .t{font-family:var(--mono);font-size:.72rem;color:var(--txt-3)}
.rp-b{margin:7px 0 0;font-size:.93rem;line-height:1.65;overflow-wrap:anywhere}
.rp-b p{margin:0 0 10px}
.rp-b a{color:var(--accent-2)}
.rp-a{display:flex;gap:4px;margin:8px 0 0 -10px}
.rp-a button{background:none;border:0;color:var(--txt-3);font-family:var(--mono);font-size:.74rem;
  padding:10px;cursor:pointer;border-radius:7px;min-height:38px}
.rp-a button:hover{color:var(--accent-2)}
.rp-a button.on{color:var(--accent-2)}
.rp.gone .rp-b{color:var(--txt-3);font-style:italic}

.cw{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.cw h3{margin:0 0 12px;font-size:.95rem;font-weight:700}
.cw-send{margin-top:11px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;
  font-weight:800;border:0;border-radius:10px;min-height:44px;padding:0 22px;cursor:pointer;
  font-size:.92rem;font-family:inherit}
.cw-send:disabled{opacity:.5;cursor:default}

/* the new-thread sheet */
.nt{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);backdrop-filter:blur(5px);
  display:none;overflow:auto;padding:24px 18px}
.nt.show{display:block}
.nt-in{max-width:620px;margin:28px auto;background:var(--bg-2);border:1px solid var(--line);
  border-radius:18px;padding:24px}
.nt-in h2{margin:0 0 4px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.nt-in .sub{margin:0 0 18px;color:var(--txt-2);font-size:.9rem;line-height:1.55}
.nt-in label{display:block;font-weight:700;font-size:.88rem;margin:0 0 7px}
.nt-in input[type=text],.nt-in select{width:100%;background:var(--bg-3);border:1px solid var(--line-2);
  color:var(--txt);border-radius:10px;padding:13px 14px;font-family:inherit;font-size:.94rem;margin-bottom:16px}
.nt-in input:focus,.nt-in select:focus{outline:none;border-color:var(--accent)}
.nt-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.nt-acts button{min-height:46px;padding:0 22px;border-radius:11px;font-weight:800;cursor:pointer;
  font-family:inherit;font-size:.94rem;border:0}
.nt-go{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00}
.nt-no{background:none;border:1px solid var(--line-2);color:var(--txt-2);font-weight:600}
.nt-err{color:#fca5a5;font-size:.86rem;margin:12px 0 0}
@media(max-width:620px){
  .nt{padding:0}
  .nt-in{margin:0;border-radius:0;min-height:100vh;padding:20px 16px 40px}
  .nt-acts button{flex:1 1 100%}
}

/* ---------- pagination ---------- */
.pager{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.pager .showing{font-family:var(--mono);font-size:.82rem;color:var(--txt-3)}
.pager .ctrls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pg{background:var(--bg-3);border:1px solid var(--line);color:var(--txt-2);border-radius:9px;
  min-width:36px;height:36px;padding:0 11px;font-size:.86rem;font-family:var(--mono);cursor:pointer}
.pg:hover:not(:disabled){border-color:var(--line-2);color:var(--txt)}
.pg:disabled{opacity:.35;cursor:default}
.pg.now{background:rgba(255,122,26,.14);border-color:rgba(255,122,26,.4);color:#ffd9b3;font-weight:700}
.pager .of{font-family:var(--mono);font-size:.82rem;color:var(--txt-2);padding:0 6px}
.pager .goto{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.8rem;color:var(--txt-3)}
.pager .goto input{width:62px;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:8px 10px;font-family:var(--mono);font-size:.82rem}
.pager .goto input:focus{outline:none;border-color:var(--accent)}
.card .fav{position:absolute;top:9px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:.95rem;z-index:2}
.card .fav:hover{background:rgba(0,0,0,.65)}
.card .fav.on{color:#ff5f7a;border-color:rgba(255,95,122,.5)}
.card .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cat{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-2);font-weight:700}
.card h3{margin:0;font-size:.98rem;font-weight:700;letter-spacing:-.01em;line-height:1.28}
.card p{margin:0;color:var(--txt-2);font-family:var(--mono);font-size:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between}
.card .dl{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;font-size:.82rem;padding:9px 16px;border-radius:999px}
.card .meta{font-family:var(--mono);font-size:.72rem;color:var(--txt-3)}

.empty{color:var(--txt-2);font-family:var(--mono);font-size:.9rem;padding:50px 0;text-align:center}

/* tiles on dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:14px;margin-bottom:8px}
.tile{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .tic{font-size:1.5rem}
.tile h3{margin:8px 0 3px;font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.tile .tc{font-family:var(--mono);font-size:.78rem;color:var(--txt-3)}
/* The upgrade banner, for members without a subscription. Sits above the
   content so it survives a view change, and is built once. */
/* It lives outside .content, so it has to repeat the content gutter and the
   content width or it runs edge to edge under a page that is inset. */
#join-banner{padding:clamp(22px,3vw,40px) clamp(22px,3vw,40px) 0;max-width:1320px;width:100%}
#join-banner[hidden]{display:none}
.jb{position:relative;overflow:hidden;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  margin:0;padding:22px 26px;border-radius:18px;text-decoration:none;color:inherit;
  background:
    radial-gradient(900px 200px at 12% -40%,rgba(255,176,32,.20),transparent 70%),
    linear-gradient(118deg,rgba(255,122,26,.16),rgba(255,176,32,.05) 48%,rgba(255,122,26,.12));
  border:1px solid rgba(255,122,26,.38)}
.jb:hover{border-color:var(--accent)}
.jb::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%);
  transform:translateX(-120%);animation:jbshine 5.5s ease-in-out infinite}
@keyframes jbshine{0%,72%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.jb::after{animation:none;opacity:0}}

/* The art: a grid of tiles with most of them shut and one still lit, which is
   what the member area actually looks like to them right now. */
.jb-art{flex:none;position:relative;width:86px;height:86px;border-radius:16px;
  background:linear-gradient(140deg,#1d1409,#120d14);border:1px solid rgba(255,122,26,.3);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:5px;padding:10px}
.jb-art i{border-radius:4px;background:rgba(255,255,255,.07)}
.jb-art i.on{background:linear-gradient(140deg,var(--accent-2),var(--accent));
  box-shadow:0 0 14px rgba(255,160,30,.55)}
.jb-lock{position:absolute;right:-7px;bottom:-7px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-size:.85rem;
  background:#141418;border:1px solid rgba(255,122,26,.5)}

.jb-text{flex:1;min-width:230px}
.jb-kicker{font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-2);margin:0}
.jb-text h3{margin:7px 0 0;font-size:clamp(1.05rem,2.1vw,1.32rem);font-weight:800;letter-spacing:-.02em}
.jb-text p{margin:7px 0 0;color:var(--txt-2);font-size:.9rem;line-height:1.5}
.jb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.jb-chips span{font-family:var(--mono);font-size:.7rem;color:var(--txt-2);
  background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:999px;padding:4px 9px}
.jb-new{display:inline-flex;align-items:center;gap:7px;margin:11px 0 0;
  font-size:.82rem;color:var(--accent-2);line-height:1.4}
.jb-new b{font-family:var(--mono);font-size:.64rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:#140c03;background:var(--accent-2);border-radius:999px;padding:3px 7px}
.jb-cta{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.jb-btn{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#140c03;
  font-weight:800;font-size:.95rem;border-radius:11px;padding:14px 22px;letter-spacing:-.01em}
.jb:hover .jb-btn{filter:brightness(1.07)}
.jb-fine{color:var(--txt-3);font-size:.74rem;font-family:var(--mono)}
@media(max-width:760px){
  .jb{padding:18px;gap:16px}
  .jb-art{width:58px;height:58px;padding:7px;gap:4px;border-radius:13px}
  .jb-cta{width:100%}
  .jb-btn{width:100%;justify-content:center;padding:15px 20px}
}

.banner{background:linear-gradient(120deg,rgba(255,122,26,.16),rgba(255,176,32,.08));border:1px solid rgba(255,122,26,.3);border-radius:16px;padding:22px 24px;margin-bottom:26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.banner .bic{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,var(--accent-2),var(--accent));display:grid;place-items:center;font-size:1.4rem;flex:none}
.banner h3{margin:0 0 3px;font-size:1.08rem;font-weight:800;letter-spacing:-.01em}
.banner p{margin:0;color:var(--txt-2);font-family:var(--mono);font-size:.84rem}

/* ---------- courses ---------- */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.course-card{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .15s ease,transform .15s ease;display:flex;flex-direction:column}
.course-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.course-card .cc-top{aspect-ratio:16/7;background:linear-gradient(135deg,#2a1a08,#191016);display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line)}
.course-card .cc-top .g{font-size:2.6rem}
.course-card .cc-prog{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.course-card .cc-body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.course-card h3{margin:0;font-size:1.06rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.course-card .cc-meta{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin-top:auto}
.course-card .cc-bar{height:6px;border-radius:999px;background:var(--bg-4);overflow:hidden;margin-top:4px}
.course-card .cc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent))}

/* course detail */
.cd-back{display:inline-flex;align-items:center;gap:8px;color:var(--txt-2);font-size:.86rem;font-family:var(--mono);margin-bottom:16px;cursor:pointer;background:none;border:0}
.cd-back:hover{color:var(--txt)}
/* ---------- about this course ---------- */
.cd-about{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;
          padding:20px 22px;margin:18px 0 26px}
.ab-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.cd-about h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:0}
.ab-toggle{background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-2);
           font:inherit;font-size:.82rem;font-weight:600;border-radius:8px;
           /* 38px tall so it is still a tap target on a phone */
           padding:9px 15px;cursor:pointer;flex:none}
.ab-toggle:hover{background:var(--bg-4);color:var(--txt)}
.ab-sum{color:var(--txt-2);font-size:.95rem;line-height:1.6;margin:13px 0 0;max-width:72ch}
.ab-body{margin:4px 0 0}
.ab-body[hidden]{display:none}
.ab-body h3{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-2);
            font-weight:800;margin:26px 0 0}
.ab-body p{color:var(--txt-2);font-size:.93rem;line-height:1.65;margin:11px 0 0;max-width:72ch}
.ab-note{color:var(--txt-3) !important;font-size:.86rem !important}
.ab-list{list-style:none;margin:13px 0 0;padding:0;display:grid;gap:9px}
.ab-list li{display:flex;gap:10px;color:var(--txt-2);font-size:.92rem;line-height:1.5}
.ab-list li::before{content:'\2713';color:var(--green);font-weight:800;flex:none}
.ab-stages{display:grid;gap:9px;margin:14px 0 0}
.ab-stage{background:var(--bg-3);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.ab-stage b{display:block;font-size:.9rem;font-weight:700;letter-spacing:-.01em}
.ab-stage span{display:block;color:var(--txt-2);font-size:.87rem;line-height:1.5;margin-top:5px}
.ab-tutor{display:flex;gap:15px;margin:14px 0 0;align-items:flex-start}
.ab-face{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
         font-weight:800;font-size:1.2rem;color:#140c03;
         background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.ab-tutor b{font-size:.95rem;font-weight:700}
.ab-tutor p{margin-top:8px}
@media(max-width:600px){
  .cd-about{padding:17px 16px}
  .ab-head{flex-direction:column;align-items:flex-start;gap:12px}
  .ab-toggle{width:100%}
}
/* Membership content a cancelled member can no longer open. The card stays
   where it was rather than vanishing, so the library does not look emptied. */
.course-card.locked{opacity:.66;text-decoration:none;display:flex;flex-direction:column;position:relative}
.course-card.locked:hover{opacity:.95;border-color:var(--accent)}
.course-card.locked .cc-top{filter:saturate(.3) brightness(.7)}
.cc-unlock{display:block;color:var(--accent-2);font-size:.82rem;font-weight:700;margin-top:10px}
/* a nav entry for something the membership buys */
.nav.is-locked::after{content:'\1F512';margin-left:auto;font-size:.8rem;opacity:.75}
.req-card.locked-perk{position:relative}
/* a locked download: dimmed, and the button offers the way in rather than a
   refusal */
.card.locked .head,.card.locked .body h3,.card.locked .body p{opacity:.72}
.dl.locked{background:var(--bg-3);color:var(--accent-2);border:1px solid var(--line-2)}
.dl.locked:hover{border-color:var(--accent)}
.card.locked{position:relative;text-decoration:none;display:block;color:inherit}
.card.locked .head{filter:saturate(.35) brightness(.6)}
.card.locked .body h3,.card.locked .body p,.card.locked .body .cat{opacity:.7}
.card.locked:hover{border-color:var(--accent)}
.card.locked:hover .head{filter:saturate(.7) brightness(.8)}
.lock-badge{position:absolute;top:10px;right:10px;z-index:2;font-size:.9rem;
  background:rgba(10,10,11,.82);border:1px solid var(--line-2);border-radius:999px;
  width:28px;height:28px;display:grid;place-items:center}
.c-lock{color:var(--accent-2);font-size:.8rem;font-weight:700;margin:6px 0 0}
.cd-prog{display:flex;align-items:center;gap:14px;margin:6px 0 26px}
.cd-prog .bar{flex:1;max-width:420px;height:8px;border-radius:999px;background:var(--bg-4);overflow:hidden}
.cd-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.cd-prog .lbl{font-family:var(--mono);font-size:.8rem;color:var(--txt-2)}
.section{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--bg-2)}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
.section-h:hover{background:var(--bg-3)}
.section-h .st{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.section-h .sm{font-family:var(--mono);font-size:.76rem;color:var(--txt-3);flex:none}
.section-h .chev{transition:transform .18s ease;color:var(--txt-3)}
.section.collapsed .chev{transform:rotate(-90deg)}
.section.collapsed .lessons{display:none}
.lessons{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--bg-3)}
.lrow .lc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;color:#1a0d00;font-size:.7rem}
.lrow.done .lc{background:var(--green);border-color:var(--green)}
.lrow .lt{flex:1;font-size:.94rem;color:var(--txt)}
.lrow.done .lt{color:var(--txt-2)}
.lrow .ld{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);flex:none}

/* ---------- lesson player ---------- */
.player{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;grid-template-columns:1fr 360px}
.player.show{display:grid}
.player-main{overflow-y:auto;min-width:0}
.player-topbar{position:sticky;top:0;background:rgba(10,10,11,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px clamp(16px,3vw,34px);z-index:2}
.player-topbar .pt-back{background:none;border:0;color:var(--txt);font-size:.95rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.player-topbar .pt-menu{display:none;margin-left:auto;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 12px;font-size:.8rem;cursor:pointer}
.player-body{max-width:860px;margin:0 auto;padding:clamp(18px,3vw,32px)}
.pl-eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);display:flex;align-items:center;justify-content:space-between;gap:12px}
.pl-nav{display:flex;gap:8px}
.pl-nav button{background:var(--bg-3);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1rem}
.pl-nav button:disabled{opacity:.35;cursor:default}
.player h1.pl-title{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 18px;line-height:1.2}
/* No overflow:hidden here — the quality menu drops out of the bottom of the
   frame on a short player and would be clipped. The children round their own
   corners instead. */
.video-wrap{position:relative;aspect-ratio:16/9;border-radius:14px;background:#000;border:1px solid var(--line);margin-bottom:8px}
.video-ph{position:absolute;inset:0;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(120% 120% at 50% 35%,#21120,#0b0b0d)}
.video-ph .pbtn{width:66px;height:66px;border-radius:50%;background:linear-gradient(180deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#1a0d00;font-size:1.5rem;box-shadow:0 10px 30px rgba(255,122,26,.3)}
.video-ph .pmsg{font-family:var(--mono);font-size:.82rem;color:var(--txt-2)}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:inherit}
/* letterbox rather than stretch — not every lesson was recorded at 16:9 */
.video-wrap video{object-fit:contain;background:#000}

/* ---------- quality picker ---------- */
/* Sits top-right, clear of the browser's own controls along the bottom. */
.q-menu{position:absolute;top:10px;right:10px;z-index:3;font-family:var(--mono)}
.q-btn{background:rgba(10,10,12,.72);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:8px;padding:7px 11px;font-size:.74rem;font-family:var(--mono);cursor:pointer;
  backdrop-filter:blur(6px);opacity:.55;transition:opacity .15s}
.video-wrap:hover .q-btn,.lesson-clip:hover .q-btn,.q-btn:focus-visible,.q-btn[aria-expanded="true"]{opacity:1}
.q-list{position:absolute;top:calc(100% + 6px);right:0;min-width:116px;background:rgba(14,14,17,.96);
  border:1px solid var(--line-2);border-radius:10px;padding:5px;display:flex;flex-direction:column;
  gap:2px;box-shadow:0 12px 30px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.q-list[hidden]{display:none}
.q-list button{background:none;border:0;color:var(--txt-2);text-align:left;padding:8px 11px;
  border-radius:7px;font-size:.76rem;font-family:var(--mono);cursor:pointer;white-space:nowrap}
.q-list button:hover{background:rgba(255,255,255,.07);color:#fff}
.q-list button.on{color:#ffd9b3;background:rgba(255,122,26,.14)}
/* a phone has no hover, so the button stays legible and the targets grow */
@media(hover:none){
  .q-btn{opacity:.85;padding:9px 13px;font-size:.78rem}
  .q-list button{padding:11px 14px;font-size:.82rem}
}
/* A phone turned sideways is only ~375px tall, and a 16:9 box across the full
   width comes out taller than that — the controls end up below the fold, which
   is exactly when someone has turned the phone to watch. Drive the size off
   the height instead so the whole player fits, and let the width follow. */
@media(orientation:landscape) and (max-height:600px){
  .player-body{padding-top:8px}
  /* The top bar, the lesson counter row and the title sit above the video and
     measured 142px together, most of it the 38px prev/next buttons. Shrink
     those, then take what is left of the screen — the whole player, controls
     included, has to be on screen without scrolling. */
  .video-wrap{height:min(calc(100vh - 146px),calc((100vw - 32px) * 0.5625));
              width:auto;max-width:100%;margin-inline:auto}
  .player h1.pl-title{font-size:1.05rem;margin:2px 0 8px}
  .pl-eyebrow{font-size:.7rem}
  .pl-nav button{width:30px;height:30px;font-size:.85rem}
  .pl-dur{margin-bottom:12px}
}
.pl-dur{font-family:var(--mono);font-size:.78rem;color:var(--txt-3);margin:0 0 22px}
/* The strip has always scrolled. Nothing said so: the last tab was cut flush
   at the edge and the scrollbar is invisible on a phone, so "Ask the Co" read
   as a bug rather than as something you can swipe. The fade is switched on
   from script, only on the side there is actually more to see. */
.pl-tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--line);overflow-x:auto;
         scrollbar-width:none;scroll-behavior:smooth;
         -webkit-mask-image:var(--tabfade,none);mask-image:var(--tabfade,none)}
.pl-tabs::-webkit-scrollbar{display:none}
.pl-tabs.more-r{--tabfade:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
.pl-tabs.more-l{--tabfade:linear-gradient(90deg,transparent,#000 34px)}
.pl-tabs.more-l.more-r{--tabfade:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent)}
.pl-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--txt-3);
                font:inherit;font-size:.88rem;font-weight:600;
                /* 44px tall: still a tap target on a phone */
                padding:12px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.pl-tabs button:hover{color:var(--txt-2)}
.pl-tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
.pl-panel{margin:20px 0 0}
.pl-panel[hidden]{display:none}
.pl-panel h3{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-2);
             font-weight:800;margin:24px 0 0}
.pl-panel h3:first-child{margin-top:0}
.pl-panel p{color:var(--txt-2);font-size:.94rem;line-height:1.65;margin:11px 0 0;max-width:72ch}
.pl-panel ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}
.pl-panel ul li{display:flex;gap:10px;color:var(--txt-2);font-size:.92rem;line-height:1.5}
.pl-panel ul li::before{content:'\2713';color:var(--green);font-weight:800;flex:none}
.pl-empty{color:var(--txt-3);font-size:.92rem;margin:0}
.pj-form{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0 0}
.pj-form input,.pj-form textarea{width:100%;background:var(--bg-3);border:1px solid var(--line-2);
  border-radius:9px;color:var(--txt);font:inherit;font-size:.92rem;padding:11px 12px;margin:0 0 9px}
.pj-form textarea{min-height:110px;resize:vertical}
.pj-form button{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#140c03;
  border:0;border-radius:9px;font:inherit;font-weight:800;font-size:.9rem;padding:12px 20px;cursor:pointer}
.pj-form button:disabled{opacity:.55;cursor:default}
.pj-item{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:10px 0 0}
.pj-item .when{color:var(--txt-3);font-size:.76rem;font-family:var(--mono)}
.pj-item .body{color:var(--txt-2);font-size:.9rem;line-height:1.6;margin:7px 0 0;white-space:pre-wrap}
.pj-item a{color:var(--accent-2);font-size:.86rem;word-break:break-all}
.pj-fb{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.28);border-radius:9px;
       padding:11px 13px;margin:11px 0 0}
.pj-fb b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.pj-fb p{color:var(--txt);font-size:.89rem;line-height:1.6;margin:6px 0 0;white-space:pre-wrap}
.pl-content{color:var(--txt);line-height:1.7;font-size:.99rem}
.pl-content img{max-width:100%;border-radius:10px;margin:14px 0}
.pl-content h1,.pl-content h2,.pl-content h3{color:#fff;margin:22px 0 8px}
.pl-content pre,.pl-content code{background:#0e0e10;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:.85rem}
.pl-content pre{padding:14px;overflow:auto}
.pl-content a{color:var(--accent-2)}
/* a recording sitting inside the lesson body, one per marker */
.pl-content .lesson-clip{position:relative;aspect-ratio:16/9;margin:18px 0;border-radius:12px;
  background:#000;border:1px solid var(--line)}
.pl-content .lesson-clip video{position:absolute;inset:0;width:100%;height:100%;border:0;
  object-fit:contain;background:#000;border-radius:inherit}
.pl-content .lesson-clip .clip-msg{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:.82rem;color:var(--txt-2)}
.pl-content .lesson-video-embed{display:flex;align-items:center;justify-content:center;gap:10px;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);background:radial-gradient(120% 120% at 50% 35%,#221206,#0b0b0d);color:var(--txt-2);font-family:var(--mono);font-size:.85rem;margin:16px 0}
.pl-complete{display:flex;justify-content:center;padding:26px 0 60px}
.pl-complete button{background:#101013;border:1px solid var(--line-2);color:var(--txt);font-weight:800;font-size:1rem;padding:14px 30px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.pl-complete button:hover{border-color:var(--accent)}
.pl-complete button.is-done{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;border-color:transparent}
/* player sidebar (lessons menu) */
.player-side{border-left:1px solid var(--line);background:var(--bg-2);overflow-y:auto}
.ps-head{position:sticky;top:0;background:var(--bg-2);border-bottom:1px solid var(--line);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:700}
.ps-head .x{background:none;border:0;color:var(--txt-2);font-size:1.3rem;cursor:pointer;display:none}
.ps-sec{padding:14px 18px 6px;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3)}
.ps-row{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;font-size:.88rem;color:var(--txt-2);border-left:2px solid transparent}
.ps-row:hover{background:var(--bg-3);color:var(--txt)}
.ps-row.active{background:rgba(255,122,26,.12);border-left-color:var(--accent);color:#ffd9b3}
.ps-row .rc{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:.6rem;color:#1a0d00}
.ps-row.done .rc{background:var(--green);border-color:var(--green)}
.ps-row .rt{flex:1;line-height:1.35}
.ps-row .rd{font-family:var(--mono);font-size:.72rem;color:var(--txt-3);flex:none}
/* ---------- player toolbar: comments / wide / bookmark ---------- */
.pt-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.player-topbar .pt-menu{margin-left:6px}
.pt-ic{position:relative;background:none;border:1px solid transparent;color:var(--txt-2);width:36px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.pt-ic:hover{background:var(--bg-3);color:var(--txt)}
.pt-ic.on{color:var(--accent-2);background:rgba(255,122,26,.13);border-color:rgba(255,122,26,.28)}
.pt-ic svg{width:19px;height:19px;display:block;pointer-events:none}
.pt-ic .tip{position:absolute;top:calc(100% + 9px);right:0;background:#000;border:1px solid var(--line-2);color:#fff;font-family:var(--mono);font-size:.7rem;white-space:nowrap;padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:5}
.pt-ic:hover .tip{opacity:1}
.pt-ic .n{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#1a0d00;font-family:var(--mono);font-size:.6rem;font-weight:700;display:none;align-items:center;justify-content:center}
.pt-ic .n.show{display:flex}

/* ---------- comments panel ---------- */
.pl-comments{display:none;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-left:1px solid var(--line);background:var(--bg-2)}
/* the same panel, inside the Ask the Community tab: it is the page now, so
   it loses the side rail's border, its own scrolling and its close button */
#pl-comments.inline{position:static;display:flex;width:auto;height:auto;max-height:none;
  inset:auto;z-index:auto;border-left:0;background:none;overflow:visible}
#pl-comments.inline .plc-head{display:none}
#pl-comments.inline .plc-list{overflow:visible;max-height:none;padding-left:0;padding-right:0}
#pl-comments.inline .plc-form{position:static;padding-left:0;padding-right:0;
  border-top:1px solid var(--line);background:none}
.player.comments-open .pl-comments{display:flex}
.player.comments-open{grid-template-columns:1fr minmax(320px,400px) 300px}
.player.wide{grid-template-columns:1fr}
.player.wide .player-side{display:none}
.player.wide.comments-open{grid-template-columns:1fr minmax(320px,420px)}
.plc-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.plc-head h3{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.plc-head .x{background:none;border:0;color:var(--txt-2);font-size:1.4rem;line-height:1;cursor:pointer}
.plc-head .x:hover{color:var(--txt)}
.plc-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.cmt{display:flex;gap:10px}
.cmt .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#141008}
.cmt .cb{flex:1;min-width:0}
.cmt .ch{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmt .cn{font-weight:700;font-size:.86rem}
.cmt .badge{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 6px;border-radius:999px;background:rgba(255,122,26,.16);color:var(--accent-2);border:1px solid rgba(255,122,26,.3)}
.cmt .ct{font-family:var(--mono);font-size:.68rem;color:var(--txt-3)}
.cmt .cl{font-family:var(--mono);font-size:.67rem;color:var(--txt-3);margin:2px 0 3px}
.cmt .ctext{font-size:.88rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .ctext a{color:var(--accent-2);overflow-wrap:anywhere}
.cmt .ctext p{margin:0 0 6px}
.cmt .ctext p:last-child{margin-bottom:0}
.cmt .ctext blockquote{margin:6px 0;padding-left:11px;border-left:2px solid var(--line-2);color:var(--txt-3)}
.cmt .ctext pre{background:var(--bg-4);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;margin:7px 0}
.cmt .ctext code{background:var(--bg-4);border:1px solid var(--line);border-radius:5px;
                 padding:1px 5px;font-family:var(--mono);font-size:.84em}
.cmt .ctext ul,.cmt .ctext ol{margin:7px 0 0;padding-left:20px;white-space:normal}
.cmt .ctext li{margin:3px 0}
/* the composer toolbar */
.cmt.removed .ctext{color:var(--txt-3);font-style:italic}
.cmt .ca{display:flex;gap:14px;margin-top:6px}
.cmt .ca button{background:none;border:0;padding:0;color:var(--txt-3);font-family:var(--mono);font-size:.72rem;cursor:pointer}
.cmt .ca button:hover{color:var(--accent-2)}
.cmt-replies{margin:12px 0 0 12px;padding-left:16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.plc-empty{color:var(--txt-3);font-family:var(--mono);font-size:.82rem;line-height:1.65;text-align:center;padding:40px 12px}
.plc-form{flex:none;border-top:1px solid var(--line);padding:12px 14px 14px}
.plc-form .nm,.plc-form textarea{width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);border-radius:10px;font-family:inherit;font-size:.87rem;padding:10px 12px}
.plc-form .nm{margin-bottom:8px}
.plc-form textarea{min-height:74px;resize:vertical;display:block}
.plc-form .nm:focus,.plc-form textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.14)}
.plc-form .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.plc-form .hint{font-family:var(--mono);font-size:.68rem;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plc-form .hint button{background:none;border:0;padding:0;color:var(--accent-2);font-family:var(--mono);font-size:.68rem;cursor:pointer}
.plc-form .send{flex:none;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;border:0;border-radius:999px;padding:9px 18px;font-size:.84rem;cursor:pointer}
.plc-form .send:disabled{opacity:.45;cursor:default}

.panel-b > p > a:only-child,.panel-b > a{display:inline-block;background:var(--bg-4);border:1px solid var(--line-2);
  color:var(--txt);font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:10px;text-decoration:none;margin:4px 0}
.panel-b > p > a:only-child:hover,.panel-b > a:hover{border-color:var(--accent);color:var(--accent-2)}
.tpl-btn{display:inline-block;background:var(--bg-4);border:1px solid var(--line-2);color:var(--txt);font-weight:700;font-size:.88rem;padding:11px 20px;border-radius:10px;text-decoration:none}
.tpl-btn:hover{border-color:var(--accent);color:var(--accent-2)}

/* ---------- long-form guide, rendered as part of the page ---------- */
/* The source documents share one markup vocabulary across all 58 guides, so
   these rules theme them into the member area rather than framing a foreign
   page. Everything is scoped under .guide so nothing leaks into the app. */
.guide{margin:22px 0 4px;color:var(--txt);line-height:1.72;font-size:.97rem}
.guide > :first-child{margin-top:0}
.guide h1,.guide h2,.guide h3,.guide h4{color:#fff;letter-spacing:-.02em;line-height:1.25;margin:30px 0 10px}
.guide h1{font-size:1.6rem}.guide h2{font-size:1.32rem}.guide h3{font-size:1.08rem}.guide h4{font-size:.98rem}
.guide p{margin:0 0 14px}
.guide a{color:var(--accent-2);text-decoration:underline;text-underline-offset:2px}
.guide strong{color:#fff;font-weight:700}
.guide em{color:var(--txt-2)}
.guide ul,.guide ol{margin:0 0 16px;padding-left:22px}
.guide li{margin:0 0 7px}
.guide img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:16px 0;display:block}
.guide code{background:#0e0e10;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:var(--mono);font-size:.84em;color:var(--accent-2)}
.guide pre{background:#0e0e10;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
.guide pre code{border:0;padding:0;background:none;color:var(--txt)}
.guide .divider{border:0;border-top:1px solid var(--line);margin:28px 0;height:0}
.guide .section-label{display:inline-block;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent-2);font-weight:700;margin:26px 0 2px}

/* callouts */
.guide .callout{display:flex;gap:12px;background:var(--bg-3);border:1px solid var(--line-2);border-left:3px solid var(--txt-3);border-radius:10px;padding:14px 16px;margin:18px 0}
.guide .callout > *:last-child{margin-bottom:0}
.guide .callout p:last-child{margin-bottom:0}
.guide .callout-icon{flex:none;font-size:1.05rem;line-height:1.5}
.guide .callout-accent{border-left-color:var(--accent);background:rgba(255,122,26,.09)}
.guide .callout-green{border-left-color:var(--green);background:rgba(52,211,153,.09)}
.guide .callout-yellow{border-left-color:var(--accent-2);background:rgba(255,176,32,.09)}

/* cards and grids */
.guide .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:18px 0}
.guide .feature-card,.guide .card,.guide .tool,.guide .feature{background:var(--bg-3);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.guide .feature-card > *:last-child,.guide .card > *:last-child{margin-bottom:0}
.guide .feature-title,.guide .tool-head{font-weight:700;color:#fff;margin-bottom:5px}
.guide .feature-desc,.guide .tool-meta{color:var(--txt-2);font-size:.9rem}
.guide .price{font-family:var(--mono);color:var(--accent-2);font-weight:700}

/* numbered steps */
.guide .instruction-block{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
.guide .ib-label{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);font-weight:700;margin-bottom:8px}
.guide .steps-list{list-style:none;padding:0;margin:16px 0}
.guide .step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.guide .step:last-child{border-bottom:0}
.guide .step-num{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;font-size:.8rem;display:grid;place-items:center}
.guide .step-body{flex:1;min-width:0}
.guide .step-act{font-weight:700;color:#fff}

/* tables */
.guide .table-wrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:10px}
.guide table{border-collapse:collapse;width:100%;font-size:.9rem}
.guide th,.guide td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line)}
.guide th{background:var(--bg-3);color:#fff;font-weight:700;font-size:.82rem}
.guide tr:last-child td{border-bottom:0}

/* the image strips some guides use */
.guide .gallery-item{position:relative;margin:14px 0}
.guide .gallery-label{font-family:var(--mono);font-size:.74rem;color:var(--txt-2);margin-top:6px}
.guide .gallery-index{font-family:var(--mono);font-size:.7rem;color:var(--txt-3)}
.guide .tutorial-img{margin:16px 0}

/* ---------- bookmarks view ---------- */
.bm-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.bm-row:last-child{border-bottom:0}
.bm-row:hover{background:var(--bg-3)}
.bm-row .bi{color:var(--accent-2);flex:none}
.bm-row .bt{flex:1;font-size:.94rem}
.bm-row .bx{background:none;border:0;color:var(--txt-3);font-size:.76rem;font-family:var(--mono);cursor:pointer;flex:none}
.bm-row .bx:hover{color:#fca5a5}

@media(max-width:820px){
  .player{grid-template-columns:1fr}
  .player-side{position:fixed;right:0;top:0;height:100%;width:min(88vw,360px);transform:translateX(100%);transition:transform .22s ease;z-index:3}
  .player.menu-open .player-side{transform:none}
  .player-topbar .pt-menu{display:inline-block}
  .player-side .ps-head .x{display:block}
  .player.comments-open,.player.wide.comments-open{grid-template-columns:1fr}
  .pl-comments{position:fixed;right:0;top:0;height:100%;width:min(94vw,420px);z-index:4}
}

/* ---------- reader overlay ---------- */
.reader{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(5px);z-index:50;display:none;padding:20px;overflow:auto}
.reader.show{display:block}
.reader-inner{max-width:840px;margin:22px auto;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,36px)}
.reader-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
.reader-kind{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-2);font-weight:700}
.reader h2{margin:6px 0 4px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.reader .close{background:none;border:1px solid var(--line-2);color:var(--txt-2);width:36px;height:36px;border-radius:999px;cursor:pointer;flex:none;font-size:1.2rem}
.reader .desc{color:var(--txt-2);font-family:var(--mono);font-size:.86rem;margin:0 0 20px;line-height:1.55}
/* There was a .reader-body block here styling images, headings and code.
   Nothing in the markup has ever carried that class — the reader renders
   into #r-content — so none of it applied, and a screenshot wider than the
   panel was drawn at its natural width and clipped. That is why the "New
   routine" button was missing from the setup guide: it was off the right
   edge of a 1560px image in an 840px column. Images are constrained here,
   where they actually live. */
.panel-b img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:14px 0;display:block}
.copy{margin-top:22px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;border:0;border-radius:999px;padding:11px 22px;cursor:pointer}

/* ---------- the AI roadmap ---------- */
.rm-hero{background:linear-gradient(135deg,rgba(255,122,26,.14),rgba(255,176,32,.05));
  border:1px solid rgba(255,122,26,.32);border-radius:18px;padding:clamp(22px,4vw,34px);margin-bottom:22px}
.rm-hero h2{margin:0 0 10px;font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:800;letter-spacing:-.025em}
.rm-hero p{margin:0 0 12px;color:var(--txt-2);font-size:.96rem;line-height:1.65;max-width:62ch}
.rm-hero .val{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.74rem;
  color:var(--accent-2);background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);
  border-radius:999px;padding:5px 12px;margin-bottom:14px}
.rm-go{margin-top:8px;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;
  font-weight:800;border:0;border-radius:12px;min-height:50px;padding:0 26px;cursor:pointer;
  font-size:1rem;font-family:inherit}
.rm-go:hover{filter:brightness(1.06)}

/* the form */
.rm-form{background:var(--bg-2);border:1px solid var(--line);border-radius:17px;
  padding:clamp(20px,3vw,28px);max-width:760px}
.rm-prog{display:flex;gap:6px;margin:0 0 20px}
.rm-prog i{flex:1;height:4px;border-radius:999px;background:var(--bg-4)}
.rm-prog i.on{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.rm-step-h{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--accent-2);margin:0 0 6px}
.rm-form h3{margin:0 0 5px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.rm-form .blurb{margin:0 0 22px;color:var(--txt-2);font-size:.9rem;line-height:1.55}
.rm-f{margin-bottom:20px}
.rm-f label{display:block;font-weight:700;font-size:.92rem;margin-bottom:8px;line-height:1.4}
.rm-f label .req{color:var(--accent-2);margin-left:3px}
.rm-f input[type=text],.rm-f textarea{width:100%;background:var(--bg-3);border:1px solid var(--line-2);
  color:var(--txt);border-radius:11px;padding:13px 14px;font-family:inherit;font-size:.94rem;line-height:1.55}
.rm-f textarea{min-height:96px;resize:vertical}
.rm-f input:focus,.rm-f textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,122,26,.14)}
.rm-opts{display:grid;gap:8px}
.rm-opt{display:flex;align-items:center;gap:11px;background:var(--bg-3);border:1px solid var(--line-2);
  border-radius:11px;padding:13px 15px;cursor:pointer;font-size:.93rem}
.rm-opt:hover{border-color:var(--line-2)}
.rm-opt.on{background:rgba(255,122,26,.12);border-color:rgba(255,122,26,.45);color:#ffd9b3}
.rm-opt input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.rm-nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.rm-nav button{min-height:48px;padding:0 24px;border-radius:12px;font-weight:800;cursor:pointer;
  font-family:inherit;font-size:.95rem;border:0}
.rm-next{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;flex:1}
.rm-back{background:none;border:1px solid var(--line-2);color:var(--txt-2);font-weight:600}
.rm-err{color:#fca5a5;font-size:.88rem;margin:14px 0 0;line-height:1.5}

/* waiting */
.rm-wait{background:var(--bg-2);border:1px solid var(--line);border-radius:17px;padding:30px;max-width:640px;
  text-align:center}
.rm-wait .g{font-size:2.2rem;display:block;margin-bottom:12px}
.rm-wait h3{margin:0 0 8px;font-size:1.12rem;font-weight:800}
.rm-wait p{margin:0;color:var(--txt-2);font-size:.93rem;line-height:1.6}

/* ---------- questions about the roadmap ---------- */
.rm-notes{max-width:860px;margin:44px 0 0;padding-top:28px;border-top:1px solid var(--line)}
.rm-notes h2{margin:0 0 6px;font-size:1.12rem;font-weight:800;letter-spacing:-.02em}
.rm-notes .sub{margin:0 0 20px;color:var(--txt-2);font-size:.92rem;line-height:1.6;max-width:62ch}
.rm-thread{display:grid;gap:12px;margin:0 0 20px}
.rm-note{background:var(--bg-2);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
/* The team's answers lean on the accent, so a thread can be read at a glance
   as question, answer, question. */
.rm-note.team{background:rgba(255,122,26,.07);border-color:rgba(255,122,26,.3)}
.rm-note .h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.rm-note .h b{font-size:.9rem;font-weight:700}
.rm-note.team .h b{color:var(--accent-2)}
.rm-note .h span{font-family:var(--mono);font-size:.7rem;color:var(--txt-3)}
/* Written in the same editor as everything else here, so it renders the same:
   bold, lists, links, code and emoji. */
.rt-body{color:var(--txt-2);font-size:.94rem;line-height:1.7;overflow-wrap:anywhere}
.rt-body p{margin:0 0 10px}
.rt-body p:last-child{margin-bottom:0}
.rt-body ul,.rt-body ol{margin:8px 0;padding-left:22px}
.rt-body a{color:var(--accent-2)}
.rt-body code{background:var(--bg-4);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-family:var(--mono);font-size:.86em}
.rt-body pre{background:var(--bg-4);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  overflow-x:auto;font-family:var(--mono);font-size:.84em}
.rt-body b,.rt-body strong{color:var(--txt)}

.rm-ask{margin:0}
.rm-ask-go{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 0}
.rm-send{flex:none;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;
  border:0;border-radius:12px;min-height:46px;padding:0 24px;font-family:inherit;font-weight:800;
  font-size:.92rem;cursor:pointer}
.rm-send:disabled{opacity:.6;cursor:default}
.rm-note-msg{font-size:.84rem;color:var(--txt-3)}
@media (max-width:640px){.rm-send{width:100%}}
@media print{.rm-notes{display:none!important}}

/* The roadmap document itself is styled in assets/roadmap-doc.css, which the
   admin preview loads as well so the two cannot drift apart. What stays here
   is the page around it: on paper the member area's furniture is noise. */
@media print{
  .sidebar,.topbar,.scrim,#join-banner{display:none!important}
  .shell,.main,.content{display:block!important;padding:0!important;max-width:none!important}
  body{background:#fff!important;color:#000!important}
}

/* ---------- request content ---------- */
.req-card{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:760px}
.req-card h2{margin:0 0 4px;font-size:1.12rem;font-weight:800;letter-spacing:-.02em}
.req-card .sub{margin:0 0 20px;color:var(--txt-2);font-family:var(--mono);font-size:.84rem}
.req-f{margin-bottom:16px}
.req-f label{display:block;font-weight:700;font-size:.9rem;margin-bottom:7px}
.req-f input,.req-f textarea{width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 14px;font-family:inherit;font-size:.92rem}
.req-f textarea{min-height:140px;resize:vertical}
.req-f input:focus,.req-f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.15)}
.req-f .hint{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-family:var(--mono);font-size:.74rem;color:var(--txt-3)}
.req-send{width:100%;background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;
  border:0;border-radius:11px;padding:14px;font-size:.96rem;cursor:pointer}
.req-send:disabled{opacity:.45;cursor:default}
.req-ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#a7f3d0;border-radius:11px;padding:13px 16px;margin-bottom:16px;font-size:.9rem}
.req-mine{margin-top:34px;max-width:760px}
.req-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.req-row:last-child{border-bottom:0}
.req-row .rt{flex:1;min-width:0}
.req-row .rt b{display:block;font-size:.95rem;margin-bottom:3px}
.req-row .rt p{margin:0;color:var(--txt-2);font-family:var(--mono);font-size:.78rem;line-height:1.5}
/* Named for where it is used. As a bare `.st` it also landed on the course
   section title, which is a different `.st` entirely, and `flex:none` there
   stopped the heading shrinking on a narrow screen. */
.rq-st{flex:none;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--txt-2);background:var(--bg-3)}
.rq-st.new{color:var(--accent-2);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.12)}
.rq-st.planned{color:#93c5fd;border-color:rgba(147,197,253,.4);background:rgba(147,197,253,.12)}
.rq-st.done{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12)}
.rq-st.declined{color:var(--txt-3)}

/* ---------- article hero (tutorials and guides) ---------- */
.r-hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:30px 28px;margin:18px 0 6px;
  background:radial-gradient(circle at 1px 1px,rgba(160,196,255,.22) 1px,transparent 0) 0 0/24px 24px,
             linear-gradient(160deg,#14141a,#0c0c0f)}
.r-hero p{position:relative;margin:0;color:var(--txt-2);font-size:1rem;line-height:1.6;max-width:62ch}
.r-hero .r-hero-meta{position:relative;display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.r-hero .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);
  border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.76rem;color:var(--txt-2)}
.r-hero .pill.lvl{color:var(--green);border-color:rgba(52,211,153,.35)}

/* ---------- library toolbar: search, sort, filter ---------- */
.lib-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px}
.lib-search{position:relative;flex:1;min-width:220px;max-width:360px}
.lib-search input{width:100%;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 14px 11px 38px;font-size:.9rem;font-family:var(--mono)}
.lib-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.15)}
.lib-search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--txt-3);font-size:.9rem;pointer-events:none}
.lib-btn{display:inline-flex;align-items:center;gap:9px;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 15px;font-size:.88rem;font-family:var(--mono);cursor:pointer}
.lib-btn:hover{border-color:var(--line-2)}
.lib-btn.on{border-color:var(--accent);color:var(--accent-2)}
.lib-btn .n{background:var(--accent);color:#1a0d00;font-weight:700;border-radius:999px;padding:1px 7px;font-size:.72rem}
.lib-sort{position:relative}
.lib-sort select{appearance:none;background:var(--bg-3);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 34px 11px 15px;font-size:.88rem;font-family:var(--mono);cursor:pointer}
.lib-sort select:focus{outline:none;border-color:var(--accent)}
.lib-sort .ar{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--txt-3);pointer-events:none;font-size:.7rem}
.lib-count{font-family:var(--mono);font-size:.8rem;color:var(--txt-3);margin-left:auto}

/* filter dialog */
.fil{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.fil.show{display:flex}
.fil-box{background:var(--bg-2);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:min(80vh,680px);display:flex;flex-direction:column;overflow:hidden}
.fil-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.fil-head h2{margin:0 0 4px;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.fil-head p{margin:0;color:var(--txt-2);font-family:var(--mono);font-size:.8rem;line-height:1.5}
.fil-head .x{background:none;border:0;color:var(--txt-2);font-size:1.4rem;cursor:pointer;line-height:1}
.fil-body{overflow-y:auto;padding:16px 22px}
.fil-sec{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);font-weight:700;margin:6px 0 10px}
.fil-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.fil-opt{display:inline-flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.83rem;cursor:pointer;user-select:none}
.fil-opt:hover{border-color:var(--line-2)}
.fil-opt.on{background:rgba(255,122,26,.14);border-color:rgba(255,122,26,.4);color:#ffd9b3}
.fil-opt .c{font-family:var(--mono);font-size:.72rem;color:var(--txt-3)}
.fil-opt.on .c{color:var(--accent-2)}
.fil-foot{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.fil-clear{background:none;border:1px solid var(--line-2);color:var(--txt-2);border-radius:999px;padding:10px 18px;font-size:.85rem;cursor:pointer}
.fil-clear:hover{color:var(--txt)}
.fil-apply{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#1a0d00;font-weight:800;border:0;border-radius:999px;padding:11px 22px;font-size:.88rem;cursor:pointer}

/* ---------- reader: chips, panels, gallery, related ---------- */
.r-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;background:var(--bg-4);color:var(--txt-2);border:1px solid var(--line-2)}
.chip.k{background:rgba(255,122,26,.15);border-color:rgba(255,122,26,.34);color:var(--accent-2)}
.r-meta{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--mono);font-size:.74rem;color:var(--txt-3);margin:12px 0 0}
.r-meta b{color:var(--txt-2);font-weight:600}

.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:20px 0;background:#0e0e10}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-3);border-bottom:1px solid var(--line)}
.panel-h .dots{display:flex;gap:6px;flex:none}
.panel-h .dots i{width:9px;height:9px;border-radius:50%;display:block}
.panel-h .pt{font-family:var(--mono);font-size:.8rem;color:var(--txt-2);font-weight:700}
.panel-h .pc{margin-left:auto;background:var(--bg-4);border:1px solid var(--line-2);color:var(--txt);font-family:var(--mono);font-size:.72rem;padding:6px 12px;border-radius:999px;cursor:pointer;flex:none}
.panel-h .pc:hover{border-color:var(--accent);color:var(--accent-2)}
/* cross-references inside a body: jump to another item, or to a panel further
   down this one. Both are <a> without an href, so they need the cursor. */
.xref{cursor:pointer;color:var(--accent-2);border-bottom:1px solid var(--line-2)}
.xref:hover{color:var(--accent);border-bottom-color:var(--accent)}
.panel-b > p > .xref:only-child{border-bottom:0}
@keyframes panelflash{from{border-color:var(--accent)}to{border-color:var(--line-2)}}
.panel.flash{animation:panelflash 1.4s ease-out}
.panel-b{padding:16px 18px;color:var(--txt);line-height:1.66;font-size:.93rem}
.panel-b p:first-child{margin-top:0}.panel-b p:last-child{margin-bottom:0}
.panel-b.mono{font-family:var(--mono);font-size:.85rem;white-space:pre-wrap;line-height:1.6}
/* The panel sets pre-wrap, but a <pre> inside it resets to white-space:pre
   from the browser's own stylesheet, so one long line makes the whole
   prompt scroll sideways — unreadable on a phone.
   In the prompt panel the frame and the mono font come from .panel-b.mono,
   so the <pre> itself should add nothing. In an ordinary prose panel the
   opposite is true: a code block has to look like one, or the guide's
   worked examples read as just another paragraph. */
.panel-b.mono pre{white-space:pre-wrap;overflow-wrap:break-word;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit}
.panel-b:not(.mono) pre{white-space:pre-wrap;overflow-wrap:break-word;background:#0e0e10;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0;font-family:var(--mono);font-size:.82rem;line-height:1.55;color:var(--txt)}
.panel-b:not(.mono) pre code{background:none;border:0;padding:0;font:inherit;color:inherit}
.panel-b:not(.mono) code{background:#0e0e10;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:.82em;color:var(--accent-2)}
.panel.note{background:var(--bg-2)}
.panel.note .panel-b{color:var(--txt-2);font-size:.88rem}

.r-dl{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;font-weight:800;border:0;border-radius:999px;padding:12px 24px;font-size:.92rem;cursor:pointer;text-decoration:none;margin:4px 0 2px}
.r-dl:hover{filter:brightness(1.08)}
.r-dl-sub{font-family:var(--mono);font-size:.72rem;color:var(--txt-3);margin:8px 0 0}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin:18px 0 6px}
.gal figure{position:relative;margin:0;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--bg-3);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .ov{position:absolute;inset:0;background:rgba(8,8,10,.92);opacity:0;transition:opacity .14s ease;display:flex;flex-direction:column;padding:11px;gap:8px}
.gal figure:hover .ov,.gal figure.open .ov{opacity:1}
.gal .ov p{margin:0;flex:1;overflow:auto;font-size:.71rem;line-height:1.45;color:var(--txt-2)}
.gal .ov button{flex:none;background:var(--bg-4);border:1px solid var(--line-2);color:var(--txt);font-family:var(--mono);font-size:.7rem;padding:7px 10px;border-radius:8px;cursor:pointer}
.gal .ov button:hover{border-color:var(--accent);color:var(--accent-2)}
.gal figure.noimg{display:grid;place-items:center}
.gal figure.noimg .ov{opacity:1;background:var(--bg-3)}

.r-rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.r-rel .rc{background:var(--bg-3);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer}
.r-rel .rc:hover{border-color:var(--accent)}
.r-rel .rc .rt{font-weight:700;font-size:.9rem;line-height:1.3;margin-bottom:4px}
.r-rel .rc .rd{font-family:var(--mono);font-size:.72rem;color:var(--txt-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-sec{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin:26px 0 2px}
.r-sec-s{font-family:var(--mono);font-size:.76rem;color:var(--txt-3);margin:0}
.r-video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;margin:18px 0}
.r-video iframe,.r-video video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- phones ---------- */
@media(max-width:620px){
  /* A two-column gallery fits comfortably at 375px; one column made a 41-tile
     collection an enormous amount of scrolling. */
  .gal{grid-template-columns:repeat(2,1fr);gap:8px}
  .gal .ov p{font-size:.68rem}
  .gal .ov button{padding:6px 8px;font-size:.66rem}

  /* the heart sits on top of a card image, so it needs a real tap target */
  .card .fav{width:38px;height:38px;font-size:1.05rem}

  /* the reader is the whole screen here, so it should use all of it */
  .reader{padding:0}
  .reader-inner{margin:0;border-radius:0;min-height:100vh;padding:20px 16px 40px}

  /* the toolbar stacks: full-width search, then sort and filter side by side */
  .lib-search{max-width:none;flex:1 1 100%}
  /* sort and filter share one row; the select would otherwise take the whole
     width to itself and push the filter button onto a third line */
  .lib-sort{flex:1 1 0;min-width:0}
  .lib-sort select{width:100%;min-width:0;padding-right:28px}
  .lib-btn{flex:0 0 auto}
  .lib-count{margin-left:0;width:100%}

  /* keep the pager on two tidy rows rather than five */
  .pager{gap:10px}
  .pager .showing{width:100%;text-align:center}
  .pager .ctrls{width:100%;justify-content:center}
  .pager .goto{width:100%;justify-content:center;margin-top:4px}

  /* an empty count still claimed a whole row, which is why the toolbar was
     157px tall at 320px with nothing in it */
  .lib-count:empty{display:none}

  /* prev/next and the numbered pages are enough on a phone; the jump-to box
     was adding a third row to the pager */
  .pager .goto{display:none}

  /* the request form and admin cards want the full width */
  .req-card{padding:18px 16px}

  /* A head that carries a thumbnail is worth 16:9. A head that carries one
     icon, the same icon for every item in the library, is not: at 16:9 it was
     185px of a 302px card and under three cards reached the screen. The
     thumbnail heads are untouched. */
  .card .head.hmark,.card .head.hglyph{aspect-ratio:auto;min-height:0;padding:15px 0}
  .card .head.hglyph .glyph{font-size:1.9rem}
  .card .head.hmark .kmark{padding:0 15px}
  .course-card .cc-top{aspect-ratio:auto;padding:14px 0}
  .course-card .cc-top .g{font-size:1.9rem}

  /* Two across, as the galleries already are. One tile per row turned a short
     list of libraries into most of a screen of scrolling. */
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{padding:14px 14px 13px}
  .tile h3{font-size:.92rem}

  /* Title and chevron on one line, the lesson count under them. All three on
     one row did not fit, and the chevron - the only sign the section opens and
     shuts - was the part that fell off the edge. */
  .section-h{flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px}
  .section-h>div:first-child{flex:1 1 auto;min-width:0}
  .section-h .st{font-size:.95rem}
  .section-h>div:last-child{order:2;flex:1 1 100%;justify-content:space-between;
    margin-top:-2px}

  /* These sit under a comment and were 15px tall, which is not something you
     can hit with a thumb. The negative margin keeps them visually where they
     were while the tap target grows around them. */
  .cmt .ca{gap:6px;margin:2px 0 0 -11px}
  .cmt .ca button{padding:9px 11px;font-size:.76rem}

  /* 34px is under every platform's minimum. */
  .card .dl,.tile,.pg{min-height:40px}
  .card .dl{display:inline-flex;align-items:center;padding:0 16px}
  .banner .dl{display:inline-flex;align-items:center;min-height:44px;padding:0 20px}
  .bm-row .bx{padding:11px 9px;margin:-11px -9px}
  /* The way out of a screen that fills the phone, at 20px tall. */
  .cd-back{padding:10px 10px 10px 0;margin:-10px 0 8px -0px}
  .player-topbar .pt-back{padding:9px 8px 9px 0;margin-left:0}
}

@media(max-width:820px){
  /* The course title took three lines in the player's top bar, pushing the
