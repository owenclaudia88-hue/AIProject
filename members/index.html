    c.innerHTML = html;
    [].forEach.call(c.querySelectorAll('.bm-row'), function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('.bx')) return;
        openLessonById(row.getAttribute('data-slug'), row.getAttribute('data-lesson'));
      });
    });
    [].forEach.call(c.querySelectorAll('.bx'), function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); removeBookmark(b.getAttribute('data-remove')); });
    });
  }

  function postBookmark(lessonId, slug, title) {
    return fetch('/api/bookmarks/toggle', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lessonId: lessonId, course: slug, title: title })
    }).then(function (r) { return r.ok ? r.json() : null; });
  }

  function removeBookmark(lessonId) {
    var bm = bookmarks.filter(function (x) { return x.lessonId === lessonId; })[0];
    if (!bm) return;
    postBookmark(lessonId, bm.course, bm.title).then(function (d) {
      if (!d) return;
      delete bookmarkIds[lessonId];
      bookmarks = bookmarks.filter(function (x) { return x.lessonId !== lessonId; });
      updateBookmarkCount();
      if (view === 'bookmarks') render();
    });
  }

  /* ---------------- request content ---------------- */
  function statusPill(st) {
    return '<span class="rq-st ' + esc(st) + '">' + esc(st) + '</span>';
  }

  function renderRequest(c) {
    // Part of the membership. Said here rather than letting them write a
    // request and meet a refusal when they press send.
    if (!me.hasMembership) {
      c.innerHTML = '<h1 class="page-h">Request Content</h1>' +
        '<p class="page-sub">Tell us what prompts, tutorials or resources you would like to see.</p>' +
        '<div class="req-card locked-perk">' +
          '<span class="lock-badge">\ud83d\udd12</span>' +
          '<h2>A membership perk</h2>' +
          '<p class="sub">Members can ask for the prompts, tutorials and resources they want next, ' +
            'and we prioritise by how many people ask for the same thing.</p>' +
          '<a class="dl" href="join.html" style="display:inline-flex;margin-top:14px">' +
            '\ud83d\udd12 Unlock with the membership</a>' +
        '</div>';
      return;
    }

    c.innerHTML = '<h1 class="page-h">Request Content</h1>' +
      '<p class="page-sub">Tell us what prompts, tutorials or resources you would like to see.</p>' +
      '<div class="req-card">' +
        '<h2>Submit a content request</h2>' +
        '<p class="sub">We read every request and prioritise by how many people ask.</p>' +
        '<div id="req-ok"></div>' +
        '<div class="req-f"><label for="req-title">Title</label>' +
          '<input id="req-title" type="text" maxlength="100" placeholder="e.g. LinkedIn post generator for B2B SaaS">' +
          '<div class="hint"><span>Brief title for your request</span><span id="req-tc">0/100</span></div></div>' +
        '<div class="req-f"><label for="req-body">Description</label>' +
          '<textarea id="req-body" maxlength="1000" placeholder="Describe what you are looking for. What problem are you trying to solve? What kind of content would help?"></textarea>' +
          '<div class="hint"><span></span><span id="req-bc">0/1000</span></div></div>' +
        '<button class="req-send" id="req-send" disabled>Submit request</button>' +
      '</div>' +
      '<div class="req-mine" id="req-mine"></div>';

    var t = document.getElementById('req-title'), b = document.getElementById('req-body'),
        send = document.getElementById('req-send');
    function tick() {
      document.getElementById('req-tc').textContent = t.value.length + '/100';
      document.getElementById('req-bc').textContent = b.value.length + '/1000';
      send.disabled = !t.value.trim();
    }
    t.addEventListener('input', tick); b.addEventListener('input', tick); tick();

    send.addEventListener('click', function () {
      send.disabled = true; send.textContent = 'Sending…';
      fetch('/api/requests/create', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: t.value.trim(), body: b.value.trim() })
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          send.textContent = 'Submit request';
          if (!d) { alert('Could not send that request. Please try again.'); tick(); return; }
          document.getElementById('req-ok').innerHTML =
            '<div class="req-ok">Thanks — your request is in. You can track it below.</div>';
          t.value = ''; b.value = ''; tick();
          loadMine();
        })
        .catch(function () { send.textContent = 'Submit request'; tick(); });
    });

    function loadMine() {
      fetch('/api/requests/list', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : { requests: [] }; })
        .then(function (d) {
          var rows = d.requests || [];
          var el = document.getElementById('req-mine');
          if (!rows.length) { el.innerHTML = ''; return; }
          el.innerHTML = '<div class="sec-h"><h2>Your requests</h2><span class="c">' + rows.length + '</span></div>' +
            rows.map(function (r) {
              return '<div class="req-row"><span class="rt"><b>' + esc(r.title) + '</b>' +
                (r.body ? '<p>' + esc(r.body) + '</p>' : '') + '</span>' + statusPill(r.status) + '</div>';
            }).join('');
        });
    }
    loadMine();
  }

  /* ---------------- courses ---------------- */
  function sectionHeading(name, idx) {
    return /^section\s*\d+/i.test(name || '') ? name : ('SECTION ' + (idx + 1) + ' · ' + (name || ('Section ' + (idx + 1))));
  }
  function fmtTime(min) {
    if (!min) return '';
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + ' hr ' : '') + (m ? m + ' min' : (h ? '' : '0 min'));
  }
  function doneForSlug(slug) {
    var pre = 'lesson:c-' + slug + '-sections';
    var n = 0;
    for (var k in progress) { if (progress[k] && k.indexOf(pre) === 0) n++; }
    return n;
  }

  function renderCourses(c) {
    var html = '<h1 class="page-h">Courses</h1>' +
      '<p class="page-sub">Work through every course — video lessons, step by step.</p>';
    var shut = courses.filter(function (x) { return x.locked; }).length;
    if (shut) {
      html = html.replace('step by step.</p>',
        'step by step. <b>' + shut + '</b> of them open with the membership.</p>');
    }
    if (!courses.length) { c.innerHTML = html + '<p class="empty">Your courses are being set up — check back shortly.</p>'; return; }
    html += '<div class="course-grid">';
    courses.forEach(function (co) {
      var st = co.stats || {};
      var total = co.lessonCount || st.lessons || 0;
      var done = doneForSlug(co.slug);
      var pct = total ? Math.round(done / total * 100) : 0;
      var meta = (co.sectionCount || st.sections || 0) + ' sections · ' + total + ' lessons' + (st.minutes ? ' · ' + fmtTime(st.minutes) : '');

      // A course they cannot open. No progress bar: there is no progress to
      // have made, and an empty one reads as a course they started and dropped.
      if (co.locked) {
        html += '<a class="course-card locked" href="join.html" title="Unlock with the membership">' +
          '<span class="lock-badge">\ud83d\udd12</span>' +
          '<div class="cc-top"><span class="g">\ud83c\udf93</span></div>' +
          '<div class="cc-body"><h3>' + esc(co.title) + '</h3>' +
          '<div class="cc-meta">' + esc(meta) + '</div>' +
          '<span class="cc-unlock">Unlock with the membership \u2192</span>' +
          '</div></a>';
        return;
      }

      html += '<div class="course-card" data-slug="' + esc(co.slug) + '">' +
        '<div class="cc-top"><span class="g">🎓</span><span class="cc-prog" style="width:' + pct + '%"></span></div>' +
        '<div class="cc-body"><h3>' + esc(co.title) + '</h3>' +
        '<div class="cc-meta">' + esc(meta) + '</div>' +
        '<div class="cc-bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="cc-meta" style="margin-top:0">' + done + ' of ' + total + ' completed</div>' +
        '</div></div>';
    });
    html += '</div>';
    c.innerHTML = html;
    [].forEach.call(c.querySelectorAll('.course-card[data-slug]'), function (card) {
      card.addEventListener('click', function () { location.hash = 'course-' + card.getAttribute('data-slug'); });
    });
  }

  function loadCourse(slug) {
    if (courseCache[slug]) return Promise.resolve(courseCache[slug]);
    return fetch('/api/courses/get?slug=' + encodeURIComponent(slug), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (tree) { if (tree) courseCache[slug] = tree; return tree; });
  }

  function openLessonById(slug, lessonId) {
    loadCourse(slug).then(function (tree) {
      if (!tree) return;
      var flat = flatLessons(tree), idx = 0;
      for (var i = 0; i < flat.length; i++) { if (flat[i].libId === lessonId) { idx = i; break; } }
      openLesson(slug, idx);
    });
  }

  function flatLessons(tree) {
    var flat = [];
    (tree.sections || []).forEach(function (s, si) {
      (s.lessons || []).forEach(function (l) {
        // hasVideo has to come along: the player reads it off the flattened
        // lesson, and leaving it behind here showed every lesson as
        // "coming soon" however well the signing worked.
        flat.push({ libId: l.libId, title: l.title, duration: l.duration, hasVideo: !!l.hasVideo,
                    aspect: l.aspect || null, clips: l.clips || [],
                    sectionName: s.name, sectionIdx: si });
      });
    });
    return flat;
  }


  /* ---------------- about this course ---------------- */

  /* Every block is optional. A course whose overview only has an intro renders
     an intro and nothing else, rather than a run of empty headings. */
  function aboutHTML(a) {
    if (!a) return '';
    var h = '';

    var paras = function (title, arr) {
      if (!arr || !arr.length) return '';
      return (title ? '<h3>' + esc(title) + '</h3>' : '') +
        arr.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    };
    var bullets = function (title, block, cls) {
      if (!block || !block.items || !block.items.length) return '';
      return '<h3>' + esc(title) + '</h3>' +
        (block.lead ? '<p>' + esc(block.lead) + '</p>' : '') +
        '<ul class="ab-list' + (cls ? ' ' + cls : '') + '">' +
        block.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') +
        '</ul>' + (block.note ? '<p class="ab-note">' + esc(block.note) + '</p>' : '');
    };

    h += paras('', a.intro);
    h += bullets('Who this course is for', a.forWho);

    if (a.learn && a.learn.items && a.learn.items.length) {
      h += '<h3>What you will learn</h3>' +
        (a.learn.lead ? '<p>' + esc(a.learn.lead) + '</p>' : '') +
        '<div class="ab-stages">' + a.learn.items.map(function (it) {
          // Stage names carry an ampersand entity from the source copy, so they
          // are placed as markup rather than escaped into a visible "&amp;".
          return '<div class="ab-stage"><b>' + it[0] + '</b><span>' + esc(it[1]) + '</span></div>';
        }).join('') + '</div>';
    }

    h += paras('Why take this course', a.why);
    h += bullets('Your project', a.project);
    h += bullets('What you need', a.needs);

    if (a.instructor && a.instructor.name) {
      h += '<h3>About your instructor</h3><div class="ab-tutor">' +
        '<div class="ab-face">' + esc(a.instructor.name.slice(0, 1).toUpperCase()) + '</div>' +
        '<div><b>' + esc(a.instructor.name) + '</b>' +
        (a.instructor.bio || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</div></div>';
    }
    return h;
  }

  function renderCourseDetail(c, slug) {
    c.innerHTML = '<p class="empty">Loading course…</p>';
    loadCourse(slug).then(function (tree) {
      if (!tree) { c.innerHTML = '<p class="empty">Could not load this course.</p>'; return; }
      var flat = flatLessons(tree);
      var total = flat.length;
      var done = flat.filter(function (l) { return isDone(l.libId); }).length;
      var pct = total ? Math.round(done / total * 100) : 0;
      var st = tree.stats || {};

      var html = '<button class="cd-back" id="cd-back">&larr; All courses</button>' +
        '<h1 class="page-h">' + esc(tree.title) + '</h1>' +
        '<p class="page-sub">' + (st.sections || (tree.sections || []).length) + ' sections · ' + total + ' lessons' +
        (st.minutes ? ' · ' + fmtTime(st.minutes) : '') + '</p>' +
        '<div class="cd-prog"><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="lbl">Completed ' + done + ' of ' + total + ' lessons · ' + pct + '%</span></div>';

      var gi = 0;
      (tree.sections || []).forEach(function (s, si) {
        var secLessons = s.lessons || [];
        var secMin = secLessons.reduce(function (n, l) { var m = /^(\d{1,2}):(\d{2})$/.exec(l.duration || ''); return n + (m ? (+m[1]) * 60 + (+m[2]) : 0); }, 0);
        html += '<div class="section" data-si="' + si + '">' +
          '<div class="section-h"><div><div class="st">' + esc(sectionHeading(s.name, si)) + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:14px">' +
          '<span class="sm">' + secLessons.length + ' lesson' + (secLessons.length === 1 ? '' : 's') + (secMin ? ' • ' + Math.round(secMin / 60) + ' min' : '') + '</span>' +
          '<span class="chev">▾</span></div></div>' +
          '<div class="lessons">';
        secLessons.forEach(function (l) {
          var idx = gi++;
          html += '<div class="lrow ' + (isDone(l.libId) ? 'done' : '') + '" data-idx="' + idx + '">' +
            '<span class="lc">' + (isDone(l.libId) ? '✓' : '') + '</span>' +
            '<span class="lt">' + esc(l.title) + '</span>' +
            '<span class="ld">' + esc(l.duration || '') + '</span></div>';
        });
        html += '</div></div>';
      });
      c.innerHTML = html;

      document.getElementById('cd-back').addEventListener('click', function () { location.hash = 'courses'; });

      // The course overview lives in the lesson's About tab now, so there is
      // no collapsed panel on this page to wire up.
      [].forEach.call(c.querySelectorAll('.section-h'), function (h) {
        h.addEventListener('click', function () { h.parentElement.classList.toggle('collapsed'); });
      });
      [].forEach.call(c.querySelectorAll('.lrow'), function (row) {
        row.addEventListener('click', function () { openLesson(slug, Number(row.getAttribute('data-idx'))); });
      });
    });
  }

  /* ---------------- lesson player ---------------- */
  var playerEl = document.getElementById('player');
  var curCourseSlug = null, curFlat = [], curIdx = 0;

  function wirePlayer() {
    document.getElementById('pl-back').addEventListener('click', closePlayer);
    document.getElementById('pl-prev').addEventListener('click', function () { if (curIdx > 0) gotoLesson(curIdx - 1); });
    document.getElementById('pl-next').addEventListener('click', function () { if (curIdx < curFlat.length - 1) gotoLesson(curIdx + 1); });
    document.getElementById('pl-complete').addEventListener('click', completeLesson);
    document.getElementById('pl-menu-btn').addEventListener('click', function () { playerEl.classList.toggle('menu-open'); });
    document.getElementById('pt-comments').addEventListener('click', toggleComments);
    document.getElementById('pt-wide').addEventListener('click', toggleWide);
    document.getElementById('pt-bookmark').addEventListener('click', toggleBookmarkCurrent);
    document.getElementById('plc-x').addEventListener('click', closeComments);
    document.getElementById('plc-send').addEventListener('click', submitComment);
    // Ctrl/Cmd+Enter is bound when the editor is built, not here — the box
     // does not exist until somebody opens the discussion.
    try { if (localStorage.getItem('afu_wide') === '1') setWide(true); } catch (e) {}
    document.getElementById('pl-side-x').addEventListener('click', function () { playerEl.classList.remove('menu-open'); });
    document.addEventListener('keydown', function (e) {
      if (!playerEl.classList.contains('show')) return;
      var t = e.target, tag = t && t.tagName;
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable);
      if (e.key === 'Escape') {
        if (typing) { t.blur(); return; }
        if (playerEl.classList.contains('comments-open')) closeComments();
        else closePlayer();
      }
      else if (typing) return;
      else if (e.key === 'ArrowLeft' && curIdx > 0) gotoLesson(curIdx - 1);
      else if (e.key === 'ArrowRight' && curIdx < curFlat.length - 1) gotoLesson(curIdx + 1);
    });
  }


  /* ---------------- lesson tabs ---------------- */

  // The course overview, the project brief and the discussion all belong beside
  // the lesson rather than in front of it. Which tab opens first follows the
  // lesson: its own notes when it has any, the course overview when it does not,
  // so a lesson with nothing written against it never opens on an empty panel.
  var PANES = { about: 'pl-pane-about', projects: 'pl-pane-projects', community: 'pl-pane-community' };
  var curTab = 'lesson';

  /* Fades the edge the strip can still scroll towards, and only that edge. */
  function markTabOverflow() {
    var bar = document.getElementById('pl-tabs');
    if (!bar || bar.hidden) return;
    var max = bar.scrollWidth - bar.clientWidth;
    bar.classList.toggle('more-l', bar.scrollLeft > 4);
    bar.classList.toggle('more-r', max > 4 && bar.scrollLeft < max - 4);
  }

  function showTab(name) {
    curTab = name;
    document.getElementById('pl-content').hidden = name !== 'lesson';
    Object.keys(PANES).forEach(function (k) {
      document.getElementById(PANES[k]).hidden = k !== name;
    });
    [].forEach.call(document.querySelectorAll('#pl-tabs button'), function (b) {
      var on = b.getAttribute('data-tab') === name;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', String(on));
    });
    // A tab you chose should not stay half off the edge afterwards.
    var on = document.querySelector('#pl-tabs button.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    markTabOverflow();
    if (name === 'projects') loadProjects();
    if (name === 'community') mountCommunity();
  }

  function buildTabs(tree, lesson) {
    var bar = document.getElementById('pl-tabs');
    var hasText = !!(lesson && lesson.bodyHtml && String(lesson.bodyHtml).trim());
    var hasAbout = !!(tree && tree.about);

    var tabs = [];
    if (hasText) tabs.push(['lesson', 'Lesson']);
    if (hasAbout) tabs.push(['about', 'About the Course']);
    tabs.push(['projects', 'Projects &amp; Resources']);
    tabs.push(['community', 'Ask the Community']);

    // One tab is not a tab bar, it is a heading nobody needs.
    if (tabs.length < 2) { bar.hidden = true; document.getElementById('pl-content').hidden = false; return; }

    bar.innerHTML = tabs.map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="false">' + t[1] + '</button>';
    }).join('');
    bar.hidden = false;
    [].forEach.call(bar.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); });
    });
    if (!bar.dataset.fadeBound) {
      bar.addEventListener('scroll', markTabOverflow, { passive: true });
      window.addEventListener('resize', markTabOverflow);
      bar.dataset.fadeBound = '1';
    }
    markTabOverflow();

    document.getElementById('pl-pane-about').innerHTML =
      hasAbout ? aboutHTML(tree.about) : '';

    showTab(hasText ? 'lesson' : (hasAbout ? 'about' : 'projects'));
  }

  /* ---------------- projects ---------------- */

  function projectItem(p) {
    return '<div class="pj-item">' +
      '<span class="when">' + esc(when(p.created_at)) + '</span>' +
      (p.title ? '<div style="font-weight:700;margin-top:5px">' + esc(p.title) + '</div>' : '') +
      (p.body ? '<div class="body">' + esc(p.body) + '</div>' : '') +
      (p.url ? '<div style="margin-top:8px"><a href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + esc(p.url) + '</a></div>' : '') +
      (p.feedback
        ? '<div class="pj-fb"><b>Feedback</b><p>' + esc(p.feedback) + '</p></div>'
        : '<div class="when" style="margin-top:9px">Waiting for feedback</div>') +
      '</div>';
  }

  function loadProjects() {
    var el = document.getElementById('pl-pane-projects');
    if (el.getAttribute('data-slug') === curCourseSlug) return;   // already loaded
    el.innerHTML = '<p class="pl-empty">Loading\u2026</p>';

    fetch('/api/projects?course=' + encodeURIComponent(curCourseSlug), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { el.innerHTML = '<p class="pl-empty">Could not load this.</p>'; return; }
        el.setAttribute('data-slug', curCourseSlug);

        var h = '';
        if (d.brief) {
          h += '<h3>The brief</h3>';
          if (d.brief.lead) h += '<p>' + esc(d.brief.lead) + '</p>';
          if (d.brief.items && d.brief.items.length) {
            h += '<ul>' + d.brief.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
          }
        } else {
          h += '<p class="pl-empty">No brief for this course yet \u2014 submit whatever you have built and we will take a look.</p>';
        }

        h += '<h3>Hand yours in</h3>' +
          '<div class="pj-form">' +
            '<input id="pj-title" type="text" maxlength="160" placeholder="What did you build? (optional)">' +
            '<input id="pj-url" type="url" maxlength="500" placeholder="Link to it \u2014 your page, doc or video (optional)">' +
            '<textarea id="pj-body" maxlength="8000" placeholder="Tell us about it: what you made, what worked, where you got stuck\u2026"></textarea>' +
            '<div style="display:flex;align-items:center;gap:12px">' +
              '<button id="pj-send" type="button">Submit project</button>' +
              '<span class="pl-empty" id="pj-msg"></span>' +
            '</div>' +
          '</div>';

        if (d.mine && d.mine.length) {
          h += '<h3>What you have handed in</h3>' + d.mine.map(projectItem).join('');
        }

        el.innerHTML = h;
        document.getElementById('pj-send').addEventListener('click', submitProject);
      })
      .catch(function () { el.innerHTML = '<p class="pl-empty">Could not load this.</p>'; });
  }

  function submitProject() {
    var btn = document.getElementById('pj-send');
    var msg = document.getElementById('pj-msg');
    var body = document.getElementById('pj-body').value.trim();
    var url = document.getElementById('pj-url').value.trim();
    if (!body && !url) { msg.textContent = 'Write something about it, or add a link.'; return; }

    btn.disabled = true;
    msg.textContent = 'Sending\u2026';
    fetch('/api/projects', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        course: curCourseSlug,
        lessonId: (curFlat[curIdx] || {}).lessonId || null,
        title: document.getElementById('pj-title').value.trim(),
        body: body, url: url
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok) { msg.textContent = res.d.error || 'That did not send.'; return; }
        msg.textContent = 'Sent \u2014 thank you.';
        // Force a reload so the new submission appears with the rest.
        document.getElementById('pl-pane-projects').removeAttribute('data-slug');
        loadProjects();
      })
      .catch(function () { btn.disabled = false; msg.textContent = 'That did not send.'; });
  }

  /* ---------------- community ---------------- */

  // The discussion already exists as a side panel. Rather than a second copy
  // that could drift from it, the tab moves the same element into place - one
  // list, one set of handlers, whichever way it is opened.
  // The message editor. Built once; `rt` is what everything else talks to.
  var rt = null;
  function composer() {
    if (rt) return rt;
    var host = document.getElementById('plc-rt');
    if (!host || !window.rtMount) return null;
    rt = window.rtMount(host, { placeholder: 'Type a message\u2026' });
    rt.el.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitComment();
    });
    return rt;
  }

  function mountCommunity() {
    var pane = document.getElementById('pl-pane-community');
    var panel = document.getElementById('pl-comments');
    if (panel && panel.parentNode !== pane) {
      panel.classList.add('inline');
      pane.appendChild(panel);
    }
    if (commentsLoaded !== curCourseSlug) loadComments(curCourseSlug, true);
    composer();
  }

  function openLesson(slug, idx) {
    loadCourse(slug).then(function (tree) {
      if (!tree) return;
      curCourseSlug = slug;
      curFlat = flatLessons(tree);
      document.getElementById('pl-course-title').textContent = tree.title;
      document.getElementById('plc-name').hidden = me.hasName;
      loadComments(slug, true);
      playerEl.classList.add('show');
      document.body.style.overflow = 'hidden';
      gotoLesson(idx);
    });
  }

  function closePlayer() {
    playerEl.classList.remove('show');
    playerEl.classList.remove('menu-open');
    document.body.style.overflow = '';
    // stop playback and release the stream — the player is only hidden, so a
    // video left mounted would keep downloading and talking over the page
    teardownVideo();
    // refresh the course detail so progress ticks update
    if (curCourseSlug && view === 'course-' + curCourseSlug) render();
  }

  /* ---------------- lesson video ---------------- */
  // Videos are served from Bunny Stream as HLS and played in our own <video>,
  // not an embedded player. The URL is signed per member and expires, so it is
  // fetched when the lesson opens rather than baked into the page.

  var HLS_SRC = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
  var hlsReady = null;
  function loadHls() {
    // Safari plays HLS natively, so most iPhones never download this at all.
    if (window.Hls) return Promise.resolve(true);
    if (hlsReady) return hlsReady;
    hlsReady = new Promise(function (done) {
      var s = document.createElement('script');
      s.src = HLS_SRC;
      s.onload = function () { done(!!window.Hls); };
      s.onerror = function () { done(false); };
      document.head.appendChild(s);
    });
    return hlsReady;
  }

  // Every live Hls instance — the lesson's own video and any inside its body.
  // All of them keep downloading until destroyed, so all of them get torn down.
  var hlsPool = [];
  var videoGen = 0;       // guards against a slow response for a lesson we left

  function teardownVideo() {
    videoGen++;
    hlsPool.forEach(function (h) { try { h.destroy(); } catch (e) {} });
    hlsPool = [];
    var box = document.getElementById('pl-video');
    if (box) {
      box.innerHTML = '';
      // back to the default shape, or the next lesson inherits this one's
      box.style.aspectRatio = '';
    }
  }

  function videoMessage(text) {
    return '<div class="video-ph"><div class="pbtn">▶</div>' +
      '<div class="pmsg">' + esc(text) + '</div></div>';
  }

  function mountVideo(lesson) {
    teardownVideo();
    var mine = videoGen;
    var box = document.getElementById('pl-video');
    // Some lessons are written pieces, or carry their videos inline in the
    // body instead. Showing them an empty frame implies something failed to
    // load, so take the frame away entirely rather than apologise in it.
    if (!lesson || !lesson.hasVideo) { box.style.display = 'none'; box.innerHTML = ''; return; }

    box.style.display = '';
    // Set the frame to the video's shape before anything loads. The shape came
    // down with the course tree precisely so the frame never has to be drawn
    // at 16:9 first and corrected a moment later.
    if (lesson.aspect) box.style.aspectRatio = String(lesson.aspect);
    box.innerHTML = videoMessage('Loading video…');
    fetch('/api/video/sign?lesson=' + encodeURIComponent(lesson.libId), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) {
        if (mine !== videoGen) return;                       // moved on already
        if (!v || !v.url) { box.innerHTML = videoMessage('Video lesson — coming soon'); return; }

        var el = document.createElement('video');
        el.controls = true; el.playsInline = true; el.preload = 'metadata';
        if (v.poster) el.poster = v.poster;
        box.innerHTML = ''; box.appendChild(el);

        // These lessons are screen recordings and almost none of them are 16:9
        // — they run from 1.55 to 1.82. Against a frame fixed at 16:9 the
        // picture is pinned to the top and bottom edges with slivers of black
        // down the sides. Take the shape from the video itself once it is
        // known, so the frame is the video's own shape and its rounded corners
        // belong to the picture rather than cropping it.
        el.addEventListener('loadedmetadata', function () {
          if (mine !== videoGen || !el.videoWidth || !el.videoHeight) return;
          box.style.aspectRatio = el.videoWidth + ' / ' + el.videoHeight;
        });

        // Chrome answers "maybe" to canPlayType for HLS but cannot actually
        // play it — it rejects the source and the video sits at 0:00 with no
        // duration, looking for all the world like a broken stream. So the
        // question to ask is whether Media Source Extensions exist: where they
        // do, hls.js does the work; where they don't (iPhone Safari) the
        // browser plays HLS itself and hls.js is never even downloaded.
        if (!window.MediaSource && !window.ManagedMediaSource) {
          if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = v.url; return; }
          box.innerHTML = videoMessage('This browser cannot play the video.');
          return;
        }
        attachStream(el, v, mine, function (msg) { box.innerHTML = videoMessage(msg); });
      })
      .catch(function () { if (mine === videoGen) box.innerHTML = videoMessage('Video lesson — coming soon'); });
  }

  /**
   * Point a <video> at a signed HLS URL. Shared by the lesson's own video and
   * by the recordings inside a lesson body, which need exactly the same
   * treatment: the token reapplied per request, and hls.js preferred over
   * Chrome's word that it can play HLS natively.
   */
  function attachStream(el, v, mine, onFail) {
    if (!window.MediaSource && !window.ManagedMediaSource) {
      if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = v.url; return; }
      onFail('This browser cannot play the video.');
      return;
    }
    loadHls().then(function (ok) {
      if (mine !== videoGen) return;
      if (!ok || !window.Hls.isSupported()) {
        if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = v.url; return; }
        onFail('Could not load the video player.');
        return;
      }
      var cfg = {
        // Don't fetch more pixels than the screen can show. These are screen
        // recordings watched in a box a few hundred pixels wide, and the
        // bandwidth is billed by the gigabyte.
        capLevelToPlayerSize: true,
        // hls.js assumes 500kbps until it has measured the connection, which
        // starts every lesson at 360p — soft, on recordings whose whole point
        // is legible text — and then climbs a rung at a time. Opening at a
        // more realistic guess starts it sharp; a genuinely slow connection
        // still drops within a fragment or two, because the measurement
        // immediately replaces the guess.
        abrEwmaDefaultEstimate: 3000000
      };
      // The signed query covers the whole video directory, but hls.js
      // resolves each segment relative to the playlist and so drops it —
      // the playlist would load and every segment after it would 403.
      // Put the same token back on each request.
      var qs = v.url.split('?')[1] || '';
      if (qs) {
        var BaseLoader = window.Hls.DefaultConfig.loader;
        cfg.loader = function (c) {
          var l = new BaseLoader(c);
          var load = l.load.bind(l);
          l.load = function (ctx, lcfg, cbs) {
            if (ctx.url.indexOf('token=') === -1) {
              ctx.url += (ctx.url.indexOf('?') === -1 ? '?' : '&') + qs;
            }
            return load(ctx, lcfg, cbs);
          };
          return l;
        };
      }
      var hls = new window.Hls(cfg);
      hlsPool.push(hls);
      hls.loadSource(v.url);
      hls.attachMedia(el);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
        if (mine === videoGen) addQualityMenu(el.parentNode, hls);
      });
      hls.on(window.Hls.Events.ERROR, function (_e, d) {
        // Recoverable stalls happen on flaky connections; only a fatal
        // error is worth replacing the player over.
        if (!d.fatal) return;
        if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); return; }
        if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
        if (mine === videoGen) onFail('This video could not be played.');
      });
    });
  }

  /**
   * A quality picker. The browser's own controls have no such thing — hls.js
   * chooses by bandwidth and there is no way to overrule it — so this adds a
   * small menu over the top-right of the picture: Auto, plus each resolution
   * the stream actually carries.
   */
  function addQualityMenu(wrap, hls) {
    if (!wrap || wrap.querySelector('.q-menu')) return;
    var levels = hls.levels || [];
    if (levels.length < 2) return;      // nothing to choose between

    // highest first, which is the order people expect to read them in
    var order = levels.map(function (l, i) { return { i: i, h: l.height }; })
                      .sort(function (a, b) { return b.h - a.h; });

    var menu = document.createElement('div');
    menu.className = 'q-menu';
    menu.innerHTML =
      '<button type="button" class="q-btn" aria-haspopup="true" aria-expanded="false">Auto</button>' +
      '<div class="q-list" hidden>' +
        '<button type="button" data-level="-1" class="on">Auto</button>' +
        order.map(function (o) {
          return '<button type="button" data-level="' + o.i + '">' + o.h + 'p</button>';
        }).join('') +
      '</div>';
    wrap.appendChild(menu);

    var btn = menu.querySelector('.q-btn');
    var list = menu.querySelector('.q-list');

    // hls.currentLevel reports the level actually playing even when the choice
    // is automatic, so it cannot tell you which mode you are in —
    // autoLevelEnabled is the one that answers that.
    function label() {
      var lv = levels[hls.currentLevel];
      if (hls.autoLevelEnabled) return lv ? 'Auto · ' + lv.height + 'p' : 'Auto';
      return lv ? lv.height + 'p' : 'Auto';
    }
    function refresh() { btn.textContent = label(); }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = !list.hidden;
      list.hidden = open;
      btn.setAttribute('aria-expanded', String(!open));
    });

    list.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-level]');
      if (!b) return;
      hls.currentLevel = Number(b.getAttribute('data-level'));
      [].forEach.call(list.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      list.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      refresh();
    });

    // close when the attention goes elsewhere
    document.addEventListener('click', function () {
      list.hidden = true; btn.setAttribute('aria-expanded', 'false');
    });

    // while on Auto the label follows whatever hls.js settles on
    hls.on(window.Hls.Events.LEVEL_SWITCHED, refresh);
    refresh();
  }

  /**
   * Fill in the recordings that sit inside a lesson body. The body arrives
   * with an empty marker per clip; each gets its own signed URL.
   */
  function mountClips(scope, lesson) {
    var marks = scope.querySelectorAll('.lesson-clip');
    if (!marks.length) return;
    var mine = videoGen;

    [].forEach.call(marks, function (mark) {
      var idx = Number(mark.getAttribute('data-clip'));
      var meta = (lesson.clips || [])[idx] || {};
      if (meta.aspect) mark.style.aspectRatio = String(meta.aspect);
      mark.innerHTML = '<div class="clip-msg">Loading video…</div>';

      fetch('/api/video/sign?lesson=' + encodeURIComponent(lesson.libId) + '&clip=' + idx,
            { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (mine !== videoGen) return;
          if (!v || !v.url) { mark.innerHTML = '<div class="clip-msg">Video unavailable.</div>'; return; }
          var el = document.createElement('video');
          el.controls = true; el.playsInline = true; el.preload = 'metadata';
          if (v.poster) el.poster = v.poster;
          mark.innerHTML = ''; mark.appendChild(el);
          el.addEventListener('loadedmetadata', function () {
            if (el.videoWidth && el.videoHeight) mark.style.aspectRatio = el.videoWidth + ' / ' + el.videoHeight;
          });
          attachStream(el, v, mine, function (msg) { mark.innerHTML = '<div class="clip-msg">' + esc(msg) + '</div>'; });
        })
        .catch(function () { if (mine === videoGen) mark.innerHTML = ''; });
    });
  }

  function gotoLesson(idx) {
    curIdx = idx;
    var l = curFlat[idx];
    document.getElementById('pl-count').textContent = 'Lesson ' + (idx + 1) + ' of ' + curFlat.length;
    document.getElementById('pl-title').textContent = l.title;
    mountVideo(l);
    document.getElementById('pl-dur').textContent = l.duration ? ('Duration ' + l.duration) : '';
    document.getElementById('pl-prev').disabled = idx === 0;
    document.getElementById('pl-next').disabled = idx === curFlat.length - 1;
    updateCompleteBtn();
    updateBookmarkBtn();
    updateHint();
    renderSideMenu();

    var body = document.getElementById('pl-content');
    body.innerHTML = '<p style="color:var(--txt-3);font-family:var(--mono)">Loading…</p>';
    fetch('/api/library/item?id=' + encodeURIComponent(l.libId), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (it) {
        var hasText = !!(it && it.bodyHtml && String(it.bodyHtml).trim());
        body.innerHTML = hasText ? it.bodyHtml
          : '<p style="color:var(--txt-3)">Lesson notes will appear here.</p>';
        // a lesson can carry its own recordings in the body — fill them in
        mountClips(body, l);
        // Only now is it known whether this lesson has anything written against
        // it, which is what decides the default tab.
        buildTabs(courseCache[curCourseSlug], { bodyHtml: hasText ? it.bodyHtml : '' });
      })
      .catch(function () { body.innerHTML = '<p style="color:#fca5a5">Could not load this lesson.</p>'; });

    document.querySelector('.player-main').scrollTop = 0;
  }

  function updateCompleteBtn() {
    var l = curFlat[curIdx];
    var btn = document.getElementById('pl-complete');
    var lbl = document.getElementById('pl-complete-label');
    var last = curIdx === curFlat.length - 1;
    if (isDone(l.libId)) { btn.classList.add('is-done'); lbl.textContent = last ? 'Completed' : 'Completed — next lesson'; }
    else { btn.classList.remove('is-done'); lbl.textContent = last ? 'Complete course' : 'Complete lesson'; }
  }

  function completeLesson() {
    var l = curFlat[curIdx];
    progress[l.libId] = true; saveProgress();
    if (curIdx < curFlat.length - 1) gotoLesson(curIdx + 1);
    else { updateCompleteBtn(); renderSideMenu(); }
  }

  /* --- middle button: hide the lesson rail to widen the reading column --- */
  function setWide(on) {
    playerEl.classList.toggle('wide', on);
    document.getElementById('pt-wide').classList.toggle('on', on);
    document.getElementById('pt-wide-tip').textContent = on ? 'Show lessons' : 'Widen lesson';
    try { localStorage.setItem('afu_wide', on ? '1' : '0'); } catch (e) {}
  }
  function toggleWide() { setWide(!playerEl.classList.contains('wide')); }

  /* --- right button: bookmark this lesson --- */
  function updateBookmarkBtn() {
    var l = curFlat[curIdx];
    var on = !!(l && isBookmarked(l.libId));
    document.getElementById('pt-bookmark').classList.toggle('on', on);
    document.getElementById('pt-bookmark-svg').setAttribute('fill', on ? 'currentColor' : 'none');
    document.getElementById('pt-bookmark-tip').textContent = on ? 'Remove bookmark' : 'Bookmark lesson';
  }

  function toggleBookmarkCurrent() {
    var l = curFlat[curIdx];
    if (!l) return;
    var btn = document.getElementById('pt-bookmark');
    btn.disabled = true;
    postBookmark(l.libId, curCourseSlug, l.title).then(function (d) {
      if (!d) return;
      if (d.bookmarked) {
        bookmarkIds[l.libId] = true;
        bookmarks.unshift({ lessonId: l.libId, course: curCourseSlug, title: l.title });
      } else {
        delete bookmarkIds[l.libId];
        bookmarks = bookmarks.filter(function (x) { return x.lessonId !== l.libId; });
      }
      updateBookmarkCount(); updateBookmarkBtn();
      if (view === 'bookmarks') render();
    }).catch(function () {}).then(function () { btn.disabled = false; });
  }


  /* --- left button: the course discussion --- */
  var commentsLoaded = null;  // slug currently shown in the panel
  var replyTo = null;         // comment id being replied to

  function toggleComments() {
    // Once the discussion lives in a tab, the old side rail is an empty box.
    // The button opens the tab instead of a panel with nothing in it.
    var bar = document.getElementById('pl-tabs');
    if (bar && !bar.hidden) {
      if (curTab !== 'community') showTab('community');
      if (commentsLoaded !== curCourseSlug) loadComments(curCourseSlug, true);
      var ed = composer();
      if (ed) { ed.el.scrollIntoView({ block: 'center' }); ed.focus(); }
      return;
    }
    var open = playerEl.classList.toggle('comments-open');
    document.getElementById('pt-comments').classList.toggle('on', open);
    if (open) {
      if (commentsLoaded !== curCourseSlug) loadComments(curCourseSlug, true);
      (function () { var e0 = composer(); if (e0) e0.focus(); })();
    }
  }
  function closeComments() {
    playerEl.classList.remove('comments-open');
    document.getElementById('pt-comments').classList.remove('on');
  }

  function setCommentCount(n) {
    var el = document.getElementById('pt-comments-n');
    el.textContent = n > 99 ? '99+' : String(n);
    el.classList.toggle('show', n > 0);
  }

  function loadComments(slug, force) {
    if (!slug) return Promise.resolve();
    var list = document.getElementById('plc-list');
    if (force || commentsLoaded !== slug) list.innerHTML = '<p class="plc-empty">Loading…</p>';
    return fetch('/api/comments/list?course=' + encodeURIComponent(slug), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || slug !== curCourseSlug) return;
        commentsLoaded = slug;
        var items = d.comments || [];
        renderComments(items);
        setCommentCount(items.filter(function (x) { return !x.removed; }).length);
      })
      .catch(function () {
        list.innerHTML = '<p class="plc-empty" style="color:#fca5a5">Could not load the comments.</p>';
      });
  }

  function when(iso) {
    var t = new Date(iso).getTime();
    if (!t) return '';
    var s2 = Math.round((Date.now() - t) / 1000);
    if (s2 < 60) return 'just now';
    if (s2 < 3600) return Math.floor(s2 / 60) + 'm ago';
    if (s2 < 86400) return Math.floor(s2 / 3600) + 'h ago';
    if (s2 < 604800) return Math.floor(s2 / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }

  function cmtHTML(c) {
    if (c.removed) {
      return '<div class="cmt removed" data-id="' + c.id + '">' +
        '<span class="av" style="background:var(--bg-4);color:var(--txt-3)">–</span>' +
        '<div class="cb"><div class="ch"><span class="cn" style="color:var(--txt-3)">Removed</span></div>' +
        '<div class="ctext">This comment was removed.</div></div></div>';
    }
    var h = hue(c.author || 'member');
    var initial = String(c.author || '?').trim().charAt(0).toUpperCase();
    return '<div class="cmt" data-id="' + c.id + '">' +
      '<span class="av" style="background:linear-gradient(140deg,hsl(' + h + ',72%,64%),hsl(' + ((h + 40) % 360) + ',72%,50%))">' + esc(initial) + '</span>' +
      '<div class="cb">' +
        '<div class="ch"><span class="cn">' + esc(c.author) + '</span>' +
        (c.isAdmin ? '<span class="badge">Admin</span>' : '') +
        '<span class="ct">' + esc(when(c.createdAt)) + '</span></div>' +
        (c.lessonTitle ? '<div class="cl">on ' + esc(c.lessonTitle) + '</div>' : '') +
        '<div class="ctext">' + (c.body ? window.rtSanitize(c.body) : '') + '</div>' +
        '<div class="ca"><button data-reply="' + c.id + '">Reply</button>' +
        (c.canDelete ? '<button data-del="' + c.id + '">Delete</button>' : '') + '</div>' +
      '</div></div>';
  }

  function threadHTML(c, kids) {
    var replies = kids[c.id] || [];
    return cmtHTML(c) + (replies.length
      ? '<div class="cmt-replies">' + replies.map(function (r) { return threadHTML(r, kids); }).join('') + '</div>'
      : '');
  }

  function renderComments(items) {
    var list = document.getElementById('plc-list');
    if (!items.length) {
      list.innerHTML = '<p class="plc-empty">No comments on this course yet.<br>Ask the first question — we answer here.</p>';
      return;
    }
    var kids = {}, seen = {};
    items.forEach(function (c) { seen[c.id] = true; });
    items.forEach(function (c) { if (c.parentId != null && seen[c.parentId]) (kids[c.parentId] ||= []).push(c); });
    var html = '';
    items.forEach(function (c) {
      // replies render under their parent; one whose parent is gone stands alone
      if (c.parentId != null && seen[c.parentId]) return;
      html += '<div>' + threadHTML(c, kids) + '</div>';
    });
    list.innerHTML = html;
    [].forEach.call(list.querySelectorAll('[data-reply]'), function (b) {
      b.addEventListener('click', function () { startReply(Number(b.getAttribute('data-reply'))); });
    });
    [].forEach.call(list.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () { removeComment(Number(b.getAttribute('data-del'))); });
    });
    list.scrollTop = list.scrollHeight;
  }

  function startReply(id) {
    replyTo = id;
    updateHint();
    (function () { var e0 = composer(); if (e0) e0.focus(); })();
  }

  function updateHint() {
    var hint = document.getElementById('plc-hint');
    if (!hint) return;
    if (replyTo) {
      var nameEl = document.querySelector('.cmt[data-id="' + replyTo + '"] .cn');
      hint.innerHTML = 'Replying to ' + esc(nameEl ? nameEl.textContent : 'comment') + ' · <button type="button" id="plc-cancel">cancel</button>';
      document.getElementById('plc-cancel').addEventListener('click', function () { replyTo = null; updateHint(); });
    } else {
      var l = curFlat[curIdx];
      hint.textContent = l ? ('On: ' + l.title) : '';
    }
  }

  function submitComment() {
    var ed = composer();
    var nameEl = document.getElementById('plc-name');
    var send = document.getElementById('plc-send');
    if (!ed || ed.isEmpty() || !curCourseSlug) return;
    // Sanitised before it leaves the page as well as when it arrives. The
    // server does not trust this, but there is no reason to send it rubbish.
    var body = ed.html();
    var l = curFlat[curIdx] || {};
    var payload = {
      course: curCourseSlug, lessonId: l.libId, lessonTitle: l.title,
      parentId: replyTo, body: body
    };
    var newName = !nameEl.hidden ? nameEl.value.trim() : '';
    if (newName) payload.displayName = newName;
    send.disabled = true;
    fetch('/api/comments/create', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { alert('Could not post that comment. Please try again.'); return; }
        ed.clear();
        replyTo = null;
        if (newName) { me.hasName = true; me.name = newName; nameEl.hidden = true; }
        return loadComments(curCourseSlug, true).then(updateHint);
      })
      .catch(function () { alert('Could not post that comment. Please try again.'); })
      .then(function () { send.disabled = false; });
  }

  function removeComment(id) {
    if (!window.confirm('Delete this comment?')) return;
    fetch('/api/comments/delete', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function (r) { if (r.ok) loadComments(curCourseSlug, true); });
  }

  function renderSideMenu() {
    var tree = courseCache[curCourseSlug];
    var list = document.getElementById('pl-side-list');
    var gi = 0, html = '';
    (tree.sections || []).forEach(function (s, si) {
      html += '<div class="ps-sec">' + esc(sectionHeading(s.name, si)) + '</div>';
      (s.lessons || []).forEach(function (l) {
        var idx = gi++;
        html += '<div class="ps-row ' + (idx === curIdx ? 'active ' : '') + (isDone(l.libId) ? 'done' : '') + '" data-idx="' + idx + '">' +
          '<span class="rc">' + (isDone(l.libId) ? '✓' : '') + '</span>' +
          '<span class="rt">' + esc(l.title) + '</span>' +
          '<span class="rd">' + esc(l.duration || '') + '</span></div>';
      });
    });
    list.innerHTML = html;
    [].forEach.call(list.querySelectorAll('.ps-row'), function (row) {
      row.addEventListener('click', function () {
        gotoLesson(Number(row.getAttribute('data-idx')));
        playerEl.classList.remove('menu-open');
      });
    });
  }

  function renderSearch(c) {
    var items = all.filter(function (it) {
      var hay = (it.title + ' ' + (it.description || '') + ' ' + (it.category || '') + ' ' + it.kind).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    var html = '<h1 class="page-h">Search</h1>' +
      '<p class="page-sub">' + items.length + ' result' + (items.length === 1 ? '' : 's') + ' for “' + esc(q) + '”.</p>';
    html += items.length ? gridOf(items) : '<p class="empty">Nothing matches “' + esc(q) + '”.</p>';
    c.innerHTML = html;
    bindCards(c);
  }

  function kb(n) { if (!n) return ''; return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }

  /* ---------------- reader ---------------- */
  var reader = document.getElementById('reader');
  // Wording for the panel that holds the item's own text, per kind.
  //
  // `copy` is null where the body is something to read rather than to paste.
  // All 51 skill bodies are the same install note ("Claude Skills work inside
  // Claude Code and Cowork only…"), a Custom GPT's body is a link blurb, and an
  // automation's is "download the blueprint below" — a copy button on any of
  // those offers the member nothing. The prompt text, the template and a GPT's
  // system instructions are the things people actually paste, so those keep it.
  var BODY_PANEL = {
    prompt:       { title: 'The Prompt',   mono: true,  copy: 'Copy prompt' },
    image_prompt: { title: 'The Prompt',   mono: true,  copy: 'Copy prompt' },
    skill:        { title: 'How to use it', mono: false, copy: null },
    gpt:          { title: 'How to use it', mono: false, copy: null },
    automation:   { title: 'How to use it', mono: false, copy: null },
    guide:        { title: 'The Guide',    mono: false, copy: null },
    video:        { title: 'Notes',        mono: false, copy: null },
    // No copy button on the body: a routine's document is setup steps and
    // troubleshooting, and copying all of it into Claude's Instructions box
    // is exactly the mistake to design out. The prompt gets its own panel.
    routine:      { title: 'Setup & notes', mono: false, copy: null }
  };
  // Only the item's own note is ever shown. There used to be invented fallbacks
  // here, which meant a panel could claim something the source never said.
  var HOW_TO = {};

  function dots(){ return '<span class="dots"><i class="d-r"></i><i class="d-y"></i><i class="d-g"></i></span>'; }

  // A share link is not an embed link. Vimeo's unlisted URLs carry the privacy
  // hash as a second path segment (vimeo.com/<id>/<hash>) and it has to move to
  // ?h= or the player refuses to load.
  function embedUrl(u) {
    u = String(u || '');
    var m = /vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-z]+))?/i.exec(u);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + (m[2] ? '?h=' + m[2] : '');
    m = /(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/i.exec(u);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = /loom\.com\/(?:share|embed)\/([\w-]+)/i.exec(u);
    if (m) return 'https://www.loom.com/embed/' + m[1];
    return u;
  }
  function textOf(html){ var t=document.createElement('div'); t.innerHTML=html||''; return (t.innerText||t.textContent||'').trim(); }

  // Copy handlers are wired by index into this list, so nothing has to be
  // escaped into an onclick attribute.
  var copyBank = [];
  function copyBtn(text, label, cls) {
    var i = copyBank.push(text) - 1;
    return '<button class="' + cls + '" data-copy="' + i + '">' + esc(label) + '</button>';
  }

  function openItem(id) {
    fetch('/api/library/item?id=' + encodeURIComponent(id), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (it) {
        if (!it) return;
        copyBank = [];
        var meta = it.meta || {};
        var body = it.bodyHtml || '';
        // Older rows stored the description as the body too — show it once.
        if (body && textOf(body) === String(it.description || '').trim()) body = '';

        document.getElementById('r-kind').textContent = (KINDS[it.kind] || {}).label || it.kind;
        document.getElementById('r-title').textContent = it.title || '';

        var h = '';

        // chips: the category first, then its tags
        var chips = [];
        if (it.category) chips.push('<span class="chip k">' + esc(it.category) + '</span>');
        (it.tags || []).slice(0, 8).forEach(function (t) {
          if (String(t).toLowerCase() !== String(it.category || '').toLowerCase()) chips.push('<span class="chip">' + esc(t) + '</span>');
        });
        if (chips.length) h += '<div class="r-chips">' + chips.join('') + '</div>';

        if (it.description) h += '<p class="desc">' + esc(it.description) + '</p>';

        // the facts strip
        var facts = [];
        if (meta.difficulty && !meta.level) facts.push('<span>Level <b>' + esc(meta.difficulty) + '</b></span>');
        if (meta.duration) facts.push('<span>Duration <b>' + esc(meta.duration) + '</b></span>');
        if (meta.setupTime) facts.push('<span>Setup <b>' + esc(meta.setupTime) + '</b></span>');
        if (meta.estimatedTime) facts.push('<span>Time <b>' + esc(meta.estimatedTime) + '</b></span>');
        if (meta.instructor) facts.push('<span>By <b>' + esc(meta.instructor) + '</b></span>');
        if (meta.platform) facts.push('<span>Runs on <b>' + esc(meta.platform) + '</b></span>');
        if (it.gallery && it.gallery.length) facts.push('<span><b>' + it.gallery.length + '</b> prompts in this collection</span>');
        if (meta.promptType === 'stack' && (meta.promptItems || []).length > 1) facts.push('<span><b>' + meta.promptItems.length + '-part</b> prompt stack</span>');
        if (meta.modelCompatibility && meta.modelCompatibility.length) facts.push('<span>Works with <b>' + esc(meta.modelCompatibility.join(', ')) + '</b></span>');
        if (facts.length) h += '<div class="r-meta">' + facts.join('') + '</div>';

        // The source's articles open with a dotted hero carrying the blurb, the
        // read time and the level. The title itself is already above, so only
        // the parts that are not repeated are kept.
        if (meta.readTime || meta.level) {
          h += '<div class="r-hero">' +
            (meta.heroText ? '<p>' + esc(meta.heroText) + '</p>' : '') +
            '<div class="r-hero-meta">' +
            (meta.readTime ? '<span class="pill">⏱ ' + esc(meta.readTime) + '</span>' : '') +
            (meta.level ? '<span class="pill lvl">● ' + esc(meta.level) + '</span>' : '') +
            '</div></div>';
        }

        // video
        if (meta.videoUrl) {
          h += '<div class="r-video">' + (/\.(mp4|webm|mov)(\?|$)/i.test(meta.videoUrl)
            ? '<video controls playsinline preload="metadata" src="' + esc(meta.videoUrl) + '"></video>'
            : '<iframe src="' + esc(embedUrl(meta.videoUrl)) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>') + '</div>';
          if (meta.videoText) h += '<p class="desc">' + esc(meta.videoText) + '</p>';
        }

        // how-to note — the item's own, or the fallback for its kind
        var howTo = meta.howTo || (HOW_TO[it.kind] && (body || (it.gallery || []).length) ? HOW_TO[it.kind] : null);
        if (howTo) {
          h += '<div class="panel note"><div class="panel-h">' + dots() +
            '<span class="pt">How to use this</span></div>' +
            '<div class="panel-b">' + howTo + '</div></div>';
        }

        var p = BODY_PANEL[it.kind] || { title: 'Details', mono: false, copy: 'Copy text' };
        function panel(title, html, mono, copyLabel, domId) {
          h += '<div class="panel"' + (domId ? ' id="' + domId + '"' : '') + '><div class="panel-h">' + dots() +
            '<span class="pt">' + esc(title) + '</span>' +
            (copyLabel ? copyBtn(textOf(html), copyLabel, 'pc') : '') + '</div>' +
            '<div class="panel-b' + (mono ? ' mono' : '') + '">' + html + '</div></div>';
        }

        var parts = (meta.promptItems || []).filter(function (x) { return x && (x.content || x.text); });
        // Most single-item prompts store the same text twice — once as the body,
        // once as the lone prompt_item — so a part that repeats the body adds
        // nothing. A Custom GPT is the opposite case: its body is the short "open
        // this GPT" note and the part is the system prompt it actually sells, so
        // dropping the part there loses the whole point of the item.
        var bodyText = textOf(body);
        var extras = parts.filter(function (x) { return textOf(x.content || x.text) !== bodyText; });

        if (parts.length > 1) {
          // a stack: several prompts meant to be used in order, each copyable
          parts.forEach(function (part, i) {
            panel(part.title || ('Prompt ' + (i + 1)), part.content || part.text || '', true, 'Copy prompt');
          });
        } else {
          if (body) panel(p.title, body, p.mono, p.copy);
          // a differing prompt_item is the thing the item actually sells — the
          // GPT's system prompt — so it is always copyable, whatever its kind
          extras.forEach(function (part) {
            panel(part.title || 'System instructions', part.content || part.text || '', true, 'Copy');
          });
        }

        // A routine's prompt sits below the setup, not above it: you read how
        // to set it up, and the thing you have to paste is the next thing you
        // reach. The setup panel ends by pointing down at it.
        if (it.kind === 'routine' && meta.prompt) {
          panel('Instructions — paste this into Claude',
                '<pre>' + esc(meta.prompt) + '</pre>', true, 'Copy instructions',
                'routine-instructions');
        }

        // An automation mirrors the source's Template Instructions block: the
        // blueprint to import, then the walk-through for wiring up accounts.
        if (it.kind === 'automation' && (it.download || meta.setupUrl)) {
          var plat = meta.platform ? meta.platform.charAt(0).toUpperCase() + meta.platform.slice(1) : 'your automation tool';
          h += '<div class="panel"><div class="panel-h">' + dots() +
            '<span class="pt">Template Instructions</span></div><div class="panel-b">';
          if (it.download) {
            h += '<p>Click the link below to download the JSON blueprint and import it in your ' + esc(plat) + ' account.</p>' +
              '<p><a class="tpl-btn" href="' + esc(it.download.url) + '" download>' + esc(it.title) + ' via ' + esc(plat) + '</a></p>';
          }
          if (meta.setupUrl) {
            h += '<p>Follow the instructions below to connect your accounts and get it set up correctly.</p>' +
              '<p><a class="tpl-btn" href="' + esc(meta.setupUrl) + '" target="_blank" rel="noopener">View Instructions &#8599;</a></p>';
          }
          h += '</div></div>';
        }

        // downloadable file (skills, plugins, agents) — the automation panel
        // above already offers its blueprint, so it is not repeated here
        if (it.download && it.kind !== 'automation') {
          var dlName = it.download.name || 'file';
          var label = /\.zip$/i.test(dlName) ? 'Download the .zip'
            : (it.kind === 'skill' ? 'Download Skill' : 'Download file');
          h += '<a class="r-dl" href="' + esc(it.download.url) + '" download>&#11015; ' + esc(label) + '</a>' +
            '<p class="r-dl-sub">' + esc(dlName) + (meta.fileSize ? ' · ' + kb(meta.fileSize) : '') +
            (/\.zip$/i.test(dlName) ? ' — unzip it first, then install the file inside.'
              : it.kind === 'skill' ? ' — to use in Claude.' : '') + '</p>';
        }

        // the long-form guide, rendered as part of this page
        if (it.guideHtml) h += '<div class="guide">' + it.guideHtml + '</div>';

        // a video's supporting notes
        if (meta.supportingText) h += '<div class="panel note"><div class="panel-b">' + esc(meta.supportingText) + '</div></div>';

        // a guide that embeds something hosted elsewhere
        if (meta.richHtml) h += '<div class="panel"><div class="panel-b">' + meta.richHtml + '</div></div>';
        else if (meta.embedUrl) {
          h += '<p class="r-sec-s"><a href="' + esc(meta.embedUrl) + '" target="_blank" rel="noopener" style="color:var(--accent-2)">Open the full guide &#8599;</a></p>';
        }

        // starters / capabilities
        if (meta.starters && meta.starters.length) {
          h += '<div class="r-sec">Conversation starters</div>';
          h += '<div class="panel"><div class="panel-b"><ul style="margin:0;padding-left:18px">' +
            meta.starters.map(function (x) { return '<li>' + esc(typeof x === 'string' ? x : (x.text || x.title || '')) + '</li>'; }).join('') +
            '</ul></div></div>';
        }

        // the gallery
        if (it.gallery && it.gallery.length) {
          h += '<div class="r-sec">' + it.gallery.length + ' prompts</div>' +
            '<p class="r-sec-s">Hover a tile to read its prompt, then copy it.</p><div class="gal">';
          it.gallery.forEach(function (g) {
            var ov = '<div class="ov"><p>' + esc(g.prompt || 'No prompt recorded.') + '</p>' +
              (g.prompt ? copyBtn(g.prompt, 'Copy prompt', '') : '') + '</div>';
            h += g.image
              ? '<figure><img loading="lazy" src="' + esc(g.image) + '" alt="">' + ov + '</figure>'
              : '<figure class="noimg">' + ov + '</figure>';
          });
          h += '</div>';
        }

        // related
        if (it.related && it.related.length) {
          h += '<div class="r-sec">Related</div><p class="r-sec-s">More like this in your library.</p><div class="r-rel">';
          it.related.forEach(function (r) {
            h += '<div class="rc" data-open="' + esc(r.id) + '"><div class="rt">' + esc(r.title) + '</div>' +
              (r.description ? '<div class="rd">' + esc(r.description) + '</div>' : '') + '</div>';
          });
          h += '</div>';
        }

        if (!body && !parts.length && !(it.gallery || []).length && !meta.videoUrl && !it.download && !it.guideHtml && !meta.richHtml) {
          // A collection whose tiles have not been built yet is a different thing
          // from an item with nothing in it — say which.
          h += meta.contentMode === 'image_gallery'
            ? '<p class="empty">This collection is still being prepared. Check back shortly.</p>'
            : '<p class="empty">Nothing else recorded for this item yet.</p>';
        }

        var c = document.getElementById('r-content');
        c.innerHTML = h;

        [].forEach.call(c.querySelectorAll('[data-copy]'), function (b) {
          b.addEventListener('click', function (e) {
            e.stopPropagation();
            var was = b.textContent;
            navigator.clipboard.writeText(copyBank[Number(b.getAttribute('data-copy'))] || '').then(function () {
              b.textContent = 'Copied!';
              setTimeout(function () { b.textContent = was; }, 1400);
            });
          });
        });
        // touch: no hover, so tapping a tile reveals its prompt
        [].forEach.call(c.querySelectorAll('.gal figure'), function (fig) {
          fig.addEventListener('click', function (e) {
            if (e.target.closest('button')) return;
            fig.classList.toggle('open');
          });
        });
        [].forEach.call(c.querySelectorAll('[data-open]'), function (r) {
          r.addEventListener('click', function () { openItem(r.getAttribute('data-open')); });
        });
        // A routine's body points down at its instructions panel. The pointer is
        // a link rather than a sentence, because on a phone the panel it names
        // is several screens away and "below this one" is not a way of getting
        // anywhere. Flash the panel on arrival so the jump is legible.
        [].forEach.call(c.querySelectorAll('[data-scroll]'), function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var target = document.getElementById(a.getAttribute('data-scroll'));
            if (!target) return;
            target.scrollIntoView({ block: 'start', behavior: 'smooth' });
            target.classList.remove('flash');
            void target.offsetWidth;
            target.classList.add('flash');
          });
        });
        // An article's own table of contents links to #block-… anchors. Left
        // alone they rewrite location.hash, which is what the app routes on, so
        // clicking one threw the member back to the dashboard. Scroll instead.
        [].forEach.call(c.querySelectorAll('.guide a[href^="#"]'), function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var id = a.getAttribute('href').slice(1);
            var target = id && (document.getElementById(id) || c.querySelector('[id="' + id + '"]'));
            // not smooth: these articles run to 20,000+ pixels and a smooth
            // scroll that far takes several seconds of nothing appearing to happen
            if (target) target.scrollIntoView({ block: 'start' });
          });
        });

        reader.classList.add('show');
        reader.scrollTop = 0;
        document.querySelector('.reader-inner').scrollIntoView({ block: 'start' });
      });
  }
  document.getElementById('r-close').addEventListener('click', function(){ reader.classList.remove('show'); });
  reader.addEventListener('click', function(e){ if (e.target === reader) reader.classList.remove('show'); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') reader.classList.remove('show'); });

  /* ---------------- search box ---------------- */
  var searchEl = document.getElementById('search');
  var st;
  searchEl.addEventListener('input', function () {
    clearTimeout(st);
    st = setTimeout(function () { q = searchEl.value.trim().toLowerCase(); render(); }, 140);
  });

  /* ---------------- mobile sidebar ---------------- */
  function closeNav(){ document.body.classList.remove('nav-open'); }
  document.getElementById('hamb').addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
  document.getElementById('scrim').addEventListener('click', closeNav);
})();
</script>
</body>
</html>
