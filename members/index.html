<script>
(function () {
  /* ---------------- access gate ---------------- */
  var gate = document.getElementById('gate');
  var gateMsg = document.getElementById('gate-msg');
  var gateBtn = document.getElementById('gate-btn');
  var appEl = document.getElementById('app');

  function showGate(msg, showBtn) { gateMsg.textContent = msg; gateBtn.hidden = !showBtn; }

  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (res) {
      if (res.status === 200 && res.d.active) {
        gate.style.display = 'none';
        appEl.style.display = 'block';
        document.getElementById('who-email').textContent = res.d.email;
        document.getElementById('who-name').textContent = res.d.name || res.d.email;
        me.email = res.d.email;
        me.name = res.d.name || '';
        me.hasName = !!res.d.hasName;
        me.isAdmin = !!res.d.isAdmin;
        // the admin view is staff-only server-side; this just stops showing a
        // link to a page that would refuse them anyway
        if (me.isAdmin) document.getElementById('admin-link').hidden = false;
        boot();
      } else if (res.status === 403) {
        showGate('Your access is not active. If you were recently refunded that’s expected; otherwise contact support@aifounderuniversity.com.', true);
        gateBtn.textContent = 'Back to sign in';
      } else {
        window.location.replace('login.html');
      }
    })
    .catch(function () { showGate('Could not verify your access. Please refresh, or sign in again.', true); });

  document.getElementById('signout').addEventListener('click', function () {
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
      .finally(function () { window.location.replace('login.html'); });
  });

  /* ---------------- config ---------------- */
  // Names match the source library exactly — "Prompts" and "LLM Prompts" are
  // the same shelf and it should not be a guess which one a member is on.
  // `label` names the shelf, `one` names a single item — a card reading
  // "LLM Prompts" describes a category rather than the thing in front of you.
  var KINDS = {
    prompt:       { label: 'LLM Prompts',            one: 'LLM Prompt',   glyph: '💬' },
    image_prompt: { label: 'Image & Video Prompts',  one: 'Image Prompt', glyph: '🎨' },
    skill:        { label: 'Agents & Skills',        one: 'Claude Skill', glyph: '🤖' },
    gpt:          { label: 'Custom GPTs',            one: 'Custom GPT',   glyph: '🧠' },
    automation:   { label: 'Automation Templates',   one: 'Automation',   glyph: '⚡' },
    guide:        { label: 'Prompting Fundamentals', one: 'Guide',        glyph: '📖' },
    video:        { label: 'Tutorials',              one: 'Tutorial',     glyph: '🎬' },
    // Named for what Anthropic calls them, so a member searching the Claude
    // docs finds the same word. Distinct from 'automation' above, which is the
    // Make and n8n blueprint library.
    routine:      { label: 'Claude Routines',        one: 'Routine',      glyph: '⏱️' }
  };
  // 'lesson' is intentionally excluded — courses have their own player.
  // Routines lead: they are the newest thing and the one members are most
  // likely to have come looking for.
  var LIB_ORDER = ['routine','prompt','image_prompt','gpt','automation','guide','video','skill'];
  var DL_META = {
    plugin:  { label: 'Specialists & Plugins', glyph: '🧩', blurb: 'Install these in Claude.' },
    powerup: { label: 'Power-Ups',             glyph: '⚡', blurb: 'Focused packs for every job.' },
    course:  { label: 'Course files',          glyph: '🎓', blurb: 'Downloadable course material.' }
  };
  var COURSE_NAMES = {
    '70-ai-specialists-for-claude-course': '70 AI Specialists for Claude',
    'ai-automation-specialists-for-claude-01f5af': 'AI Automation Specialists',
    'carousel-post-specialist-for-claude': 'Carousel Post Specialist',
    'email-specialists-for-claude-97058b': 'Email Specialist',
    'image-designers-for-claude': 'Image Designers',
    'video-shorts-specialist-for-claude': 'Video Shorts Specialist'
  };

  var me = { email: '', name: '', hasName: false, isAdmin: false };
  var all = [];        // library items (with .kind)
  var downloads = {};  // grouped downloadables
  var courses = [];    // course list (cards)
  var courseCache = {};// slug -> full course tree
  var counts = {};
  var view = 'dashboard';
  var q = '';

  /* lesson completion in localStorage (per viewer) */
  var progress = (function () {
    try { return JSON.parse(localStorage.getItem('afu_progress') || '{}') || {}; }
    catch (e) { return {}; }
  })();
  function saveProgress() { try { localStorage.setItem('afu_progress', JSON.stringify(progress)); } catch (e) {} }
  function isDone(libId) { return !!progress[libId]; }

  /* favorites in localStorage (per viewer) */
  var favs = (function () {
    try { return new Set(JSON.parse(localStorage.getItem('afu_favs') || '[]')); }
    catch (e) { return new Set(); }
  })();
  function saveFavs() { try { localStorage.setItem('afu_favs', JSON.stringify(Array.from(favs))); } catch (e) {} }

  /* bookmarked lessons — these live on the server, so they follow the member
     between devices (unlike favorites and progress, which stay local). */
  var bookmarks = [], bookmarkIds = {};
  function setBookmarks(list) {
    bookmarks = list || [];
    bookmarkIds = {};
    bookmarks.forEach(function (b) { bookmarkIds[b.lessonId] = true; });
    updateBookmarkCount();
  }
  function isBookmarked(libId) { return !!bookmarkIds[libId]; }
  function updateBookmarkCount() {
    var el = document.getElementById('cnt-bookmarks');
    if (el) el.textContent = bookmarks.length;
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function hue(s){var h=0;s=String(s||'x');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;}

  /* ---------------- data ---------------- */
  function boot() {
    Promise.all([
      fetch('/api/library/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{groups:{}};}),
      fetch('/api/content/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{groups:{}};}),
      fetch('/api/courses/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{courses:[]};}),
      fetch('/api/bookmarks/list', { credentials:'same-origin' }).then(function(r){return r.ok?r.json():{bookmarks:[]};})
    ]).then(function (arr) {
      var lib = arr[0].groups || {};
      LIB_ORDER.forEach(function(k){ (lib[k]||[]).forEach(function(it){ it.kind=k; all.push(it); }); });
      Object.keys(lib).forEach(function(k){ if(LIB_ORDER.indexOf(k)<0 && k!=='lesson')(lib[k]||[]).forEach(function(it){it.kind=k;all.push(it);}); });
      downloads = arr[1].groups || {};
      courses = arr[2].courses || [];
      setBookmarks(arr[3].bookmarks || []);

      counts = {};
      all.forEach(function(it){ counts[it.kind]=(counts[it.kind]||0)+1; });
      var dlTotal = 0; Object.keys(downloads).forEach(function(k){ dlTotal += downloads[k].length; });
      counts.downloads = dlTotal;

      LIB_ORDER.forEach(function(k){ var el=document.getElementById('cnt-'+k); if(el) el.textContent = counts[k]||0; });
      // Routines are bought separately, and the catalogue query already hides
      // them from anyone without the entitlement. So an empty count is the
      // signal to hide the nav entry as well — otherwise every member sees a
      // section in their sidebar that opens on nothing.
      var navRoutine = document.getElementById('nav-routine');
      if (navRoutine) navRoutine.hidden = !(counts.routine > 0);
      document.getElementById('cnt-downloads').textContent = dlTotal;
      document.getElementById('cnt-courses').textContent = courses.length || '';
      updateFavCount();

      wireNav();
      wirePlayer();
      routeFromHash();
    }).catch(function(){
      document.getElementById('content').innerHTML = '<p class="empty" style="color:#fca5a5">Could not load your library. Please refresh.</p>';
    });
  }

  function updateFavCount(){ document.getElementById('cnt-fav').textContent = favs.size; }

  /* ---------------- navigation ---------------- */
  function wireNav() {
    [].forEach.call(document.querySelectorAll('.nav'), function (n) {
      n.addEventListener('click', function () { location.hash = n.getAttribute('data-view'); closeNav(); });
    });
    window.addEventListener('hashchange', routeFromHash);
  }
  function routeFromHash() {
    var raw = (location.hash || '#dashboard').slice(1);
    var navKey = raw;
    if (raw.indexOf('course-') === 0) { navKey = 'courses'; view = raw; }
    else {
      if (raw !== 'dashboard' && raw !== 'downloads' && raw !== 'favorites' && raw !== 'bookmarks' && raw !== 'courses' && raw !== 'request' && !KINDS[raw]) raw = 'dashboard';
      view = raw; navKey = raw;
    }
    [].forEach.call(document.querySelectorAll('.nav'), function (n) {
      n.classList.toggle('active', n.getAttribute('data-view') === navKey);
    });
    document.querySelector('.content').scrollTop = 0;
    window.scrollTo(0, 0);
    render();
  }

  /* ---------------- card rendering ---------------- */

  // Prompt cards only. A prompt has nothing to show a picture of, so its card
  // used to be a speech-balloon emoji at 2.5rem, which read as a placeholder.
  // The other libraries' glyphs are doing their job and are left alone.
  var KIND_COLORS = {
    prompt: ['#f472b6', '#a78bfa', '#38bdf8'],
    routine: ['#ffb020', '#ff7a1a', '#f87171']
  };

  // A fan of dots, widest at the top, tapering to a two-dot tail — drawn rather
  // than shipped as seven image files, so it stays crisp and costs nothing.
  var MARK_ROWS = [5, 7, 7, 6, 4, 2, 1, 1];

  function kindMark(kind) {
    var c = KIND_COLORS[kind] || ['#a1a1aa', '#71717a', '#52525b'];
    var id = 'km' + kind.replace(/[^a-z]/g, '');
    var step = 13, r = 4.1, cols = 7, dots = '';
    for (var row = 0; row < MARK_ROWS.length; row++) {
      var n = MARK_ROWS[row];
      var offset = (cols - n) / 2;
      for (var i = 0; i < n; i++) {
        var cx = 8 + (offset + i) * step;
        var cy = 8 + row * step;
        // fade the tail so the shape reads as one object
        var o = row >= 5 ? 0.75 : 1;
        dots += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r +
          '" fill="url(#' + id + ')" opacity="' + o + '"/>';
      }
    }
    return '<svg viewBox="0 0 106 118" aria-hidden="true">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0.6" y2="1">' +
        '<stop offset="0" stop-color="' + c[0] + '"/>' +
        '<stop offset="0.5" stop-color="' + c[1] + '"/>' +
        '<stop offset="1" stop-color="' + c[2] + '"/>' +
      '</linearGradient></defs>' + dots + '</svg>';
  }

  function cardHTML(it) {
    var k = KINDS[it.kind] || { label: it.kind, glyph: '📦' };
    var h = hue(it.category || it.kind);
    var dots = '<span class="dots"><i class="d-r"></i><i class="d-y"></i><i class="d-g"></i></span>';
    var head;
    if (it.thumb) {
      head = '<div class="head" style="background-image:url(\'' + it.thumb + '\')">' + dots + favBtn(it) + '</div>';
    } else if (it.kind === 'prompt') {
      // Only the prompt library gets the drawn mark. Everywhere else the glyph
      // already reads clearly, and one shape in seven colours would say less
      // than seven different glyphs do.
      head = '<div class="head hmark">' + dots +
        '<span class="kmark">' + kindMark(it.kind) + '<span class="klabel">' + esc(k.one || k.label) + '</span></span>' +
        favBtn(it) + '</div>';
    } else {
      head = '<div class="head" style="background:linear-gradient(135deg,hsl(' + h + ',55%,22%),hsl(' + ((h + 40) % 360) + ',50%,12%))">' +
        dots + '<span class="glyph">' + k.glyph + '</span>' + favBtn(it) + '</div>';
    }
    return '<div class="card" data-id="' + esc(it.id) + '">' + head +
      '<div class="body">' +
        '<div class="cat">' + esc(it.category || k.label) + '</div>' +
        '<h3>' + esc(it.title) + '</h3>' +
        (it.description ? '<p>' + esc(it.description) + '</p>' : '') +
      '</div></div>';
  }
  function favBtn(it){ return '<button class="fav ' + (favs.has(it.id)?'on':'') + '" data-fav="' + esc(it.id) + '" aria-label="Favorite">' + (favs.has(it.id)?'♥':'♡') + '</button>'; }

  function bindCards(scope) {
    [].forEach.call(scope.querySelectorAll('.card'), function (c) {
      c.addEventListener('click', function (e) {
        if (e.target.closest('.fav')) return;
        openItem(c.getAttribute('data-id'));
      });
    });
    [].forEach.call(scope.querySelectorAll('.fav'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.getAttribute('data-fav');
        if (favs.has(id)) { favs.delete(id); b.classList.remove('on'); b.textContent='♡'; }
        else { favs.add(id); b.classList.add('on'); b.textContent='♥'; }
        saveFavs(); updateFavCount();
        if (view === 'favorites') render();
      });
    });
  }

  function gridOf(items) {
    if (!items.length) return '<p class="empty">Nothing here yet.</p>';
    return '<div class="grid">' + items.map(cardHTML).join('') + '</div>';
  }

  /* ---------------- views ---------------- */
  function render() {
    var c = document.getElementById('content');
    if (q) { renderSearch(c); return; }
    if (view === 'dashboard') return renderDashboard(c);
    if (view === 'downloads') return renderDownloads(c);
    if (view === 'favorites') return renderFavorites(c);
    if (view === 'bookmarks') return renderBookmarks(c);
    if (view === 'request') return renderRequest(c);
    if (view === 'courses') return renderCourses(c);
    if (view.indexOf('course-') === 0) return renderCourseDetail(c, view.slice('course-'.length));
    return renderKind(c, view);
  }

  function renderDashboard(c) {
    // Use the name they gave at checkout, which /api/me already sends — this
    // was picking the email apart instead, which is how a member ends up
    // greeted as "Owenclaudia88". First name only: it is a hello, not a
    // letterhead. Anyone with no stored name still gets the tidied email
    // local-part, because that is what displayNameFor falls back to.
    var name = String(me.name || '').trim().split(/\s+/)[0] || '';
    var html = '<h1 class="page-h">Welcome back' + (name ? ', ' + esc(name) : '') + '.</h1>' +
      '<p class="page-sub">You have full access to everything — courses, plugins, and the full content library.</p>';

    html += '<div class="banner"><div class="bic">🧩</div><div style="min-width:200px;flex:1">' +
      '<h3>Your Specialists &amp; Plugins are ready</h3>' +
      '<p>Download the 70 AI Specialists and every plugin pack, then install them in Claude.</p>' +
      '</div><a class="dl" href="#downloads" style="align-self:center">Go to downloads</a></div>';

    // category tiles — Courses first, then each content library
    html += '<div class="sec-h first"><h2>Explore your library</h2></div><div class="tiles">';
    if (courses.length) {
      var totalLessons = courses.reduce(function (n, c2) { return n + (c2.lessonCount || 0); }, 0);
      html += '<div class="tile" data-goto="courses"><div class="tic">🎓</div>' +
        '<h3>Courses</h3><div class="tc">' + courses.length + ' courses · ' + totalLessons + ' lessons</div></div>';
    }
    LIB_ORDER.forEach(function (k) {
      if (!counts[k]) return;
      html += '<div class="tile" data-goto="' + k + '"><div class="tic">' + KINDS[k].glyph + '</div>' +
        '<h3>' + esc(KINDS[k].label) + '</h3><div class="tc">' + counts[k] + ' items</div></div>';
    });
    html += '</div>';

    // recently added — items that have thumbnails look best here
    var featured = all.filter(function (it) { return it.thumb; }).slice(0, 8);
    if (featured.length) {
      html += '<div class="sec-h"><h2>Featured</h2><span class="c">from your library</span></div>' + gridOf(featured);
    }
    c.innerHTML = html;
    [].forEach.call(c.querySelectorAll('.tile'), function (t) {
      t.addEventListener('click', function () { location.hash = t.getAttribute('data-goto'); });
    });
    bindCards(c);
  }

  /* ---------------- library search, sort and filters ---------------- */
  var LIB_SORTS = [['new','Newest to Oldest'],['old','Oldest to Newest'],['fav','Most Favorited'],['az','A – Z'],['za','Z – A']];
  var libState = {};                       // per library, so switching tabs keeps your place
  function libSt(kind) { return libState[kind] || (libState[kind] = { q: '', sort: 'new', cats: [], page: 1 }); }
  var PER_PAGE = 48;   // matches the source library

  // Every label an item can be filtered by: its category plus its own tags.
  function labelsOf(it) {
    var out = it.category ? [it.category] : [];
    (it.tags || []).forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });
    return out;
  }

  function libApply(items, st) {
    var out = items;
    if (st.q) {
      var q = st.q.toLowerCase();
      out = out.filter(function (it) {
        return (it.title + ' ' + (it.description || '') + ' ' + labelsOf(it).join(' ')).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (st.cats.length) {
      out = out.filter(function (it) {
        var l = labelsOf(it);
        return st.cats.some(function (c) { return l.indexOf(c) >= 0; });
      });
    }
    var t = function (x) { return x.createdAt ? new Date(x.createdAt).getTime() : 0; };
    var by = {
      new: function (a, b) { return t(b) - t(a); },
      old: function (a, b) { return t(a) - t(b); },
      fav: function (a, b) { return (b.likes || 0) - (a.likes || 0); },
      az:  function (a, b) { return String(a.title).localeCompare(String(b.title)); },
      za:  function (a, b) { return String(b.title).localeCompare(String(a.title)); }
    }[st.sort] || null;
    return by ? out.slice().sort(by) : out;
  }

  function renderKind(c, kind) {
    var meta = KINDS[kind] || { label: kind };
    var items = all.filter(function (it) { return it.kind === kind; });
    var st = libSt(kind);

    var html = '<h1 class="page-h">' + esc(meta.label) + '</h1>' +
      '<p class="page-sub">' + items.length + ' items in your library.</p>' +
      '<div class="lib-bar">' +
        '<span class="lib-search"><span class="ic">🔍</span>' +
        '<input id="lib-q" type="search" placeholder="Search ' + esc((meta.label || '').toLowerCase()) + '…" autocomplete="off" value="' + esc(st.q) + '"></span>' +
        '<span class="lib-sort"><select id="lib-sort">' +
          LIB_SORTS.map(function (o) { return '<option value="' + o[0] + '"' + (st.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
        '</select><span class="ar">▾</span></span>' +
        '<button class="lib-btn' + (st.cats.length ? ' on' : '') + '" id="lib-filter">⚑ Filter' +
          (st.cats.length ? '<span class="n">' + st.cats.length + '</span>' : '') + '</button>' +
        '<span class="lib-count" id="lib-count"></span>' +
      '</div><div id="lib-grid"></div>';
    c.innerHTML = html;

    // Only the grid is redrawn as you type, so the search box keeps focus.
    function paint() {
      var shown = libApply(items, st);
      var pages = Math.max(1, Math.ceil(shown.length / PER_PAGE));
      if (st.page > pages) st.page = pages;
      if (st.page < 1) st.page = 1;
      var from = (st.page - 1) * PER_PAGE;
      var page = shown.slice(from, from + PER_PAGE);

      var g = document.getElementById('lib-grid');
      if (!shown.length) {
        g.innerHTML = '<p class="empty">Nothing matches those filters.</p>';
      } else {
        // One flat grid. Grouping by category used to split a page of 48 into a
        // dozen headings, several of them holding a single card, which left the
        // rows ragged and full of gaps. The category is on every card and in
        // the filter, so the headings were not carrying their weight.
        g.innerHTML = gridOf(page) + pagerHTML(shown.length, pages, st.page, from, page.length);
      }
      document.getElementById('lib-count').textContent =
        shown.length === items.length ? '' : shown.length + ' of ' + items.length;
      bindCards(g);
      bindPager(g, pages, paint, st);
    }
    paint();

    var qEl = document.getElementById('lib-q'), qT;
    qEl.addEventListener('input', function () {
      clearTimeout(qT);
      qT = setTimeout(function () { st.q = qEl.value.trim(); st.page = 1; paint(); }, 140);
    });
    document.getElementById('lib-sort').addEventListener('change', function (e) { st.sort = e.target.value; st.page = 1; paint(); });
    document.getElementById('lib-filter').addEventListener('click', function () { openFilter(kind, items, st, function () { render(); }); });
  }

  /* ---------------- pagination ---------------- */
  // Which page buttons to show: always the first and last, the current one and
  // its neighbours, and an ellipsis for whatever the gap swallows.
  function pageWindow(page, pages) {
    // Few enough to list in full — windowing here produced gaps like "1 2 4",
    // which reads as a missing page rather than a shortened list.
    if (pages <= 7) {
      var all = [];
      for (var i = 1; i <= pages; i++) all.push(i);
      return all;
    }
    var out = [], push = function (p) { if (out[out.length - 1] !== p) out.push(p); };
    push(1);
    if (page - 1 > 2) push('…');
    for (var p = Math.max(2, page - 1); p <= Math.min(pages - 1, page + 1); p++) push(p);
    if (page + 1 < pages - 1) push('…');
    push(pages);
    return out;
  }

  function pagerHTML(total, pages, page, from, count) {
    if (total <= PER_PAGE) return '';
    var btns = pageWindow(page, pages).map(function (p) {
      return p === '…'
        ? '<span class="of">…</span>'
        : '<button class="pg' + (p === page ? ' now' : '') + '" data-page="' + p + '">' + p + '</button>';
    }).join('');
    return '<div class="pager">' +
      '<span class="showing">Showing ' + (from + 1) + '–' + (from + count) + ' of ' + total + ' items</span>' +
      '<span class="ctrls">' +
        '<button class="pg" data-page="1"' + (page === 1 ? ' disabled' : '') + ' aria-label="First">&laquo;</button>' +
        '<button class="pg" data-page="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>Previous</button>' +
        btns +
        '<button class="pg" data-page="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + '>Next</button>' +
        '<button class="pg" data-page="' + pages + '"' + (page === pages ? ' disabled' : '') + ' aria-label="Last">&raquo;</button>' +
        '<span class="goto">Go to <input type="number" min="1" max="' + pages + '" id="pg-go" placeholder="#"></span>' +
      '</span></div>';
  }

  function bindPager(scope, pages, paint, st) {
    [].forEach.call(scope.querySelectorAll('[data-page]'), function (b) {
      b.addEventListener('click', function () {
        var p = Number(b.getAttribute('data-page'));
        if (!p || p < 1 || p > pages || p === st.page) return;
        st.page = p;
        paint();
        // a new page starts at the top of the list, not wherever you were
        var bar = document.querySelector('.lib-bar');
        if (bar) bar.scrollIntoView({ block: 'start' });
      });
    });
    var go = scope.querySelector('#pg-go');
    if (go) go.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var p = Number(go.value);
      if (!p || p < 1 || p > pages) { go.value = ''; return; }
      st.page = p; paint();
      var bar = document.querySelector('.lib-bar');
      if (bar) bar.scrollIntoView({ block: 'start' });
    });
  }

  /* ---------------- filter dialog ---------------- */
  var filEl = document.getElementById('fil');
  function openFilter(kind, items, st, done) {
    var counts = {};
    items.forEach(function (it) { labelsOf(it).forEach(function (l) { counts[l] = (counts[l] || 0) + 1; }); });
    var labels = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
    var chosen = st.cats.slice();

    document.getElementById('fil-title').textContent = 'Filter ' + ((KINDS[kind] || {}).label || kind);
    var body = document.getElementById('fil-body');
    body.innerHTML = '<div class="fil-sec">Categories &amp; tags</div><div class="fil-list">' +
      labels.map(function (l) {
        return '<span class="fil-opt' + (chosen.indexOf(l) >= 0 ? ' on' : '') + '" data-l="' + esc(l) + '">' +
          esc(l) + '<span class="c">' + counts[l] + '</span></span>';
      }).join('') + '</div>';

    function matching() {
      return chosen.length
        ? items.filter(function (it) { var l = labelsOf(it); return chosen.some(function (c) { return l.indexOf(c) >= 0; }); }).length
        : items.length;
    }
    function refresh() {
      document.getElementById('fil-apply').textContent = 'Apply filters (' + matching() + ')';
    }
    [].forEach.call(body.querySelectorAll('.fil-opt'), function (o) {
      o.addEventListener('click', function () {
        var l = o.getAttribute('data-l'), i = chosen.indexOf(l);
        if (i >= 0) { chosen.splice(i, 1); o.classList.remove('on'); }
        else { chosen.push(l); o.classList.add('on'); }
        refresh();
      });
    });
    refresh();

    filEl.classList.add('show');
    document.getElementById('fil-clear').onclick = function () {
      chosen = [];
      [].forEach.call(body.querySelectorAll('.fil-opt'), function (o) { o.classList.remove('on'); });
      refresh();
    };
    document.getElementById('fil-apply').onclick = function () {
      st.cats = chosen; st.page = 1; filEl.classList.remove('show'); done();
    };
  }
  document.getElementById('fil-x').addEventListener('click', function () { filEl.classList.remove('show'); });
  filEl.addEventListener('click', function (e) { if (e.target === filEl) filEl.classList.remove('show'); });

  function renderDownloads(c) {
    var html = '<h1 class="page-h">Specialists &amp; Plugins</h1>' +
      '<p class="page-sub">Download your products, then install them in Claude.</p>';
    var order = ['plugin', 'powerup', 'course'];
    var kinds = Object.keys(downloads).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    if (!kinds.length) { c.innerHTML = html + '<p class="empty">No downloads yet.</p>'; return; }
    kinds.forEach(function (kind) {
      var m = DL_META[kind] || { label: kind, glyph: '📦', blurb: '' };
      var items = downloads[kind];
      html += '<div class="sec-h"><h2>' + m.glyph + ' ' + esc(m.label) + '</h2><span class="c">' + items.length + '</span></div>';
      html += '<div class="grid">';
      items.forEach(function (it) {
        html += '<div class="card" style="cursor:default">' +
          '<div class="head" style="background:linear-gradient(135deg,#2a1a08,#161016)"><span class="dots"><i class="d-r"></i><i class="d-y"></i><i class="d-g"></i></span><span class="glyph">' + m.glyph + '</span></div>' +
          '<div class="body"><div class="cat">' + esc(m.label) + '</div><h3>' + esc(it.title) + '</h3>' +
          '<p>' + esc(it.filename || '') + (it.sizeBytes ? ' · ' + kb(it.sizeBytes) : '') + '</p>' +
          '<div class="foot"><a class="dl" href="/api/content/download?key=' + encodeURIComponent(it.key) + '">Download</a></div>' +
          '</div></div>';
      });
      html += '</div>';
    });
    c.innerHTML = html;
  }

  function renderFavorites(c) {
    var items = all.filter(function (it) { return favs.has(it.id); });
    var html = '<h1 class="page-h">Favorites</h1>' +
      '<p class="page-sub">' + items.length + ' saved item' + (items.length === 1 ? '' : 's') + '.</p>';
    html += items.length ? gridOf(items)
      : '<p class="empty">No favorites yet. Tap the heart on any card to save it here.</p>';
    c.innerHTML = html;
    bindCards(c);
  }

  function renderBookmarks(c) {
    var html = '<h1 class="page-h">Bookmarks</h1>' +
      '<p class="page-sub">' + bookmarks.length + ' saved lesson' + (bookmarks.length === 1 ? '' : 's') +
      ' — pick up where you left off.</p>';
    if (!bookmarks.length) {
      c.innerHTML = html + '<p class="empty">No bookmarks yet. Open a lesson and tap the bookmark icon to save it here.</p>';
      return;
    }
    var byCourse = {};
    bookmarks.forEach(function (b) { (byCourse[b.course] ||= []).push(b); });
    Object.keys(byCourse).forEach(function (slug) {
      var co = courses.filter(function (x) { return x.slug === slug; })[0];
      var name = (co && co.title) || COURSE_NAMES[slug] || slug;
      html += '<div class="sec-h"><h2>' + esc(name) + '</h2><span class="c">' + byCourse[slug].length + '</span></div>' +
        '<div class="section">';
      byCourse[slug].forEach(function (b) {
        html += '<div class="bm-row" data-slug="' + esc(slug) + '" data-lesson="' + esc(b.lessonId) + '">' +
          '<span class="bi">🔖</span><span class="bt">' + esc(b.title || b.lessonId) + '</span>' +
          '<button class="bx" data-remove="' + esc(b.lessonId) + '">Remove</button></div>';
      });
      html += '</div>';
    });
    c.innerHTML = html;
    [].forEach.call(c.querySelectorAll('.bm-row'), function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('.bx')) return;
        openLessonById(row.getAttribute('data-slug'), row.getAttribute('data-lesson'));
      });
    });
    [].forEach.call(c.querySelectorAll('.bx'), function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); removeBookmark(b.getAttribute('data-remove')); });
    });
  }

  function postBookmark(lessonId, slug, title) {
    return fetch('/api/bookmarks/toggle', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lessonId: lessonId, course: slug, title: title })
    }).then(function (r) { return r.ok ? r.json() : null; });
  }

  function removeBookmark(lessonId) {
    var bm = bookmarks.filter(function (x) { return x.lessonId === lessonId; })[0];
    if (!bm) return;
    postBookmark(lessonId, bm.course, bm.title).then(function (d) {
      if (!d) return;
      delete bookmarkIds[lessonId];
      bookmarks = bookmarks.filter(function (x) { return x.lessonId !== lessonId; });
      updateBookmarkCount();
      if (view === 'bookmarks') render();
    });
  }

  /* ---------------- request content ---------------- */
  function statusPill(st) {
    return '<span class="st ' + esc(st) + '">' + esc(st) + '</span>';
  }

  function renderRequest(c) {
    c.innerHTML = '<h1 class="page-h">Request Content</h1>' +
      '<p class="page-sub">Tell us what prompts, tutorials or resources you would like to see.</p>' +
      '<div class="req-card">' +
        '<h2>Submit a content request</h2>' +
        '<p class="sub">We read every request and prioritise by how many people ask.</p>' +
        '<div id="req-ok"></div>' +
        '<div class="req-f"><label for="req-title">Title</label>' +
          '<input id="req-title" type="text" maxlength="100" placeholder="e.g. LinkedIn post generator for B2B SaaS">' +
          '<div class="hint"><span>Brief title for your request</span><span id="req-tc">0/100</span></div></div>' +
        '<div class="req-f"><label for="req-body">Description</label>' +
          '<textarea id="req-body" maxlength="1000" placeholder="Describe what you are looking for. What problem are you trying to solve? What kind of content would help?"></textarea>' +
          '<div class="hint"><span></span><span id="req-bc">0/1000</span></div></div>' +
        '<button class="req-send" id="req-send" disabled>Submit request</button>' +
      '</div>' +
      '<div class="req-mine" id="req-mine"></div>';

    var t = document.getElementById('req-title'), b = document.getElementById('req-body'),
        send = document.getElementById('req-send');
    function tick() {
      document.getElementById('req-tc').textContent = t.value.length + '/100';
      document.getElementById('req-bc').textContent = b.value.length + '/1000';
      send.disabled = !t.value.trim();
    }
    t.addEventListener('input', tick); b.addEventListener('input', tick); tick();

    send.addEventListener('click', function () {
      send.disabled = true; send.textContent = 'Sending…';
      fetch('/api/requests/create', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: t.value.trim(), body: b.value.trim() })
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          send.textContent = 'Submit request';
          if (!d) { alert('Could not send that request. Please try again.'); tick(); return; }
          document.getElementById('req-ok').innerHTML =
            '<div class="req-ok">Thanks — your request is in. You can track it below.</div>';
          t.value = ''; b.value = ''; tick();
          loadMine();
        })
        .catch(function () { send.textContent = 'Submit request'; tick(); });
    });

    function loadMine() {
      fetch('/api/requests/list', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : { requests: [] }; })
        .then(function (d) {
          var rows = d.requests || [];
          var el = document.getElementById('req-mine');
          if (!rows.length) { el.innerHTML = ''; return; }
          el.innerHTML = '<div class="sec-h"><h2>Your requests</h2><span class="c">' + rows.length + '</span></div>' +
            rows.map(function (r) {
              return '<div class="req-row"><span class="rt"><b>' + esc(r.title) + '</b>' +
                (r.body ? '<p>' + esc(r.body) + '</p>' : '') + '</span>' + statusPill(r.status) + '</div>';
            }).join('');
        });
    }
    loadMine();
  }

  /* ---------------- courses ---------------- */
  function sectionHeading(name, idx) {
    return /^section\s*\d+/i.test(name || '') ? name : ('SECTION ' + (idx + 1) + ' · ' + (name || ('Section ' + (idx + 1))));
  }
  function fmtTime(min) {
    if (!min) return '';
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + ' hr ' : '') + (m ? m + ' min' : (h ? '' : '0 min'));
  }
  function doneForSlug(slug) {
    var pre = 'lesson:c-' + slug + '-sections';
    var n = 0;
    for (var k in progress) { if (progress[k] && k.indexOf(pre) === 0) n++; }
    return n;
  }

  function renderCourses(c) {
    var html = '<h1 class="page-h">Courses</h1>' +
      '<p class="page-sub">Work through every course — video lessons, step by step.</p>';
    if (!courses.length) { c.innerHTML = html + '<p class="empty">Your courses are being set up — check back shortly.</p>'; return; }
    html += '<div class="course-grid">';
    courses.forEach(function (co) {
      var st = co.stats || {};
      var total = co.lessonCount || st.lessons || 0;
      var done = doneForSlug(co.slug);
      var pct = total ? Math.round(done / total * 100) : 0;
      var meta = (co.sectionCount || st.sections || 0) + ' sections · ' + total + ' lessons' + (st.minutes ? ' · ' + fmtTime(st.minutes) : '');
      html += '<div class="course-card" data-slug="' + esc(co.slug) + '">' +
        '<div class="cc-top"><span class="g">🎓</span><span class="cc-prog" style="width:' + pct + '%"></span></div>' +
        '<div class="cc-body"><h3>' + esc(co.title) + '</h3>' +
        '<div class="cc-meta">' + esc(meta) + '</div>' +
        '<div class="cc-bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="cc-meta" style="margin-top:0">' + done + ' of ' + total + ' completed</div>' +
        '</div></div>';
    });
    html += '</div>';
    c.innerHTML = html;
    [].forEach.call(c.querySelectorAll('.course-card'), function (card) {
      card.addEventListener('click', function () { location.hash = 'course-' + card.getAttribute('data-slug'); });
    });
  }

  function loadCourse(slug) {
    if (courseCache[slug]) return Promise.resolve(courseCache[slug]);
    return fetch('/api/courses/get?slug=' + encodeURIComponent(slug), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (tree) { if (tree) courseCache[slug] = tree; return tree; });
  }

  function openLessonById(slug, lessonId) {
    loadCourse(slug).then(function (tree) {
      if (!tree) return;
      var flat = flatLessons(tree), idx = 0;
      for (var i = 0; i < flat.length; i++) { if (flat[i].libId === lessonId) { idx = i; break; } }
      openLesson(slug, idx);
    });
  }

  function flatLessons(tree) {
    var flat = [];
    (tree.sections || []).forEach(function (s, si) {
      (s.lessons || []).forEach(function (l) {
        // hasVideo has to come along: the player reads it off the flattened
        // lesson, and leaving it behind here showed every lesson as
        // "coming soon" however well the signing worked.
        flat.push({ libId: l.libId, title: l.title, duration: l.duration, hasVideo: !!l.hasVideo,
                    aspect: l.aspect || null, clips: l.clips || [],
                    sectionName: s.name, sectionIdx: si });
      });
    });
    return flat;
  }

  function renderCourseDetail(c, slug) {
    c.innerHTML = '<p class="empty">Loading course…</p>';
    loadCourse(slug).then(function (tree) {
      if (!tree) { c.innerHTML = '<p class="empty">Could not load this course.</p>'; return; }
      var flat = flatLessons(tree);
      var total = flat.length;
      var done = flat.filter(function (l) { return isDone(l.libId); }).length;
      var pct = total ? Math.round(done / total * 100) : 0;
      var st = tree.stats || {};

      var html = '<button class="cd-back" id="cd-back">&larr; All courses</button>' +
        '<h1 class="page-h">' + esc(tree.title) + '</h1>' +
        '<p class="page-sub">' + (st.sections || (tree.sections || []).length) + ' sections · ' + total + ' lessons' +
        (st.minutes ? ' · ' + fmtTime(st.minutes) : '') + '</p>' +
        '<div class="cd-prog"><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="lbl">Completed ' + done + ' of ' + total + ' lessons · ' + pct + '%</span></div>';

      var gi = 0;
      (tree.sections || []).forEach(function (s, si) {
        var secLessons = s.lessons || [];
        var secMin = secLessons.reduce(function (n, l) { var m = /^(\d{1,2}):(\d{2})$/.exec(l.duration || ''); return n + (m ? (+m[1]) * 60 + (+m[2]) : 0); }, 0);
        html += '<div class="section" data-si="' + si + '">' +
          '<div class="section-h"><div><div class="st">' + esc(sectionHeading(s.name, si)) + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:14px">' +
          '<span class="sm">' + secLessons.length + ' lesson' + (secLessons.length === 1 ? '' : 's') + (secMin ? ' • ' + Math.round(secMin / 60) + ' min' : '') + '</span>' +
          '<span class="chev">▾</span></div></div>' +
          '<div class="lessons">';
        secLessons.forEach(function (l) {
          var idx = gi++;
          html += '<div class="lrow ' + (isDone(l.libId) ? 'done' : '') + '" data-idx="' + idx + '">' +
            '<span class="lc">' + (isDone(l.libId) ? '✓' : '') + '</span>' +
            '<span class="lt">' + esc(l.title) + '</span>' +
            '<span class="ld">' + esc(l.duration || '') + '</span></div>';
        });
        html += '</div></div>';
      });
      c.innerHTML = html;

      document.getElementById('cd-back').addEventListener('click', function () { location.hash = 'courses'; });
      [].forEach.call(c.querySelectorAll('.section-h'), function (h) {
        h.addEventListener('click', function () { h.parentElement.classList.toggle('collapsed'); });
      });
      [].forEach.call(c.querySelectorAll('.lrow'), function (row) {
        row.addEventListener('click', function () { openLesson(slug, Number(row.getAttribute('data-idx'))); });
      });
    });
  }

  /* ---------------- lesson player ---------------- */
  var playerEl = document.getElementById('player');
  var curCourseSlug = null, curFlat = [], curIdx = 0;

  function wirePlayer() {
    document.getElementById('pl-back').addEventListener('click', closePlayer);
    document.getElementById('pl-prev').addEventListener('click', function () { if (curIdx > 0) gotoLesson(curIdx - 1); });
    document.getElementById('pl-next').addEventListener('click', function () { if (curIdx < curFlat.length - 1) gotoLesson(curIdx + 1); });
    document.getElementById('pl-complete').addEventListener('click', completeLesson);
    document.getElementById('pl-menu-btn').addEventListener('click', function () { playerEl.classList.toggle('menu-open'); });
    document.getElementById('pt-comments').addEventListener('click', toggleComments);
    document.getElementById('pt-wide').addEventListener('click', toggleWide);
    document.getElementById('pt-bookmark').addEventListener('click', toggleBookmarkCurrent);
    document.getElementById('plc-x').addEventListener('click', closeComments);
    document.getElementById('plc-send').addEventListener('click', submitComment);
    document.getElementById('plc-text').addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submitComment();
    });
    try { if (localStorage.getItem('afu_wide') === '1') setWide(true); } catch (e) {}
    document.getElementById('pl-side-x').addEventListener('click', function () { playerEl.classList.remove('menu-open'); });
    document.addEventListener('keydown', function (e) {
      if (!playerEl.classList.contains('show')) return;
      var t = e.target, tag = t && t.tagName;
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable);
      if (e.key === 'Escape') {
        if (typing) { t.blur(); return; }
        if (playerEl.classList.contains('comments-open')) closeComments();
        else closePlayer();
      }
      else if (typing) return;
      else if (e.key === 'ArrowLeft' && curIdx > 0) gotoLesson(curIdx - 1);
      else if (e.key === 'ArrowRight' && curIdx < curFlat.length - 1) gotoLesson(curIdx + 1);
    });
  }

  function openLesson(slug, idx) {
    loadCourse(slug).then(function (tree) {
      if (!tree) return;
      curCourseSlug = slug;
      curFlat = flatLessons(tree);
      document.getElementById('pl-course-title').textContent = tree.title;
      document.getElementById('plc-name').hidden = me.hasName;
      loadComments(slug, true);
      playerEl.classList.add('show');
      document.body.style.overflow = 'hidden';
      gotoLesson(idx);
    });
  }

  function closePlayer() {
    playerEl.classList.remove('show');
    playerEl.classList.remove('menu-open');
    document.body.style.overflow = '';
    // stop playback and release the stream — the player is only hidden, so a
    // video left mounted would keep downloading and talking over the page
    teardownVideo();
    // refresh the course detail so progress ticks update
    if (curCourseSlug && view === 'course-' + curCourseSlug) render();
  }

  /* ---------------- lesson video ---------------- */
  // Videos are served from Bunny Stream as HLS and played in our own <video>,
  // not an embedded player. The URL is signed per member and expires, so it is
  // fetched when the lesson opens rather than baked into the page.

  var HLS_SRC = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
  var hlsReady = null;
  function loadHls() {
    // Safari plays HLS natively, so most iPhones never download this at all.
    if (window.Hls) return Promise.resolve(true);
    if (hlsReady) return hlsReady;
    hlsReady = new Promise(function (done) {
      var s = document.createElement('script');
      s.src = HLS_SRC;
      s.onload = function () { done(!!window.Hls); };
      s.onerror = function () { done(false); };
      document.head.appendChild(s);
    });
    return hlsReady;
  }

  // Every live Hls instance — the lesson's own video and any inside its body.
  // All of them keep downloading until destroyed, so all of them get torn down.
  var hlsPool = [];
  var videoGen = 0;       // guards against a slow response for a lesson we left

  function teardownVideo() {
    videoGen++;
    hlsPool.forEach(function (h) { try { h.destroy(); } catch (e) {} });
    hlsPool = [];
    var box = document.getElementById('pl-video');
    if (box) {
      box.innerHTML = '';
      // back to the default shape, or the next lesson inherits this one's
      box.style.aspectRatio = '';
    }
  }

  function videoMessage(text) {
    return '<div class="video-ph"><div class="pbtn">▶</div>' +
      '<div class="pmsg">' + esc(text) + '</div></div>';
  }

  function mountVideo(lesson) {
    teardownVideo();
    var mine = videoGen;
    var box = document.getElementById('pl-video');
    // Some lessons are written pieces, or carry their videos inline in the
    // body instead. Showing them an empty frame implies something failed to
    // load, so take the frame away entirely rather than apologise in it.
    if (!lesson || !lesson.hasVideo) { box.style.display = 'none'; box.innerHTML = ''; return; }

    box.style.display = '';
    // Set the frame to the video's shape before anything loads. The shape came
    // down with the course tree precisely so the frame never has to be drawn
    // at 16:9 first and corrected a moment later.
    if (lesson.aspect) box.style.aspectRatio = String(lesson.aspect);
    box.innerHTML = videoMessage('Loading video…');
    fetch('/api/video/sign?lesson=' + encodeURIComponent(lesson.libId), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) {
        if (mine !== videoGen) return;                       // moved on already
        if (!v || !v.url) { box.innerHTML = videoMessage('Video lesson — coming soon'); return; }

        var el = document.createElement('video');
        el.controls = true; el.playsInline = true; el.preload = 'metadata';
        if (v.poster) el.poster = v.poster;
        box.innerHTML = ''; box.appendChild(el);

        // These lessons are screen recordings and almost none of them are 16:9
        // — they run from 1.55 to 1.82. Against a frame fixed at 16:9 the
        // picture is pinned to the top and bottom edges with slivers of black
        // down the sides. Take the shape from the video itself once it is
        // known, so the frame is the video's own shape and its rounded corners
        // belong to the picture rather than cropping it.
        el.addEventListener('loadedmetadata', function () {
          if (mine !== videoGen || !el.videoWidth || !el.videoHeight) return;
          box.style.aspectRatio = el.videoWidth + ' / ' + el.videoHeight;
        });

        // Chrome answers "maybe" to canPlayType for HLS but cannot actually
        // play it — it rejects the source and the video sits at 0:00 with no
        // duration, looking for all the world like a broken stream. So the
        // question to ask is whether Media Source Extensions exist: where they
        // do, hls.js does the work; where they don't (iPhone Safari) the
        // browser plays HLS itself and hls.js is never even downloaded.
        if (!window.MediaSource && !window.ManagedMediaSource) {
          if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = v.url; return; }
          box.innerHTML = videoMessage('This browser cannot play the video.');
          return;
        }
        attachStream(el, v, mine, function (msg) { box.innerHTML = videoMessage(msg); });
      })
      .catch(function () { if (mine === videoGen) box.innerHTML = videoMessage('Video lesson — coming soon'); });
  }

  /**
   * Point a <video> at a signed HLS URL. Shared by the lesson's own video and
   * by the recordings inside a lesson body, which need exactly the same
   * treatment: the token reapplied per request, and hls.js preferred over
   * Chrome's word that it can play HLS natively.
   */
  function attachStream(el, v, mine, onFail) {
    if (!window.MediaSource && !window.ManagedMediaSource) {
      if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = v.url; return; }
      onFail('This browser cannot play the video.');
      return;
    }
    loadHls().then(function (ok) {
      if (mine !== videoGen) return;
      if (!ok || !window.Hls.isSupported()) {
        if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = v.url; return; }
        onFail('Could not load the video player.');
        return;
      }
      var cfg = {
        // Don't fetch more pixels than the screen can show. These are screen
        // recordings watched in a box a few hundred pixels wide, and the
        // bandwidth is billed by the gigabyte.
        capLevelToPlayerSize: true,
        // hls.js assumes 500kbps until it has measured the connection, which
        // starts every lesson at 360p — soft, on recordings whose whole point
        // is legible text — and then climbs a rung at a time. Opening at a
        // more realistic guess starts it sharp; a genuinely slow connection
        // still drops within a fragment or two, because the measurement
        // immediately replaces the guess.
        abrEwmaDefaultEstimate: 3000000
      };
      // The signed query covers the whole video directory, but hls.js
      // resolves each segment relative to the playlist and so drops it —
      // the playlist would load and every segment after it would 403.
      // Put the same token back on each request.
      var qs = v.url.split('?')[1] || '';
      if (qs) {
        var BaseLoader = window.Hls.DefaultConfig.loader;
        cfg.loader = function (c) {
          var l = new BaseLoader(c);
          var load = l.load.bind(l);
          l.load = function (ctx, lcfg, cbs) {
            if (ctx.url.indexOf('token=') === -1) {
              ctx.url += (ctx.url.indexOf('?') === -1 ? '?' : '&') + qs;
            }
            return load(ctx, lcfg, cbs);
          };
          return l;
        };
      }
      var hls = new window.Hls(cfg);
      hlsPool.push(hls);
      hls.loadSource(v.url);
      hls.attachMedia(el);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
        if (mine === videoGen) addQualityMenu(el.parentNode, hls);
      });
      hls.on(window.Hls.Events.ERROR, function (_e, d) {
        // Recoverable stalls happen on flaky connections; only a fatal
        // error is worth replacing the player over.
        if (!d.fatal) return;
        if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); return; }
        if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
        if (mine === videoGen) onFail('This video could not be played.');
      });
    });
  }

  /**
   * A quality picker. The browser's own controls have no such thing — hls.js
   * chooses by bandwidth and there is no way to overrule it — so this adds a
   * small menu over the top-right of the picture: Auto, plus each resolution
   * the stream actually carries.
   */
  function addQualityMenu(wrap, hls) {
    if (!wrap || wrap.querySelector('.q-menu')) return;
    var levels = hls.levels || [];
    if (levels.length < 2) return;      // nothing to choose between

    // highest first, which is the order people expect to read them in
    var order = levels.map(function (l, i) { return { i: i, h: l.height }; })
                      .sort(function (a, b) { return b.h - a.h; });

    var menu = document.createElement('div');
    menu.className = 'q-menu';
    menu.innerHTML =
      '<button type="button" class="q-btn" aria-haspopup="true" aria-expanded="false">Auto</button>' +
      '<div class="q-list" hidden>' +
        '<button type="button" data-level="-1" class="on">Auto</button>' +
        order.map(function (o) {
          return '<button type="button" data-level="' + o.i + '">' + o.h + 'p</button>';
        }).join('') +
      '</div>';
    wrap.appendChild(menu);

    var btn = menu.querySelector('.q-btn');
    var list = menu.querySelector('.q-list');

    // hls.currentLevel reports the level actually playing even when the choice
    // is automatic, so it cannot tell you which mode you are in —
    // autoLevelEnabled is the one that answers that.
    function label() {
      var lv = levels[hls.currentLevel];
      if (hls.autoLevelEnabled) return lv ? 'Auto · ' + lv.height + 'p' : 'Auto';
      return lv ? lv.height + 'p' : 'Auto';
    }
    function refresh() { btn.textContent = label(); }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = !list.hidden;
      list.hidden = open;
      btn.setAttribute('aria-expanded', String(!open));
    });

    list.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-level]');
      if (!b) return;
      hls.currentLevel = Number(b.getAttribute('data-level'));
      [].forEach.call(list.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      list.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      refresh();
    });

    // close when the attention goes elsewhere
    document.addEventListener('click', function () {
      list.hidden = true; btn.setAttribute('aria-expanded', 'false');
    });

    // while on Auto the label follows whatever hls.js settles on
    hls.on(window.Hls.Events.LEVEL_SWITCHED, refresh);
    refresh();
  }

  /**
   * Fill in the recordings that sit inside a lesson body. The body arrives
   * with an empty marker per clip; each gets its own signed URL.
   */
  function mountClips(scope, lesson) {
    var marks = scope.querySelectorAll('.lesson-clip');
    if (!marks.length) return;
    var mine = videoGen;

    [].forEach.call(marks, function (mark) {
      var idx = Number(mark.getAttribute('data-clip'));
      var meta = (lesson.clips || [])[idx] || {};
      if (meta.aspect) mark.style.aspectRatio = String(meta.aspect);
      mark.innerHTML = '<div class="clip-msg">Loading video…</div>';

      fetch('/api/video/sign?lesson=' + encodeURIComponent(lesson.libId) + '&clip=' + idx,
            { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (mine !== videoGen) return;
          if (!v || !v.url) { mark.innerHTML = '<div class="clip-msg">Video unavailable.</div>'; return; }
          var el = document.createElement('video');
          el.controls = true; el.playsInline = true; el.preload = 'metadata';
          if (v.poster) el.poster = v.poster;
          mark.innerHTML = ''; mark.appendChild(el);
          el.addEventListener('loadedmetadata', function () {
            if (el.videoWidth && el.videoHeight) mark.style.aspectRatio = el.videoWidth + ' / ' + el.videoHeight;
          });
          attachStream(el, v, mine, function (msg) { mark.innerHTML = '<div class="clip-msg">' + esc(msg) + '</div>'; });
        })
        .catch(function () { if (mine === videoGen) mark.innerHTML = ''; });
    });
  }

  function gotoLesson(idx) {
    curIdx = idx;
    var l = curFlat[idx];
    document.getElementById('pl-count').textContent = 'Lesson ' + (idx + 1) + ' of ' + curFlat.length;
    document.getElementById('pl-title').textContent = l.title;
    mountVideo(l);
    document.getElementById('pl-dur').textContent = l.duration ? ('Duration ' + l.duration) : '';
    document.getElementById('pl-prev').disabled = idx === 0;
    document.getElementById('pl-next').disabled = idx === curFlat.length - 1;
    updateCompleteBtn();
    updateBookmarkBtn();
    updateHint();
    renderSideMenu();

    var body = document.getElementById('pl-content');
    body.innerHTML = '<p style="color:var(--txt-3);font-family:var(--mono)">Loading…</p>';

      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (it) {
        body.innerHTML = (it && it.bodyHtml) ? it.bodyHtml
          : '<p style="color:var(--txt-3)">Lesson notes will appear here.</p>';
        // a lesson can carry its own recordings in the body — fill them in
        mountClips(body, l);

      .catch(function () { body.innerHTML = '<p style="color:#fca5a5">Could not load this lesson.</p>'; });

    else { btn.classList.remove('is-done'); lbl.textContent = last ? 'Complete course' : 'Complete lesson'; }

    var l = curFlat[curIdx];

  /* --- left button: the course discussion --- */
  var commentsLoaded = null;  // slug currently shown in the panel
  var replyTo = null;         // comment id being replied to

  function toggleComments() {

  function setCommentCount(n) {

  function loadComments(slug, force) {
    if (!slug) return Promise.resolve();
    var list = document.getElementById('plc-list');
    if (force || commentsLoaded !== slug) list.innerHTML = '<p class="plc-empty">Loading…</p>';
    return fetch('/api/comments/list?course=' + encodeURIComponent(slug), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || slug !== curCourseSlug) return;
        commentsLoaded = slug;
        var items = d.comments || [];
        renderComments(items);
        setCommentCount(items.filter(function (x) { return !x.removed; }).length);
      })
      .catch(function () {
        list.innerHTML = '<p class="plc-empty" style="color:#fca5a5">Could not load the comments.</p>';
      });
  }

  function when(iso) {
    var t = new Date(iso).getTime();
    if (!t) return '';
    var s2 = Math.round((Date.now() - t) / 1000);
    if (s2 < 60) return 'just now';
    if (s2 < 3600) return Math.floor(s2 / 60) + 'm ago';
    if (s2 < 86400) return Math.floor(s2 / 3600) + 'h ago';
    if (s2 < 604800) return Math.floor(s2 / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }

  function cmtHTML(c) {
    if (c.removed) {
      return '<div class="cmt removed" data-id="' + c.id + '">' +
        '<span class="av" style="background:var(--bg-4);color:var(--txt-3)">–</span>' +
        '<div class="cb"><div class="ch"><span class="cn" style="color:var(--txt-3)">Removed</span></div>' +
        '<div class="ctext">This comment was removed.</div></div></div>';
    }
    var h = hue(c.author || 'member');
    var initial = String(c.author || '?').trim().charAt(0).toUpperCase();
    return '<div class="cmt" data-id="' + c.id + '">' +
      '<span class="av" style="background:linear-gradient(140deg,hsl(' + h + ',72%,64%),hsl(' + ((h + 40) % 360) + ',72%,50%))">' + esc(initial) + '</span>' +
      '<div class="cb">' +
        '<div class="ch"><span class="cn">' + esc(c.author) + '</span>' +
        (c.isAdmin ? '<span class="badge">Admin</span>' : '') +
        '<span class="ct">' + esc(when(c.createdAt)) + '</span></div>' +
        (c.lessonTitle ? '<div class="cl">on ' + esc(c.lessonTitle) + '</div>' : '') +
        '<div class="ctext">' + esc(c.body) + '</div>' +
        '<div class="ca"><button data-reply="' + c.id + '">Reply</button>' +
        (c.canDelete ? '<button data-del="' + c.id + '">Delete</button>' : '') + '</div>' +
      '</div></div>';
  }

  function threadHTML(c, kids) {
    var replies = kids[c.id] || [];
    return cmtHTML(c) + (replies.length
      ? '<div class="cmt-replies">' + replies.map(function (r) { return threadHTML(r, kids); }).join('') + '</div>'
      : '');
  }

  function renderComments(items) {
    var list = document.getElementById('plc-list');
    if (!items.length) {
      list.innerHTML = '<p class="plc-empty">No comments on this course yet.<br>Ask the first question — we answer here.</p>';
      return;
    }
    var kids = {}, seen = {};
    items.forEach(function (c) { seen[c.id] = true; });
    items.forEach(function (c) { if (c.parentId != null && seen[c.parentId]) (kids[c.parentId] ||= []).push(c); });
    var html = '';
    items.forEach(function (c) {
      // replies render under their parent; one whose parent is gone stands alone
      if (c.parentId != null && seen[c.parentId]) return;
      html += '<div>' + threadHTML(c, kids) + '</div>';
    });
    list.innerHTML = html;
    [].forEach.call(list.querySelectorAll('[data-reply]'), function (b) {
      b.addEventListener('click', function () { startReply(Number(b.getAttribute('data-reply'))); });
    });
    [].forEach.call(list.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () { removeComment(Number(b.getAttribute('data-del'))); });
    });
    list.scrollTop = list.scrollHeight;
  }

  function startReply(id) {
    replyTo = id;
    updateHint();
    document.getElementById('plc-text').focus();
  }

  function updateHint() {
    var hint = document.getElementById('plc-hint');
    if (!hint) return;
    if (replyTo) {
      var nameEl = document.querySelector('.cmt[data-id="' + replyTo + '"] .cn');
      hint.innerHTML = 'Replying to ' + esc(nameEl ? nameEl.textContent : 'comment') + ' · <button type="button" id="plc-cancel">cancel</button>';
      document.getElementById('plc-cancel').addEventListener('click', function () { replyTo = null; updateHint(); });
    } else {
      var l = curFlat[curIdx];
      hint.textContent = l ? ('On: ' + l.title) : '';
    }
  }

  function submitComment() {
    var text = document.getElementById('plc-text');
    var nameEl = document.getElementById('plc-name');
    var send = document.getElementById('plc-send');
    var body = text.value.trim();
    if (!body || !curCourseSlug) return;
    var l = curFlat[curIdx] || {};
    var payload = {
      course: curCourseSlug, lessonId: l.libId, lessonTitle: l.title,
      parentId: replyTo, body: body
    };
    var newName = !nameEl.hidden ? nameEl.value.trim() : '';
    if (newName) payload.displayName = newName;
    send.disabled = true;
    fetch('/api/comments/create', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { alert('Could not post that comment. Please try again.'); return; }
        text.value = '';
        replyTo = null;
        if (newName) { me.hasName = true; me.name = newName; nameEl.hidden = true; }
        return loadComments(curCourseSlug, true).then(updateHint);
      })
      .catch(function () { alert('Could not post that comment. Please try again.'); })
      .then(function () { send.disabled = false; });
  }

  function removeComment(id) {
    if (!window.confirm('Delete this comment?')) return;
    fetch('/api/comments/delete', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function (r) { if (r.ok) loadComments(curCourseSlug, true); });
  }

  function renderSideMenu() {
    var tree = courseCache[curCourseSlug];
    var list = document.getElementById('pl-side-list');
    var gi = 0, html = '';
    (tree.sections || []).forEach(function (s, si) {
      html += '<div class="ps-sec">' + esc(sectionHeading(s.name, si)) + '</div>';
      (s.lessons || []).forEach(function (l) {
        var idx = gi++;
        html += '<div class="ps-row ' + (idx === curIdx ? 'active ' : '') + (isDone(l.libId) ? 'done' : '') + '" data-idx="' + idx + '">' +
          '<span class="rc">' + (isDone(l.libId) ? '✓' : '') + '</span>' +
          '<span class="rt">' + esc(l.title) + '</span>' +
          '<span class="rd">' + esc(l.duration || '') + '</span></div>';
      });

    [].forEach.call(list.querySelectorAll('.ps-row'), function (row) {
      row.addEventListener('click', function () {
        gotoLesson(Number(row.getAttribute('data-idx')));
